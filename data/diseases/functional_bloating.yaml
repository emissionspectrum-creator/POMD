id: functional_bloating
name: Functional abdominal bloating / distension
must_not_miss: false
timecourse: [chronic]
status: draft
one_liner: >
  Recurrent sensation of bloating, often with visible distension that is flat on waking and builds through the
  day, without a structural cause and without meeting criteria for IBS, functional dyspepsia, or constipation.

symptoms:
  - when: distension_pattern = fluctuating
    text: Comes and goes; flat in the morning, worse by evening
  - when: distension_duration = gt3m
    text: Chronic (Rome IV — at least 3 months, onset ≥ 6 months ago)
  - when: episodes = recurrent
    text: Recurrent, long-standing
  - when: bloating_features = visible | tight_clothes
    text: Visible distension or tight clothes later in the day
  - when: meal_relation = worse_eating
    text: Often worse after meals
  - when: assoc_sys = no weight_loss
    text: No weight loss
  - when: assoc_gi = no vomiting | melena | hematochezia
    text: No vomiting or GI bleeding
  - when: age_group = under_40 | age_40_59
    text: Usually younger patients; more common in women

pe:
  - when: abd_contour = flat | mild
    text: Normal or mildly distended (examined in the morning it is often flat)
  - when: distension_pe = no flank_dullness
    text: No flank dullness
  - when: tenderness = none
    text: Non-tender
  - when: palpable = no ascites | mass
    text: No ascites or mass

labs:
  - CBC, CRP normal (anemia or raised CRP argues against a functional cause)
  - Consider TSH and celiac serology only if there are other clues

imaging:
  - Not routinely needed without alarm features; ultrasound if distension is persistent rather than fluctuating

pitfalls:
  - Distension that does not settle overnight, or a girth that keeps growing, is not functional — look for ascites or a mass.
  - New-onset bloating in a woman over 50 should prompt a pelvic ultrasound (ovarian cancer).
  - Central obesity and weight gain are a common cause of "my belly is getting bigger"; abdomino-phrenic dyssynergia is a recognised mechanism of visible distension.
  - Screen for overlap with IBS, constipation, and lactose or fructose intolerance before labelling it purely functional.
