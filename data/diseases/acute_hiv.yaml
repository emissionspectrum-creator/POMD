id: acute_hiv
name: Acute HIV infection
must_not_miss: true
timecourse: [acute]
status: draft
one_liner: >
  A mononucleosis-like illness — fever, sore throat, rash, lymphadenopathy, myalgia, sometimes oral ulcers or
  diarrhea — 2–4 weeks after sexual or blood exposure, often with a mild ALT rise; highly infectious and treatable.

symptoms:
  - when: risk = sti_risk
    text: Recent condomless sex, new or multiple partners, MSM
  - when: viral_exposure = idu
    text: Injection drug use
  - when: assoc_sys = fever | malaise
    text: Fever, fatigue
  - when: viral_sx = rash
    text: Maculopapular rash on the trunk
  - when: viral_sx = sore_throat | lymph_nodes
    text: Sore throat, swollen glands
  - when: viral_sx = myalgia
    text: Myalgia, headache
  - when: lft_duration = lt1m | first_found
    text: Acute
  - when: age_group = under_40 | age_40_59
    text: Usually younger adults

pe:
  - when: infection_pe = lymphadenopathy | rash
    text: Generalized lymphadenopathy, rash
  - when: vitals = fever
    text: Fever
  - when: palpable = splenomegaly | hepatomegaly
    text: Hepatosplenomegaly (sometimes)

labs:
  - "4th-generation HIV Ag/Ab test; HIV RNA if early infection is suspected (antibody may still be negative)"
  - "Syphilis, HBV, HCV, HAV screening (shared risks)"
  - CBC — lymphopenia, thrombocytopenia

imaging:
  - None needed

pitfalls:
  - The antibody test can be negative in the first weeks — add HIV RNA or repeat testing.
  - Ask directly and non-judgementally about sexual exposures; offer testing to all with mononucleosis-like illness and risk.
  - Early antiretroviral therapy benefits the patient and prevents transmission; refer the same week.
