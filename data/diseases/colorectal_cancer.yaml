id: colorectal_cancer
name: Colorectal cancer
must_not_miss: false
timecourse: [subacute, chronic]
status: draft
one_liner: >
  Change in bowel habit, rectal bleeding or iron-deficiency anemia with weight loss in a patient over 50 (or with a
  family history); left-sided tumors obstruct and bleed, right-sided tumors present with anemia.

symptoms:
  - when: assoc_gi = bowel_change | constipation | diarrhea
    text: Change in bowel habit
  - when: assoc_gi = hematochezia | melena
    text: Rectal bleeding or melena (right-sided)
  - when: assoc_sys = weight_loss
    text: Weight loss
  - when: assoc_sys = malaise
    text: Fatigue (anemia)
  - when: assoc_gi = tenesmus
    text: Tenesmus (rectal cancer)
  - when: assoc_gi = obstipation | bloating
    text: Obstructive symptoms
  - when: onset = gradual
    text: Insidious
  - when: duration = w1_4 | m1_3 | gt3m
    text: Weeks to months
  - when: age_group = age_40_59 | age_60_plus
    text: Mostly over 50 (rising incidence in younger adults)
  - when: risk = gi_cancer_fhx | ibd
    text: Family history, long-standing IBD
  # diarrhea complaint
  - when: stool_character = bloody | loose
    text: Loose stools, sometimes with blood
  - when: diarrhea_pattern = alternating
    text: Alternating diarrhea and constipation
  - when: diarrhea_duration = w2_4 | m1_3 | gt3m
    text: Weeks to months; new onset after 50 is an alarm feature

  # black_stool complaint
  - when: stool_appearance = maroon | fresh_blood
    text: Maroon or blood-streaked stools; right-sided tumors can give dark, near-black stools
  - when: melena_duration = w1_4 | intermittent
    text: Intermittent bleeding over weeks to months
  - when: blood_loss_sx = fatigue | dyspnea
    text: Fatigue and exertional dyspnea (iron-deficiency anemia)

  # abdominal_distension complaint
  - when: distension_pattern = rapid | progressive
    text: Increasing distension (obstructing tumor) or ascites
  - when: distension_duration = w1_4 | m1_3
    text: Weeks to months

  # weight_loss complaint
  - when: wl_duration = m1_6 | m6_12
    text: Weight loss over months
  - when: screening = no crc_screen
    text: Not up to date with colorectal screening

pe:
  - when: skin = pallor
    text: Pallor
  - when: palpable = mass | hepatomegaly
    text: Abdominal mass; hepatomegaly (metastases)
  - when: rectal = mass | fresh_blood | melena
    text: Rectal mass or blood on rectal exam
  - when: abd_contour = mild | marked
    text: Distension if obstructing

labs:
  - CBC, ferritin (iron-deficiency anemia), liver tests
  - Fecal immunochemical test (FIT) is for screening, not for symptomatic patients
  - CEA for staging / follow-up, not diagnosis

imaging:
  - Colonoscopy with biopsy
  - CT chest / abdomen / pelvis for staging; pelvic MRI for rectal cancer

pitfalls:
  - Iron-deficiency anemia in a man or post-menopausal woman needs both upper and lower endoscopy.
  - Do not attribute rectal bleeding to hemorrhoids without examining the colon in at-risk patients.
  - Obstructing cancer can present as large bowel obstruction or perforation.
