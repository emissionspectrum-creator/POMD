# Shared history vocabulary.
# Item and option ids defined here are used by complaints (data/complaints/) and diseases (data/diseases/).
# Schema: see CLAUDE.md → "Data format".

- id: sex
  label: Sex
  type: single
  template: "a {}"
  options:
    - {id: male, label: Male, frag: man}
    - {id: female, label: Female, frag: woman}

- id: age_group
  label: Age
  type: single
  ask:
    - "How old are you?"
  options:
    - {id: under_40, label: "<40", frag: under 40}
    - {id: age_40_59, label: "40–59", frag: 40–59}
    - {id: age_60_plus, label: "≥60", frag: 60 or older}

- id: repro_status
  label: Pregnancy
  type: single
  ask:
    - "When was the first day of your last period?"
    - "Is there any chance you could be pregnant?"
    - "Are your periods regular? Is this one late?"
  options:
    - {id: preg_unlikely, label: Pregnancy unlikely, frag: pregnancy is unlikely}
    - {id: preg_possible, label: Pregnancy possible, frag: pregnancy is possible}
    - {id: period_late, label: Late / missed period, frag: her last menstrual period is late, red_flag: true}
    - {id: pregnant, label: Known pregnancy, frag: she is currently pregnant}

# ---------- Location ----------

- id: pain_location
  label: Location
  type: multi
  template: "{} pain"
  ask:
    - "Where is the pain? Can you point to where it hurts the most?"
    - "Is it in one spot, or all over your belly?"
    - "Is it more on the right side or the left side?"
  options:
    - {id: epigastric, label: Epigastric, frag: epigastric}
    - {id: ruq, label: RUQ, frag: RUQ}
    - {id: luq, label: LUQ, frag: LUQ}
    - {id: periumbilical, label: Periumbilical, frag: periumbilical}
    - {id: rlq, label: RLQ, frag: RLQ}
    - {id: llq, label: LLQ, frag: LLQ}
    - {id: suprapubic, label: Suprapubic, frag: suprapubic}
    - {id: flank_r, label: Right flank, frag: right flank}
    - {id: flank_l, label: Left flank, frag: left flank}
    - {id: diffuse, label: Diffuse, frag: diffuse abdominal}

- id: pain_migration
  label: Migration
  type: single
  ask:
    - "Has the pain stayed in the same place, or has it moved since it started?"
    - "Where did the pain start, and where is it now?"
  options:
    - {id: peri_to_rlq, label: Periumbilical → RLQ, frag: "initially periumbilical, later migrating to the RLQ"}
    - {id: local_to_diffuse, label: Localized → diffuse, frag: "initially localized, later spreading over the whole abdomen"}
    - {id: none, label: No migration, frag: without migration}

# ---------- Quality ----------

- id: pain_quality
  label: Quality
  type: multi
  template: "described as {}"
  ask:
    - "How would you describe the pain — is it sharp, dull, burning, or crampy?"
    - "What does the pain feel like?"
    - "Does it feel like a gnawing, hungry kind of pain, or more like pressure?"
  options:
    - {id: colicky, label: Colicky, frag: colicky}
    - {id: cramping, label: Crampy, frag: crampy}
    - {id: burning, label: Burning, frag: burning}
    - {id: dull, label: Dull / aching, frag: dull}
    - {id: sharp, label: Sharp / stabbing, frag: sharp}
    - {id: gnawing, label: Gnawing / hunger-like, frag: gnawing}
    - {id: pressure, label: Pressure / fullness, frag: pressure-like}
    - {id: tearing, label: Tearing, frag: tearing, red_flag: true}

- id: pain_pattern
  label: Pattern
  type: single
  ask:
    - "Is the pain there all the time, or does it come and go?"
    - "When it comes, how long does each episode last?"
  options:
    - {id: constant, label: Constant, frag: constant}
    - {id: waves, label: Comes in waves, frag: coming in waves}
    - {id: attacks, label: Discrete attacks (pain-free between), frag: occurring in discrete attacks with pain-free intervals}

# ---------- Quantity ----------

- id: severity
  label: Severity (0–10)
  type: single
  template: "severity {}/10"
  ask:
    - "On a scale of zero to ten, with ten being the worst pain you can imagine, how bad is it right now?"
    - "How bad was it at its worst?"
  options:
    - {id: s1, label: "1", frag: "1"}
    - {id: s2, label: "2", frag: "2"}
    - {id: s3, label: "3", frag: "3"}
    - {id: s4, label: "4", frag: "4"}
    - {id: s5, label: "5", frag: "5"}
    - {id: s6, label: "6", frag: "6"}
    - {id: s7, label: "7", frag: "7"}
    - {id: s8, label: "8", frag: "8"}
    - {id: s9, label: "9", frag: "9"}
    - {id: s10, label: "10", frag: "10"}

- id: nocturnal
  label: Night pain
  type: single
  ask:
    - "Does the pain ever wake you up at night?"
  options:
    - {id: wakes, label: Wakes from sleep, frag: waking the patient from sleep}
    - {id: no_wake, label: Does not wake, frag: not waking the patient at night}

# ---------- Onset / duration ----------

- id: onset
  label: Onset
  type: single
  ask:
    - "Did the pain come on suddenly, or did it build up gradually?"
    - "Do you remember exactly what you were doing when it started?"
  options:
    - {id: sudden, label: Sudden (seconds–minutes), frag: sudden in onset, red_flag: true}
    - {id: hours, label: Over hours, frag: developing over a few hours}
    - {id: gradual, label: Gradual (days or longer), frag: gradual in onset}

# `tc` tags (acute / subacute / chronic) drive the time-course badges in the differential.
- id: duration
  label: Duration
  type: single
  ask:
    - "When did the pain start?"
    - "How long have you had this pain?"
  options:
    - {id: lt6h, label: "<6 h", frag: for less than 6 hours, tc: [acute]}
    - {id: h6_24, label: "6–24 h", frag: for 6–24 hours, tc: [acute]}
    - {id: d1_3, label: "1–3 d", frag: for 1–3 days, tc: [acute]}
    - {id: d4_7, label: "4–7 d", frag: for 4–7 days, tc: [acute]}
    - {id: w1_4, label: "1–4 wk", frag: for 1–4 weeks, tc: [subacute]}
    - {id: m1_3, label: "1–3 mo", frag: for 1–3 months, tc: [chronic]}
    - {id: gt3m, label: ">3 mo", frag: for more than 3 months, tc: [chronic]}

- id: episodes
  label: Previous episodes
  type: single
  ask:
    - "Have you ever had pain like this before?"
    - "Is this the first time, or does it keep coming back?"
  options:
    - {id: first, label: First episode, frag: this is the first such episode}
    - {id: recurrent, label: Recurrent similar episodes, frag: similar episodes have occurred before}

# ---------- Precipitating factors ----------

- id: precipitant
  label: Trigger
  type: multi
  template: "onset {}"
  ask:
    - "Did anything set it off — a big or fatty meal, alcohol, or any new medicine?"
    - "What were you doing when the pain started?"
    - "Have you had any injury or blow to your belly recently?"
  options:
    - {id: fatty_meal, label: Fatty / heavy meal, frag: after a fatty or heavy meal}
    - {id: alcohol, label: Alcohol binge, frag: after heavy alcohol intake}
    - {id: nsaid, label: NSAID / aspirin, frag: after taking NSAIDs or aspirin}
    - {id: trauma, label: Abdominal trauma, frag: after abdominal trauma, red_flag: true}
    - {id: exertion, label: Exertion, frag: during physical exertion}
    - {id: none, label: No clear trigger, frag: without an identifiable trigger, exclusive: true}

# ---------- Exacerbating / relieving ----------

- id: meal_relation
  label: Relation to meals
  type: multi
  ask:
    - "Does eating make the pain better or worse?"
    - "Is the pain worse when your stomach is empty?"
    - "How soon after eating does the pain come on?"
  options:
    - {id: worse_eating, label: Worse after eating, frag: worse after eating}
    - {id: better_eating, label: Better after eating, frag: relieved by eating}
    - {id: worse_hungry, label: Worse when hungry, frag: worse on an empty stomach}
    - {id: unrelated, label: Unrelated to meals, frag: unrelated to meals, exclusive: true}

- id: aggravating
  label: Worse with
  type: multi
  ask:
    - "Is there anything that makes the pain worse?"
    - "Does it hurt more when you move, cough, or go over a bump in the car?"
    - "Does taking a deep breath make it worse?"
  options:
    - {id: movement, label: Movement / coughing / bumps, frag: worse with movement or coughing}
    - {id: deep_breath, label: Deep breathing, frag: worse on deep inspiration}
    - {id: lying_flat, label: Lying flat, frag: worse lying flat}

- id: relieving
  label: Better with
  type: multi
  ask:
    - "Is there anything that makes the pain better?"
    - "Is there a position that eases it?"
    - "Have you taken anything for it? Did it help?"
  options:
    - {id: leaning_forward, label: Sitting up / leaning forward, frag: relieved by sitting up and leaning forward}
    - {id: lying_still, label: Lying still, frag: eased by lying still}
    - {id: antacid, label: Antacids / PPI, frag: relieved by antacids or acid suppressants}
    - {id: defecation, label: Bowel movement / passing gas, frag: relieved by defecation or passing gas}
    - {id: vomiting, label: Vomiting, frag: temporarily relieved by vomiting}
    - {id: no_position, label: No comfortable position, frag: with no position of comfort}
    - {id: nothing, label: Nothing helps, frag: not relieved by anything, exclusive: true}

# ---------- Radiation ----------

- id: radiation
  label: Radiation
  type: multi
  template: "radiating {}"
  ask:
    - "Does the pain spread or move anywhere else — like your back, shoulder, or groin?"
    - "Do you feel it going through to your back?"
  options:
    - {id: back, label: Back, frag: to the back}
    - {id: r_shoulder, label: Right shoulder / scapula, frag: to the right shoulder or scapula}
    - {id: l_shoulder, label: Left shoulder, frag: to the left shoulder}
    - {id: groin, label: Groin / genitals, frag: to the groin}
    - {id: chest_arm_jaw, label: Chest / arm / jaw, frag: "to the chest, arm, or jaw", red_flag: true}
    - {id: none, label: No radiation, frag: without radiation, exclusive: true}

# ---------- Associated symptoms (presence: click = present, again = absent, again = clear) ----------

- id: assoc_gi
  label: GI symptoms
  type: presence
  ask:
    - "Have you felt sick to your stomach or thrown up? Was there any blood in it?"
    - "Any change in your bowel movements — diarrhea, constipation, or black or bloody stools?"
    - "Have you been able to pass gas?"
  options:
    - {id: nausea, label: Nausea, frag: nausea}
    - {id: vomiting, label: Vomiting, frag: vomiting}
    - {id: hematemesis, label: Vomiting blood, frag: hematemesis, red_flag: true}
    - {id: anorexia, label: Loss of appetite, frag: anorexia}
    - {id: early_satiety, label: Early satiety, frag: early satiety}
    - {id: bloating, label: Bloating, frag: bloating}
    - {id: heartburn, label: Heartburn / regurgitation, frag: heartburn or acid regurgitation}
    - {id: dysphagia, label: Trouble swallowing, frag: dysphagia, red_flag: true}
    - {id: diarrhea, label: Diarrhea, frag: diarrhea}
    - {id: bloody_diarrhea, label: Bloody diarrhea, frag: bloody diarrhea}
    - {id: constipation, label: Constipation, frag: constipation}
    - {id: obstipation, label: No stool or flatus, frag: inability to pass stool or flatus, red_flag: true}
    - {id: melena, label: Black stool (melena), frag: melena, red_flag: true}
    - {id: hematochezia, label: Fresh blood per rectum, frag: hematochezia, red_flag: true}
    - {id: tenesmus, label: Tenesmus / urgency, frag: tenesmus and urgency}
    - {id: bowel_change, label: Change in bowel habit, frag: a recent change in bowel habit}
    - {id: steatorrhea, label: "Greasy, floating stools", frag: steatorrhea}

- id: assoc_sys
  label: Systemic / hepatobiliary
  type: presence
  ask:
    - "Have you had any fever, chills, or shaking?"
    - "Has anyone noticed your skin or eyes turning yellow? Has your urine been darker than usual?"
    - "Have you lost weight without trying? About how much, and over how long?"
  options:
    - {id: fever, label: Fever, frag: fever}
    - {id: chills, label: Chills / rigors, frag: chills or rigors}
    - {id: jaundice, label: Jaundice, frag: jaundice, red_flag: true}
    - {id: dark_urine, label: Dark urine, frag: tea-colored urine}
    - {id: pale_stool, label: Pale stools, frag: pale stools}
    - {id: pruritus, label: Itching, frag: pruritus}
    - {id: weight_loss, label: Weight loss, frag: unintentional weight loss, red_flag: true}
    - {id: night_sweats, label: Night sweats, frag: night sweats}
    - {id: malaise, label: Fatigue / malaise, frag: malaise}

- id: assoc_gu
  label: Urinary / gynecologic
  type: presence
  ask:
    - "Any burning or pain when you pass urine? Are you going more often than usual?"
    - "Have you seen any blood in your urine? Are you able to pass urine normally?"
    - "Any unusual vaginal bleeding or discharge? Any pain during sex?"
  options:
    - {id: dysuria, label: Dysuria, frag: dysuria}
    - {id: frequency, label: Frequency / urgency, frag: urinary frequency or urgency}
    - {id: hematuria, label: Blood in urine, frag: hematuria}
    - {id: cannot_void, label: Unable to pass urine, frag: inability to void}
    - {id: vaginal_bleeding, label: Vaginal bleeding, frag: vaginal bleeding}
    - {id: vaginal_discharge, label: Vaginal discharge, frag: abnormal vaginal discharge}
    - {id: dyspareunia, label: Pain with intercourse, frag: dyspareunia}

- id: assoc_other
  label: Cardiopulmonary / other
  type: presence
  ask:
    - "Any chest pain, tightness, or shortness of breath?"
    - "Have you fainted or felt like you were about to pass out?"
    - "Any cough? Have you been very thirsty or peeing a lot more than usual?"
  options:
    - {id: chest_pain, label: Chest pain / tightness, frag: chest pain, red_flag: true}
    - {id: dyspnea, label: Shortness of breath, frag: dyspnea}
    - {id: cough, label: Cough, frag: cough}
    - {id: diaphoresis, label: Sweating, frag: diaphoresis}
    - {id: syncope, label: Fainting / near-fainting, frag: syncope or presyncope, red_flag: true}
    - {id: confusion, label: Confusion, frag: confusion, red_flag: true}
    - {id: polyuria, label: Thirst / polyuria, frag: polyuria and polydipsia}
    - {id: food_fear, label: Fear of eating, frag: fear of eating because of the pain}

# ---------- Relevant history ----------

- id: risk
  label: Past history / risk factors
  type: presence
  ask:
    - "Do you have any ongoing medical problems, like heart disease, diabetes, or an irregular heartbeat?"
    - "Have you ever had surgery on your belly? Have you been told you have gallstones or an ulcer?"
    - "How much alcohol do you drink in a typical week? Do you take painkillers like ibuprofen, aspirin, or blood thinners?"
  options:
    - {id: gallstones, label: Known gallstones, frag: known gallstones}
    - {id: biliary_procedure, label: Biliary stent / prior ERCP or biliary surgery, frag: a biliary stent or prior biliary intervention}
    - {id: alcohol, label: Heavy alcohol use, frag: heavy alcohol use}
    - {id: nsaid, label: Regular NSAID / aspirin, frag: regular NSAID or aspirin use}
    - {id: anticoag, label: Anticoagulant use, frag: anticoagulant use}
    - {id: new_meds, label: New drug / herbal supplement, frag: a recently started medication or herbal supplement}
    - {id: retention_drugs, label: Anticholinergic / opioid drugs, frag: anticholinergic or opioid medication use}
    - {id: af, label: Atrial fibrillation, frag: atrial fibrillation}
    - {id: atherosclerosis, label: CAD / PAD / stroke, frag: atherosclerotic vascular disease}
    - {id: smoking, label: Smoking, frag: smoking}
    - {id: aaa, label: Known AAA, frag: a known abdominal aortic aneurysm}
    - {id: diabetes, label: Diabetes, frag: diabetes mellitus}
    - {id: hypertriglyceridemia, label: Hypertriglyceridemia, frag: hypertriglyceridemia}
    - {id: prior_surgery, label: Prior abdominal surgery, frag: prior abdominal surgery}
    - {id: hernia, label: Known hernia, frag: a known abdominal wall or groin hernia}
    - {id: pud, label: Prior peptic ulcer, frag: peptic ulcer disease}
    - {id: hpylori, label: H. pylori, frag: H. pylori infection}
    - {id: ibd, label: Known IBD, frag: inflammatory bowel disease}
    - {id: diverticular, label: Diverticulosis / prior diverticulitis, frag: diverticular disease}
    - {id: liver_disease, label: Chronic liver disease / HBV / HCV, frag: chronic liver disease or viral hepatitis}
    - {id: gi_cancer_fhx, label: Family history of GI cancer, frag: a family history of GI cancer}
    - {id: immunocompromised, label: Immunocompromised, frag: immunocompromise}
    - {id: sick_contacts, label: Sick contacts / suspect food, frag: sick contacts or a suspicious food exposure}
    - {id: travel, label: Recent travel, frag: recent travel}
    - {id: sti_risk, label: New / multiple sexual partners, frag: STI risk (new or multiple sexual partners)}
    - {id: bph, label: BPH / prostatic symptoms, frag: benign prostatic hyperplasia}
    - {id: kidney_stones, label: Prior kidney stones, frag: kidney stones}
    - {id: chronic_constipation, label: Chronic constipation, frag: chronic constipation}
    - {id: hypercoagulable, label: Hypercoagulable state / malignancy, frag: a hypercoagulable state or active malignancy}
    - {id: splenomegaly_mono, label: Splenomegaly / recent mono, frag: known splenomegaly or recent infectious mononucleosis}
