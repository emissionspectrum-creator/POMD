# Shared history vocabulary.
# Item and option ids defined here are used by complaints (data/complaints/) and diseases (data/diseases/).
# Schema: see CLAUDE.md → "Data format".

- id: sex
  label: Sex
  type: single
  template: "a {}"
  options:
    - {id: male, label: Male, frag: man}
    - {id: female, label: Female, frag: woman}

- id: age_group
  label: Age
  type: single
  ask:
    - "How old are you?"
  options:
    - {id: under_40, label: "<40", frag: under 40}
    - {id: age_40_59, label: "40–59", frag: 40–59}
    - {id: age_60_plus, label: "≥60", frag: 60 or older}

- id: repro_status
  label: Pregnancy
  type: single
  ask:
    - "When was the first day of your last period?"
    - "Is there any chance you could be pregnant?"
    - "Are your periods regular? Is this one late?"
  options:
    - {id: preg_unlikely, label: Pregnancy unlikely, frag: pregnancy is unlikely}
    - {id: preg_possible, label: Pregnancy possible, frag: pregnancy is possible}
    - {id: period_late, label: Late / missed period, frag: her last menstrual period is late, red_flag: true}
    - {id: pregnant, label: Known pregnancy, frag: she is currently pregnant}

# ---------- Location ----------

- id: pain_location
  label: Location
  type: multi
  template: "{} pain"
  ask:
    - "Where is the pain? Can you point to where it hurts the most?"
    - "Is it in one spot, or all over your belly?"
    - "Is it more on the right side or the left side?"
  options:
    - {id: epigastric, label: Epigastric, frag: epigastric}
    - {id: ruq, label: RUQ, frag: RUQ}
    - {id: luq, label: LUQ, frag: LUQ}
    - {id: periumbilical, label: Periumbilical, frag: periumbilical}
    - {id: rlq, label: RLQ, frag: RLQ}
    - {id: llq, label: LLQ, frag: LLQ}
    - {id: suprapubic, label: Suprapubic, frag: suprapubic}
    - {id: flank_r, label: Right flank, frag: right flank}
    - {id: flank_l, label: Left flank, frag: left flank}
    - {id: diffuse, label: Diffuse, frag: diffuse abdominal}

- id: pain_migration
  label: Migration
  type: single
  ask:
    - "Has the pain stayed in the same place, or has it moved since it started?"
    - "Where did the pain start, and where is it now?"
  options:
    - {id: peri_to_rlq, label: Periumbilical → RLQ, frag: "initially periumbilical, later migrating to the RLQ"}
    - {id: local_to_diffuse, label: Localized → diffuse, frag: "initially localized, later spreading over the whole abdomen"}
    - {id: none, label: No migration, frag: without migration}

# ---------- Quality ----------

- id: pain_quality
  label: Quality
  type: multi
  template: "described as {}"
  ask:
    - "How would you describe the pain — is it sharp, dull, burning, or crampy?"
    - "What does the pain feel like?"
    - "Does it feel like a gnawing, hungry kind of pain, or more like pressure?"
  options:
    - {id: colicky, label: Colicky, frag: colicky}
    - {id: cramping, label: Crampy, frag: crampy}
    - {id: burning, label: Burning, frag: burning}
    - {id: dull, label: Dull / aching, frag: dull}
    - {id: sharp, label: Sharp / stabbing, frag: sharp}
    - {id: gnawing, label: Gnawing / hunger-like, frag: gnawing}
    - {id: pressure, label: Pressure / fullness, frag: pressure-like}
    - {id: tearing, label: Tearing, frag: tearing, red_flag: true}

- id: pain_pattern
  label: Pattern
  type: single
  ask:
    - "Is the pain there all the time, or does it come and go?"
    - "When it comes, how long does each episode last?"
  options:
    - {id: constant, label: Constant, frag: constant}
    - {id: waves, label: Comes in waves, frag: coming in waves}
    - {id: attacks, label: Discrete attacks (pain-free between), frag: occurring in discrete attacks with pain-free intervals}

# How long each episode lasts (for intermittent pain); separate from `duration` (since onset).
- id: episode_duration
  label: Each episode lasts
  type: single
  template: "each episode lasting {}"
  ask:
    - "When the pain comes on, how long does it usually last?"
    - "Does each attack last a few minutes, or more like an hour or longer?"
  options:
    - {id: lt5m, label: "<5 min", frag: less than 5 minutes}
    - {id: m5_30, label: "5–30 min", frag: 5–30 minutes}
    - {id: m30_60, label: "30–60 min", frag: 30–60 minutes}
    - {id: h1_6, label: "1–6 h", frag: 1–6 hours}
    - {id: gt6h, label: ">6 h", frag: more than 6 hours}

# ---------- Quantity ----------

- id: severity
  label: Severity (0–10)
  type: single
  template: "severity {}/10"
  ask:
    - "On a scale of zero to ten, with ten being the worst pain you can imagine, how bad is it right now?"
    - "How bad was it at its worst?"
  options:
    - {id: s1, label: "1", frag: "1"}
    - {id: s2, label: "2", frag: "2"}
    - {id: s3, label: "3", frag: "3"}
    - {id: s4, label: "4", frag: "4"}
    - {id: s5, label: "5", frag: "5"}
    - {id: s6, label: "6", frag: "6"}
    - {id: s7, label: "7", frag: "7"}
    - {id: s8, label: "8", frag: "8"}
    - {id: s9, label: "9", frag: "9"}
    - {id: s10, label: "10", frag: "10"}

- id: nocturnal
  label: Night pain
  type: single
  ask:
    - "Does the pain ever wake you up at night?"
  options:
    - {id: wakes, label: Wakes from sleep, frag: waking the patient from sleep}
    - {id: no_wake, label: Does not wake, frag: not waking the patient at night}

# ---------- Onset / duration ----------

- id: onset
  label: Onset
  type: single
  ask:
    - "Did the pain come on suddenly, or did it build up gradually?"
    - "Do you remember exactly what you were doing when it started?"
  options:
    - {id: sudden, label: Sudden (seconds–minutes), frag: sudden in onset, red_flag: true}
    - {id: hours, label: Over hours, frag: developing over a few hours}
    - {id: gradual, label: Gradual (days or longer), frag: gradual in onset}

# `tc` tags (acute / subacute / chronic) drive the time-course badges in the differential.
- id: duration
  label: Duration
  type: single
  ask:
    - "When did the pain start?"
    - "How long have you had this pain?"
  options:
    - {id: lt6h, label: "<6 h", frag: for less than 6 hours, tc: [acute]}
    - {id: h6_24, label: "6–24 h", frag: for 6–24 hours, tc: [acute]}
    - {id: d1_3, label: "1–3 d", frag: for 1–3 days, tc: [acute]}
    - {id: d4_7, label: "4–7 d", frag: for 4–7 days, tc: [acute]}
    - {id: w1_4, label: "1–4 wk", frag: for 1–4 weeks, tc: [subacute]}
    - {id: m1_3, label: "1–3 mo", frag: for 1–3 months, tc: [chronic]}
    - {id: gt3m, label: ">3 mo", frag: for more than 3 months, tc: [chronic]}

- id: episodes
  label: Previous episodes
  type: single
  ask:
    - "Have you ever had pain like this before?"
    - "Is this the first time, or does it keep coming back?"
  options:
    - {id: first, label: First episode, frag: this is the first such episode}
    - {id: recurrent, label: Recurrent similar episodes, frag: similar episodes have occurred before}

# ---------- Precipitating factors ----------

- id: precipitant
  label: Trigger
  type: multi
  template: "onset {}"
  ask:
    - "Did anything set it off — a big or fatty meal, alcohol, or any new medicine?"
    - "What were you doing when the pain started?"
    - "Have you had any injury or blow to your belly recently?"
  options:
    - {id: fatty_meal, label: Fatty / heavy meal, frag: after a fatty or heavy meal}
    - {id: alcohol, label: Alcohol binge, frag: after heavy alcohol intake}
    - {id: nsaid, label: NSAID / aspirin, frag: after taking NSAIDs or aspirin}
    - {id: trauma, label: Abdominal trauma, frag: after abdominal trauma, red_flag: true}
    - {id: exertion, label: Exertion, frag: during physical exertion}
    - {id: none, label: No clear trigger, frag: without an identifiable trigger, exclusive: true}

# ---------- Exacerbating / relieving ----------

- id: meal_relation
  label: Relation to meals
  type: multi
  ask:
    - "Does eating make the pain better or worse?"
    - "Is the pain worse when your stomach is empty?"
    - "How soon after eating does the pain come on?"
  options:
    - {id: worse_eating, label: Worse after eating, frag: worse after eating}
    - {id: better_eating, label: Better after eating, frag: relieved by eating}
    - {id: worse_hungry, label: Worse when hungry, frag: worse on an empty stomach}
    - {id: unrelated, label: Unrelated to meals, frag: unrelated to meals, exclusive: true}

- id: aggravating
  label: Worse with
  type: multi
  ask:
    - "Is there anything that makes the pain worse?"
    - "Does it hurt more when you move, cough, or go over a bump in the car?"
    - "Does taking a deep breath make it worse?"
  options:
    - {id: movement, label: Movement / coughing / bumps, frag: worse with movement or coughing}
    - {id: deep_breath, label: Deep breathing, frag: worse on deep inspiration}
    - {id: lying_flat, label: Lying flat, frag: worse lying flat}

- id: relieving
  label: Better with
  type: multi
  ask:
    - "Is there anything that makes the pain better?"
    - "Is there a position that eases it?"
    - "Have you taken anything for it? Did it help?"
  options:
    - {id: leaning_forward, label: Sitting up / leaning forward, frag: relieved by sitting up and leaning forward}
    - {id: lying_still, label: Lying still, frag: eased by lying still}
    - {id: antacid, label: Antacids / PPI, frag: relieved by antacids or acid suppressants}
    - {id: defecation, label: Bowel movement / passing gas, frag: relieved by defecation or passing gas}
    - {id: vomiting, label: Vomiting, frag: temporarily relieved by vomiting}
    - {id: no_position, label: No comfortable position, frag: with no position of comfort}
    - {id: nothing, label: Nothing helps, frag: not relieved by anything, exclusive: true}

# ---------- Radiation ----------

- id: radiation
  label: Radiation
  type: multi
  template: "radiating {}"
  ask:
    - "Does the pain spread or move anywhere else — like your back, shoulder, or groin?"
    - "Do you feel it going through to your back?"
  options:
    - {id: back, label: Back, frag: to the back}
    - {id: r_shoulder, label: Right shoulder / scapula, frag: to the right shoulder or scapula}
    - {id: l_shoulder, label: Left shoulder, frag: to the left shoulder}
    - {id: groin, label: Groin / genitals, frag: to the groin}
    - {id: chest_arm_jaw, label: Chest / arm / jaw, frag: "to the chest, arm, or jaw", red_flag: true}
    - {id: none, label: No radiation, frag: without radiation, exclusive: true}

# ---------- Associated symptoms (presence: click = present, again = absent, again = clear) ----------

- id: assoc_gi
  label: GI symptoms
  type: presence
  ask:
    - "Have you felt sick to your stomach or thrown up? Was there any blood in it?"
    - "Any change in your bowel movements — diarrhea, constipation, or black or bloody stools?"
    - "Have you been able to pass gas?"
  options:
    - {id: nausea, label: Nausea, frag: nausea}
    - {id: vomiting, label: Vomiting, frag: vomiting}
    - {id: hematemesis, label: Vomiting blood, frag: hematemesis, red_flag: true}
    - {id: anorexia, label: Loss of appetite, frag: anorexia}
    - {id: early_satiety, label: Early satiety, frag: early satiety}
    - {id: bloating, label: Bloating, frag: bloating}
    - {id: heartburn, label: Heartburn / regurgitation, frag: heartburn or acid regurgitation}
    - {id: dysphagia, label: Trouble swallowing, frag: dysphagia, red_flag: true}
    - {id: diarrhea, label: Diarrhea, frag: diarrhea}
    - {id: bloody_diarrhea, label: Bloody diarrhea, frag: bloody diarrhea}
    - {id: constipation, label: Constipation, frag: constipation}
    - {id: obstipation, label: No stool or flatus, frag: inability to pass stool or flatus, red_flag: true}
    - {id: melena, label: Black stool (melena), frag: melena, red_flag: true}
    - {id: hematochezia, label: Fresh blood per rectum, frag: hematochezia, red_flag: true}
    - {id: tenesmus, label: Tenesmus / urgency, frag: tenesmus and urgency}
    - {id: bowel_change, label: Change in bowel habit, frag: a recent change in bowel habit}
    - {id: steatorrhea, label: "Greasy, floating stools", frag: steatorrhea}

- id: assoc_sys
  label: Systemic / hepatobiliary
  type: presence
  ask:
    - "Have you had any fever, chills, or shaking?"
    - "Has anyone noticed your skin or eyes turning yellow? Has your urine been darker than usual?"
    - "Have you lost weight without trying? About how much, and over how long?"
  options:
    - {id: fever, label: Fever, frag: fever}
    - {id: chills, label: Chills / rigors, frag: chills or rigors}
    - {id: jaundice, label: Jaundice, frag: jaundice, red_flag: true}
    - {id: dark_urine, label: Dark urine, frag: tea-colored urine}
    - {id: pale_stool, label: Pale stools, frag: pale stools}
    - {id: pruritus, label: Itching, frag: pruritus}
    - {id: weight_loss, label: Weight loss, frag: unintentional weight loss, red_flag: true}
    - {id: night_sweats, label: Night sweats, frag: night sweats}
    - {id: malaise, label: Fatigue / malaise, frag: malaise}

- id: assoc_gu
  label: Urinary / gynecologic
  type: presence
  ask:
    - "Any burning or pain when you pass urine? Are you going more often than usual?"
    - "Have you seen any blood in your urine? Are you able to pass urine normally?"
    - "Any unusual vaginal bleeding or discharge? Any pain during sex?"
  options:
    - {id: dysuria, label: Dysuria, frag: dysuria}
    - {id: frequency, label: Frequency / urgency, frag: urinary frequency or urgency}
    - {id: hematuria, label: Blood in urine, frag: hematuria}
    - {id: cannot_void, label: Unable to pass urine, frag: inability to void}
    - {id: vaginal_bleeding, label: Vaginal bleeding, frag: vaginal bleeding}
    - {id: vaginal_discharge, label: Vaginal discharge, frag: abnormal vaginal discharge}
    - {id: dyspareunia, label: Pain with intercourse, frag: dyspareunia}

- id: assoc_other
  label: Cardiopulmonary / other
  type: presence
  ask:
    - "Any chest pain, tightness, or shortness of breath?"
    - "Have you fainted or felt like you were about to pass out?"
    - "Any cough? Have you been very thirsty or peeing a lot more than usual?"
  options:
    - {id: chest_pain, label: Chest pain / tightness, frag: chest pain, red_flag: true}
    - {id: dyspnea, label: Shortness of breath, frag: dyspnea}
    - {id: cough, label: Cough, frag: cough}
    - {id: diaphoresis, label: Sweating, frag: diaphoresis}
    - {id: syncope, label: Fainting / near-fainting, frag: syncope or presyncope, red_flag: true}
    - {id: confusion, label: Confusion, frag: confusion, red_flag: true}
    - {id: polyuria, label: Thirst / polyuria, frag: polyuria and polydipsia}
    - {id: food_fear, label: Fear of eating, frag: fear of eating because of the pain}

# ---------- Relevant history ----------

- id: risk
  label: Past history / risk factors
  type: presence
  ask:
    - "Do you have any ongoing medical problems, like heart disease, diabetes, or an irregular heartbeat?"
    - "Have you ever had surgery on your belly? Have you been told you have gallstones or an ulcer?"
    - "How much alcohol do you drink in a typical week? Do you take painkillers like ibuprofen, aspirin, or blood thinners?"
  options:
    - {id: gallstones, label: Known gallstones, frag: known gallstones}
    - {id: biliary_procedure, label: Biliary stent / prior ERCP or biliary surgery, frag: a biliary stent or prior biliary intervention}
    - {id: alcohol, label: Heavy alcohol use, frag: heavy alcohol use}
    - {id: nsaid, label: Regular NSAID / aspirin, frag: regular NSAID or aspirin use}
    - {id: anticoag, label: Anticoagulant use, frag: anticoagulant use}
    - {id: new_meds, label: New drug / herbal supplement, frag: a recently started medication or herbal supplement}
    - {id: retention_drugs, label: Anticholinergic / opioid drugs, frag: anticholinergic or opioid medication use}
    - {id: af, label: Atrial fibrillation, frag: atrial fibrillation}
    - {id: atherosclerosis, label: CAD / PAD / stroke, frag: atherosclerotic vascular disease}
    - {id: smoking, label: Smoking, frag: smoking}
    - {id: aaa, label: Known AAA, frag: a known abdominal aortic aneurysm}
    - {id: diabetes, label: Diabetes, frag: diabetes mellitus}
    - {id: hypertriglyceridemia, label: Hypertriglyceridemia, frag: hypertriglyceridemia}
    - {id: prior_surgery, label: Prior abdominal surgery, frag: prior abdominal surgery}
    - {id: hernia, label: Known hernia, frag: a known abdominal wall or groin hernia}
    - {id: pud, label: Prior peptic ulcer, frag: peptic ulcer disease}
    - {id: hpylori, label: H. pylori, frag: H. pylori infection}
    - {id: ibd, label: Known IBD, frag: inflammatory bowel disease}
    - {id: diverticular, label: Diverticulosis / prior diverticulitis, frag: diverticular disease}
    - {id: liver_disease, label: Chronic liver disease / HBV / HCV, frag: chronic liver disease or viral hepatitis}
    - {id: gi_cancer_fhx, label: Family history of GI cancer, frag: a family history of GI cancer}
    - {id: immunocompromised, label: Immunocompromised, frag: immunocompromise}
    - {id: sick_contacts, label: Sick contacts / suspect food, frag: sick contacts or a suspicious food exposure}
    - {id: travel, label: Recent travel, frag: recent travel}
    - {id: sti_risk, label: New / multiple sexual partners, frag: STI risk (new or multiple sexual partners)}
    - {id: bph, label: BPH / prostatic symptoms, frag: benign prostatic hyperplasia}
    - {id: kidney_stones, label: Prior kidney stones, frag: kidney stones}
    - {id: chronic_constipation, label: Chronic constipation, frag: chronic constipation}
    - {id: hypercoagulable, label: Hypercoagulable state / malignancy, frag: a hypercoagulable state or active malignancy}
    - {id: splenomegaly_mono, label: Splenomegaly / recent mono, frag: known splenomegaly or recent infectious mononucleosis}

# ---------- Diarrhea (data/complaints/diarrhea.yaml) ----------
# Items describing the diarrhea itself. Shared concepts (fever, travel, IBD, ...) stay in the items above;
# the diarrhea complaint shows only the relevant options of those items.

# Diarrhea uses its own duration: < 2 weeks acute, 2–4 weeks persistent (subacute), > 4 weeks chronic.
- id: diarrhea_duration
  label: Duration
  type: single
  ask:
    - "How long have you had diarrhea?"
    - "When was the last time your bowel movements were normal?"
  options:
    - {id: lt3d, label: "<3 d", frag: for less than 3 days, tc: [acute]}
    - {id: d3_7, label: "3–7 d", frag: for 3–7 days, tc: [acute]}
    - {id: w1_2, label: "1–2 wk", frag: for 1–2 weeks, tc: [acute]}
    - {id: w2_4, label: "2–4 wk", frag: for 2–4 weeks, tc: [subacute]}
    - {id: m1_3, label: "1–3 mo", frag: for 1–3 months, tc: [chronic]}
    - {id: gt3m, label: ">3 mo", frag: for more than 3 months, tc: [chronic]}

- id: diarrhea_pattern
  label: Pattern
  type: single
  ask:
    - "Is it every day, or does it come and go?"
    - "Do you ever get constipated in between?"
  options:
    - {id: continuous, label: Every day, frag: occurring daily}
    - {id: intermittent, label: Comes and goes, frag: "intermittent, with normal days in between"}
    - {id: alternating, label: Alternates with constipation, frag: alternating with constipation}

- id: stool_character
  label: Stool character
  type: multi
  template: "{} diarrhea"
  ask:
    - "What do your stools look like — watery, mushy, or still partly formed?"
    - "Have you seen any blood or mucus in them?"
    - "Are they greasy, very smelly, or hard to flush away?"
  options:
    - {id: watery, label: Watery, frag: watery}
    - {id: loose, label: Loose / mushy, frag: loose}
    - {id: bloody, label: Bloody, frag: bloody, red_flag: true}
    - {id: mucus, label: Mucus, frag: mucoid}
    - {id: greasy, label: Greasy / foul / floating, frag: "greasy, foul-smelling"}

- id: stool_frequency
  label: Frequency
  type: single
  template: "{} a day"
  ask:
    - "How many times a day are you going?"
  options:
    - {id: lt3, label: "<3 / day", frag: fewer than 3 times}
    - {id: f3_5, label: "3–5 / day", frag: 3–5 times}
    - {id: f6_10, label: "6–10 / day", frag: 6–10 times}
    - {id: gt10, label: ">10 / day", frag: more than 10 times, red_flag: true}

- id: stool_volume
  label: Volume
  type: single
  ask:
    - "Is it a lot each time, or just a little but very often?"
  options:
    - {id: large, label: Large each time, frag: large in volume}
    - {id: small, label: Small but frequent, frag: small in volume but frequent}

- id: nocturnal_stool
  label: At night
  type: single
  ask:
    - "Does the diarrhea wake you up at night?"
  options:
    - {id: wakes, label: Wakes to pass stool, frag: waking the patient at night}
    - {id: daytime, label: Daytime only, frag: occurring only during the day}

- id: fasting_effect
  label: With fasting
  type: single
  ask:
    - "If you don't eat for a while — say overnight or for a day — does the diarrhea stop?"
  options:
    - {id: stops, label: Stops with fasting, frag: stopping with fasting}
    - {id: persists, label: Persists with fasting, frag: persisting despite fasting}

# Urgency / tenesmus is assoc_gi.tenesmus.
- id: continence
  label: Continence
  type: presence
  ask:
    - "Have you had any accidents, or not made it to the toilet in time?"
  options:
    - {id: incontinence, label: Accidents / soiling, frag: fecal incontinence}

- id: dehydration_sx
  label: Dehydration
  type: presence
  ask:
    - "Are you very thirsty? Are you passing much less urine than usual?"
    - "Do you feel dizzy or light-headed when you stand up?"
  options:
    - {id: thirst, label: Marked thirst, frag: marked thirst}
    - {id: orthostatic, label: Dizzy on standing, frag: light-headedness on standing, red_flag: true}
    - {id: oliguria, label: Passing little urine, frag: reduced urine output, red_flag: true}

- id: extraintestinal
  label: Extra-intestinal / systemic
  type: presence
  ask:
    - "Any joint pains, mouth ulcers, red or painful eyes, or tender red lumps on your shins?"
    - "Have you been feeling hot all the time, shaky, or had a racing heart?"
  options:
    - {id: arthralgia, label: Joint pain, frag: joint pain}
    - {id: oral_ulcers, label: Mouth ulcers, frag: mouth ulcers}
    - {id: red_eye, label: Red / painful eyes, frag: red or painful eyes}
    - {id: skin_nodules, label: Tender red shin lumps, frag: tender red nodules on the shins}
    - {id: thyrotoxic, label: Heat intolerance / palpitations, frag: heat intolerance or palpitations}

- id: exposure
  label: Food / water exposure
  type: presence
  ask:
    - "In the day or two before it started, did you eat anything raw or undercooked — sashimi, oysters, rare meat, or runny eggs?"
    - "Did you eat at a banquet, buffet, or restaurant? Did anyone who ate with you get sick?"
    - "Do you live in a care home, or does anyone at home go to daycare?"
  options:
    - {id: raw_seafood, label: Raw / undercooked seafood, frag: raw or undercooked seafood}
    - {id: undercooked, label: Undercooked meat / eggs, frag: undercooked meat or eggs}
    - {id: banquet, label: Banquet / buffet / takeaway, frag: "a banquet, buffet, or takeaway meal"}
    - {id: untreated_water, label: Untreated water, frag: untreated water}
    - {id: institution, label: Care home / daycare, frag: a care home or daycare setting}

- id: food_trigger
  label: Worse after
  type: presence
  ask:
    - "Is it worse after milk or dairy products?"
    - "What about sugar-free sweets, gum, or diet drinks? Or fatty meals?"
  options:
    - {id: dairy, label: Milk / dairy, frag: milk or dairy products}
    - {id: sweeteners, label: Sugar-free products, frag: sugar-free products (sorbitol or xylitol)}
    - {id: fatty_food, label: Fatty meals, frag: fatty meals}

- id: diarrhea_drugs
  label: Medications
  type: presence
  ask:
    - "Have you taken any antibiotics in the last three months?"
    - "What medicines do you take regularly? Any new ones recently — including antacids, laxatives, or diabetes tablets?"
    - "Are you having chemotherapy or any cancer immunotherapy?"
  options:
    - {id: antibiotics, label: Antibiotics in past 3 mo, frag: antibiotics in the past 3 months, red_flag: true}
    - {id: metformin, label: Metformin, frag: metformin}
    - {id: magnesium, label: Mg antacids / laxatives, frag: magnesium-containing antacids or laxatives}
    - {id: ppi, label: PPI, frag: proton pump inhibitors}
    - {id: ssri, label: SSRI, frag: SSRIs}
    - {id: colchicine, label: Colchicine, frag: colchicine}
    - {id: chemo_ici, label: Chemotherapy / immunotherapy, frag: chemotherapy or immune checkpoint inhibitors, red_flag: true}

- id: diarrhea_history
  label: GI / surgical history
  type: presence
  ask:
    - "Have you been in hospital recently?"
    - "Have you had your gallbladder removed, or any surgery on your stomach or bowel? Any radiotherapy to the pelvis?"
    - "Have you ever been told you have pancreatitis or an overactive thyroid?"
  options:
    - {id: recent_hospital, label: Recent hospitalization, frag: a recent hospitalization}
    - {id: cholecystectomy, label: Cholecystectomy, frag: prior cholecystectomy}
    - {id: bowel_resection, label: Bowel resection, frag: prior bowel resection}
    - {id: gastric_surgery, label: Gastrectomy / bariatric surgery, frag: prior gastrectomy or bariatric surgery}
    - {id: pelvic_radiation, label: Pelvic radiotherapy, frag: pelvic radiotherapy}
    - {id: chronic_pancreatitis, label: Chronic pancreatitis, frag: chronic pancreatitis}
    - {id: hyperthyroid, label: Hyperthyroidism, frag: hyperthyroidism}

# ---------- Abnormal liver tests (data/complaints/abnormal_lft.yaml) ----------

- id: lft_duration
  label: Abnormal for
  type: single
  ask:
    - "When were you first told your liver tests were abnormal?"
    - "Have you had a liver test before? Was it normal then?"
  options:
    - {id: first_found, label: First found / unknown, frag: found on recent testing}
    - {id: lt1m, label: "<1 mo", frag: for less than 1 month, tc: [acute]}
    - {id: m1_6, label: "1–6 mo", frag: for 1–6 months, tc: [subacute]}
    - {id: gt6m, label: ">6 mo", frag: for more than 6 months, tc: [chronic]}

- id: liver_warning
  label: Warning signs
  type: presence
  ask:
    - "Have you noticed you bruise or bleed easily — gums, nose, or after small cuts?"
    - "Has your tummy been getting bigger or tighter?"
  options:
    - {id: bruising, label: Easy bruising / bleeding, frag: easy bruising or bleeding, red_flag: true}
    - {id: distension, label: Abdominal swelling, frag: increasing abdominal girth}

# Alcohol: the main question, with amount and duration in a collapsible details block.
- id: alcohol_use
  label: Alcohol
  type: single
  ask:
    - "Do you drink alcohol? How often?"
    - "Have you ever been a heavy drinker, or have you stopped drinking?"
  options:
    - {id: never, label: Never / rarely, frag: rarely or never drinks alcohol}
    - {id: social, label: Occasional / social, frag: drinks socially}
    - {id: regular, label: Regular drinker, frag: drinks regularly}
    - {id: heavy, label: Heavy drinker, frag: drinks heavily, red_flag: true}
    - {id: former, label: Former drinker, frag: former drinker}

- id: alcohol_type
  label: What
  type: multi
  template: "mainly {}"
  ask:
    - "What do you usually drink — beer, kaoliang, rice wine, tonic wine, wine, or whiskey?"
  options:
    - {id: beer, label: Beer, frag: beer}
    - {id: kaoliang, label: Kaoliang / spirits, frag: kaoliang}
    - {id: rice_wine, label: Rice wine, frag: rice wine}
    - {id: tonic, label: Tonic / medicinal wine, frag: medicinal tonic wine}
    - {id: wine, label: Wine, frag: wine}
    - {id: whiskey, label: Whiskey / brandy, frag: whiskey or brandy}

- id: alcohol_amount
  label: Amount
  type: single
  ask:
    - "How much do you drink on a typical day — how many bottles or glasses, and what size?"
  options:
    - {id: lt20, label: "<20 g/day", frag: less than 20 g of alcohol a day}
    - {id: g20_40, label: "20–40 g/day", frag: about 20–40 g of alcohol a day}
    - {id: g40_60, label: "40–60 g/day", frag: about 40–60 g of alcohol a day}
    - {id: g60_100, label: "60–100 g/day", frag: about 60–100 g of alcohol a day, red_flag: true}
    - {id: gt100, label: ">100 g/day", frag: more than 100 g of alcohol a day, red_flag: true}

- id: alcohol_years
  label: For how long
  type: single
  ask:
    - "How many years have you been drinking like this?"
  options:
    - {id: lt5, label: "<5 yr", frag: for less than 5 years}
    - {id: y5_10, label: "5–10 yr", frag: for 5–10 years}
    - {id: y10_20, label: "10–20 yr", frag: for 10–20 years}
    - {id: gt20, label: ">20 yr", frag: for more than 20 years}

- id: alcohol_last
  label: Last drink
  type: single
  ask:
    - "When did you last have a drink?"
    - "If you've stopped, how long ago was that?"
  options:
    - {id: still, label: Still drinking, frag: still drinking}
    - {id: lt1m, label: Stopped <1 mo, frag: stopped less than 1 month ago}
    - {id: m1_6, label: Stopped 1–6 mo, frag: stopped 1–6 months ago}
    - {id: m6_12, label: Stopped 6–12 mo, frag: stopped 6–12 months ago}
    - {id: gt1y, label: Stopped >1 yr, frag: stopped more than 1 year ago}

- id: alcohol_pattern
  label: Pattern
  type: presence
  ask:
    - "Have you had a heavy drinking session recently?"
    - "Do you drink every day? Do you need a drink in the morning, or get the shakes if you don't?"
  options:
    - {id: binge, label: Recent binge, frag: a recent binge}
    - {id: daily, label: Drinks daily, frag: daily drinking}
    - {id: morning, label: Morning drink / shakes, frag: morning drinking or withdrawal tremor, red_flag: true}

- id: liver_drugs
  label: Medications
  type: presence
  ask:
    - "What medicines have you taken in the last three months, including short courses like antibiotics?"
    - "Do you take painkillers like paracetamol? How many tablets a day?"
  options:
    - {id: antibiotics, label: "Antibiotics (e.g., amox-clav)", frag: antibiotics}
    - {id: anti_tb, label: Anti-TB drugs, frag: anti-tuberculosis drugs}
    - {id: azole, label: Azole antifungals, frag: azole antifungals}
    - {id: apap, label: High-dose acetaminophen, frag: high-dose acetaminophen, red_flag: true}
    - {id: nsaid, label: NSAIDs, frag: NSAIDs}
    - {id: statin, label: Statin, frag: a statin}
    - {id: amiodarone, label: Amiodarone, frag: amiodarone}
    - {id: aed, label: Antiepileptics, frag: antiepileptic drugs}
    - {id: methotrexate, label: Methotrexate, frag: methotrexate}
    - {id: chemo, label: Chemotherapy / immunotherapy, frag: chemotherapy or immunotherapy}

- id: herbs
  label: Herbs / supplements
  type: presence
  ask:
    - "Do you take any Chinese herbal medicine, health supplements, or slimming or muscle-building products?"
  options:
    - {id: chinese_herbal, label: Chinese herbal medicine, frag: Chinese herbal medicine}
    - {id: supplements, label: Dietary supplements, frag: dietary supplements}
    - {id: slimming, label: Weight-loss / bodybuilding products, frag: weight-loss or bodybuilding products}

# Main question of the drugs block: whether and when; the drug / herb lists are collapsible details.
- id: drug_timing
  label: Medications / herbs
  type: single
  ask:
    - "Have you started any new medicines, herbal remedies, or supplements in the last few months?"
    - "When did you start it? Was the dose changed recently?"
  options:
    - {id: none, label: None, frag: no regular medications or herbal products}
    - {id: lt3m, label: "<3 mo ago", frag: started within the past 3 months}
    - {id: m3_6, label: "3–6 mo ago", frag: started 3–6 months ago}
    - {id: long_term, label: "Long-term, unchanged", frag: taken long-term without recent change}

- id: viral_history
  label: Hepatitis B / C
  type: presence
  ask:
    - "Have you ever been told you have hepatitis B or C? Are you on treatment, or have you stopped it?"
    - "Are you having chemotherapy, steroids, or other drugs that lower your immunity?"
  options:
    - {id: hbv, label: Known HBV carrier, frag: chronic hepatitis B}
    - {id: hbv_tx, label: On HBV antivirals, frag: current HBV antiviral therapy}
    - {id: hbv_stop, label: Stopped HBV antivirals, frag: recent discontinuation of HBV antivirals, red_flag: true}
    - {id: hcv, label: Known HCV, frag: hepatitis C}
    - {id: hcv_cured, label: HCV treated / cured, frag: treated hepatitis C}
    - {id: immunosupp, label: Chemo / immunosuppression, frag: chemotherapy or immunosuppressive therapy}

- id: viral_sx
  label: Infection symptoms
  type: presence
  ask:
    - "Have you had a sore throat, swollen glands in your neck, or a rash?"
    - "Any muscle aches, cough, or runny nose recently?"
  options:
    - {id: sore_throat, label: Sore throat, frag: sore throat}
    - {id: lymph_nodes, label: Swollen glands, frag: swollen glands}
    - {id: rash, label: Rash, frag: rash}
    - {id: myalgia, label: Muscle aches, frag: myalgia}
    - {id: uri, label: Cough / runny nose, frag: cough or runny nose}

- id: viral_exposure
  label: Exposure
  type: presence
  ask:
    - "Have you eaten raw shellfish or undercooked pork recently? Is anyone at home unwell with hepatitis?"
    - "Any tattoos, piercings, blood transfusions, or dialysis? Have you ever injected drugs?"
  options:
    - {id: shellfish, label: Raw shellfish / undercooked pork, frag: raw shellfish or undercooked pork}
    - {id: household, label: Household hepatitis contact, frag: a household contact with hepatitis}
    - {id: tattoo, label: Tattoo / piercing, frag: tattoos or piercings}
    - {id: idu, label: Injection drug use, frag: injection drug use}
    - {id: transfusion, label: Transfusion / dialysis, frag: blood transfusion or dialysis}

- id: metabolic
  label: Metabolic
  type: presence
  ask:
    - "Has your weight gone up in recent years? Have you been told you have high cholesterol or high blood pressure?"
  options:
    - {id: obesity, label: Overweight / central obesity, frag: obesity}
    - {id: dyslipidemia, label: Dyslipidemia, frag: dyslipidemia}
    - {id: hypertension, label: Hypertension, frag: hypertension}
    - {id: weight_gain, label: Recent weight gain, frag: recent weight gain}

- id: congestion_sx
  label: Heart / circulation
  type: presence
  ask:
    - "Do you get short of breath lying flat, or wake up at night gasping? Are your legs swollen?"
    - "Have you been told you have heart failure or a heart valve problem?"
    - "Have you recently been very unwell — low blood pressure, a collapse, or a serious infection?"
  options:
    - {id: orthopnea, label: Orthopnea / PND, frag: orthopnea or paroxysmal nocturnal dyspnea}
    - {id: leg_swelling, label: Leg swelling, frag: leg swelling}
    - {id: heart_failure, label: Known heart failure / valve disease, frag: heart failure or valvular heart disease}
    - {id: shock, label: Recent hypotension / shock / sepsis, frag: "a recent episode of hypotension, shock, or sepsis", red_flag: true}

- id: other_liver
  label: Other clues
  type: presence
  ask:
    - "Do you have any autoimmune conditions, such as thyroid disease, lupus, or rheumatoid arthritis?"
    - "Does anyone in your family have liver disease?"
    - "Have you done any unusually hard exercise or had a muscle injury recently?"
  options:
    - {id: autoimmune, label: Other autoimmune disease, frag: another autoimmune disease}
    - {id: fhx_liver, label: Family history of liver disease, frag: a family history of liver disease}
    - {id: exercise, label: Strenuous exercise / muscle injury, frag: recent strenuous exercise or muscle injury}
