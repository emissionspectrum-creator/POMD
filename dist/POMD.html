ain with chronic diarrhea, weight loss and low-grade fever in a young adult, sometimes with perianal fistula / abscess or a tender RLQ mass from terminal ileal disease.","symptoms":[{"item":"pain_location","options":["rlq","periumbilical"],"text":"RLQ or periumbilical pain"},{"item":"pain_quality","options":["cramping","colicky"],"text":"Crampy, often postprandial (stricturing disease)"},{"item":"meal_relation","options":["worse_eating"],"text":"Worse after eating"},{"item":"duration","options":["w1_4","m1_3","gt3m"],"text":"Weeks to months, relapsing"},{"item":"assoc_gi","options":["diarrhea"],"state":"present","text":"Chronic diarrhea (usually non-bloody)"},{"item":"assoc_sys","options":["weight_loss","fever"],"state":"present","text":"Weight loss, low-grade fever"},{"item":"assoc_sys","options":["malaise"],"state":"present","text":"Fatigue"},{"item":"age_group","options":["under_40"],"text":"Peak onset 15–35"},{"item":"risk","options":["ibd","smoking"],"state":"present","text":"Known IBD; smoking increases risk"},{"item":"episodes","options":["recurrent"],"text":"Relapsing course"},{"item":"stool_character","options":["loose","watery","bloody"],"text":"Non-bloody diarrhea more often than in UC; blood with colonic disease"},{"item":"diarrhea_duration","options":["w2_4","m1_3","gt3m"],"text":"Weeks to months"},{"item":"nocturnal_stool","options":["wakes"],"text":"Nocturnal diarrhea"},{"item":"extraintestinal","options":["arthralgia","oral_ulcers","red_eye","skin_nodules"],"state":"present","text":"Mouth ulcers, joint, eye, or skin manifestations"}],"pe":[{"item":"tenderness","options":["rlq"],"text":"RLQ tenderness"},{"item":"palpable","options":["mass"],"state":"present","text":"Tender RLQ mass (inflammatory mass or abscess)"},{"item":"rectal","options":["perianal"],"text":"Perianal fistula, abscess, or skin tags"},{"item":"skin","options":["pallor"],"state":"present","text":"Pallor"},{"item":"vitals","options":["fever"],"state":"present","text":"Low-grade fever"},{"item":"systemic_pe","options":["erythema_nodosum","oral_ulcers"],"state":"present","text":"Erythema nodosum, oral aphthous ulcers"}],"labs":["CBC (anemia, thrombocytosis), CRP, albumin, ferritin, B12","Fecal calprotectin; stool culture and C. difficile to exclude infection"],"imaging":["Ileocolonoscopy with ileal biopsies","CT or MR enterography for small bowel extent, strictures, fistulas, abscess"],"pitfalls":["Intestinal tuberculosis mimics ileocecal Crohn's — important in Taiwan; exclude before starting immunosuppression.","Acute presentation can mimic appendicitis.","Normal CRP does not exclude active disease in some patients.","Before biologics or steroids, screen for HBV and latent TB."]},"cystitis":{"id":"cystitis","name":"Cystitis","must_not_miss":false,"timecourse":["acute"],"status":"draft","one_liner":"Suprapubic discomfort with dysuria, frequency and urgency, sometimes hematuria, without fever or flank pain — most often in women.","symptoms":[{"item":"pain_location","options":["suprapubic"],"text":"Suprapubic discomfort"},{"item":"assoc_gu","options":["dysuria"],"state":"present","text":"Dysuria"},{"item":"assoc_gu","options":["frequency"],"state":"present","text":"Frequency and urgency"},{"item":"assoc_gu","options":["hematuria"],"state":"present","text":"Hematuria"},{"item":"assoc_sys","options":["fever"],"state":"absent","text":"No fever (fever or flank pain = pyelonephritis)"},{"item":"assoc_gu","options":["vaginal_discharge"],"state":"absent","text":"No vaginal discharge (discharge suggests vaginitis / cervicitis)"},{"item":"sex","options":["female"],"text":"Mostly women; in men consider prostatitis or complicated UTI"},{"item":"duration","options":["lt6h","h6_24","d1_3"],"text":"Short history"}],"pe":[{"item":"tenderness","options":["suprapubic","none"],"text":"Suprapubic tenderness or normal exam"},{"item":"vitals","options":["fever"],"state":"absent","text":"Afebrile"},{"item":"cva_tenderness","options":["none"],"text":"No CVA tenderness"}],"labs":["Urine dipstick (leukocyte esterase, nitrite), urinalysis","Urine culture for men, pregnancy, recurrence, treatment failure, or complicated UTI","hCG when relevant"],"imaging":["Not needed in uncomplicated cystitis"],"pitfalls":["UTI in men is considered complicated — evaluate for prostatitis or retention.","Recurrent hematuria without infection needs urologic evaluation.","Pelvic appendicitis and PID can cause pyuria and urinary symptoms."]},"dili":{"id":"dili","name":"Drug- / herb-induced liver injury (DILI)","must_not_miss":false,"timecourse":["acute","subacute"],"status":"draft","one_liner":"Raised liver tests — hepatocellular, cholestatic, or mixed — 5 days to 3 months after starting a drug, herbal medicine, or supplement, improving after it is stopped; in Taiwan, herbs and supplements are major causes.","symptoms":[{"item":"liver_drugs","options":["antibiotics","anti_tb","azole","nsaid","statin","amiodarone","aed","methotrexate","chemo"],"state":"present","text":"A drug known to cause liver injury"},{"item":"herbs","options":["chinese_herbal","supplements","slimming"],"state":"present","text":"Chinese herbal medicine, supplements, or slimming / bodybuilding products"},{"item":"drug_timing","options":["lt3m","m3_6"],"text":"Started within the past 3–6 months"},{"item":"lft_duration","options":["lt1m","m1_6","first_found"],"text":"Recent onset"},{"item":"assoc_sys","options":["jaundice","pruritus","dark_urine"],"state":"present","text":"Jaundice or itching in severe or cholestatic injury"},{"item":"assoc_sys","options":["fever"],"state":"present","text":"Fever, rash — hypersensitivity (DRESS)"},{"item":"assoc_sys","options":["malaise"],"state":"present","text":"Malaise, nausea"},{"item":"alcohol_use","options":["never","social"],"text":"Little alcohol"}],"pe":[{"item":"skin","options":["icterus"],"state":"present","text":"Jaundice (Hy's law — a sign of severity)"},{"item":"palpable","options":["liver_tender","hepatomegaly"],"state":"present","text":"Tender hepatomegaly"},{"item":"liver_pe","options":["asterixis"],"state":"absent","text":"No encephalopathy"}],"labs":["Pattern by R ratio (ALT/ULN ÷ ALP/ULN): ≥ 5 hepatocellular, ≤ 2 cholestatic","Exclude viral (HAV, HBV, HCV, HEV), autoimmune, biliary causes","INR and bilirubin — ALT > 3 × ULN with bilirubin > 2 × ULN (Hy's law) signals ~10% mortality","Eosinophilia suggests hypersensitivity"],"imaging":["Ultrasound to exclude biliary obstruction and other liver disease"],"pitfalls":["Patients often do not consider herbs, teas, or supplements to be \"medicine\" — ask specifically.","Amoxicillin-clavulanate injury can appear weeks after the course ends.","Anti-TB drug injury is common in Taiwan, especially in older patients, HBV carriers, and drinkers.","LiverTox (NIH) is a useful reference for individual drugs."]},"diverticulitis":{"id":"diverticulitis","name":"Diverticulitis","must_not_miss":false,"timecourse":["acute"],"status":"draft","one_liner":"Constant LLQ pain over days with fever and LLQ tenderness, sometimes a mass, in a middle-aged or older patient; in Asian patients right-sided (cecal / ascending) diverticulitis is common and mimics appendicitis.","symptoms":[{"item":"pain_location","options":["llq","rlq","suprapubic"],"text":"LLQ pain (RLQ in right-sided disease — common in Asia)"},{"item":"pain_pattern","options":["constant"],"text":"Constant pain"},{"item":"onset","options":["hours","gradual"],"text":"Develops over hours to days"},{"item":"duration","options":["h6_24","d1_3","d4_7"],"text":"Usually presents after 1–3 days"},{"item":"assoc_sys","options":["fever"],"state":"present","text":"Fever"},{"item":"assoc_gi","options":["constipation","diarrhea","bowel_change"],"state":"present","text":"Change in bowel habit"},{"item":"assoc_gi","options":["nausea","anorexia"],"state":"present","text":"Nausea, anorexia"},{"item":"assoc_gu","options":["frequency","dysuria"],"state":"present","text":"Urinary symptoms (bladder irritation; pneumaturia = colovesical fistula)"},{"item":"risk","options":["diverticular"],"state":"present","text":"Known diverticulosis or prior attack"}],"pe":[{"item":"tenderness","options":["llq","rlq"],"text":"Localized LLQ (or RLQ) tenderness"},{"item":"vitals","options":["fever"],"state":"present","text":"Fever"},{"item":"palpable","options":["mass"],"state":"present","text":"Tender mass (phlegmon or abscess)"},{"item":"guarding","options":["voluntary","involuntary"],"text":"Localized guarding"},{"item":"rebound","options":["present"],"text":"Diffuse peritonitis suggests perforation"}],"labs":["Leukocytosis, raised CRP (very high CRP suggests complicated disease)","Urinalysis (may show pyuria)"],"imaging":["CT abdomen / pelvis with IV contrast — confirms diagnosis, detects abscess or perforation","Colonoscopy 6–8 weeks after recovery for complicated disease or if not recently done (exclude cancer)"],"pitfalls":["Colorectal cancer can mimic diverticulitis — ensure colonoscopy follow-up.","Elderly and immunosuppressed patients have fewer signs and more complications.","Right-sided diverticulitis is frequently mistaken for appendicitis."]},"dka":{"id":"dka","name":"Diabetic ketoacidosis","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Diffuse abdominal pain with vomiting, polyuria and polydipsia, dehydration and Kussmaul breathing in a diabetic patient (or as the first presentation of diabetes); pain tracks the severity of acidosis.","symptoms":[{"item":"pain_location","options":["diffuse","epigastric","periumbilical"],"text":"Diffuse or epigastric pain"},{"item":"assoc_gi","options":["nausea","vomiting"],"state":"present","text":"Nausea and vomiting"},{"item":"assoc_other","options":["polyuria"],"state":"present","text":"Polyuria and polydipsia"},{"item":"assoc_other","options":["dyspnea"],"state":"present","text":"Deep, rapid breathing"},{"item":"assoc_sys","options":["weight_loss","malaise"],"state":"present","text":"Weight loss, fatigue"},{"item":"assoc_other","options":["confusion"],"state":"present","text":"Drowsiness or confusion"},{"item":"risk","options":["diabetes"],"state":"present","text":"Known diabetes (missed insulin, infection, SGLT2 inhibitor) — or new type 1 diabetes"},{"item":"duration","options":["lt6h","h6_24","d1_3"],"text":"Develops over hours to a day or two"}],"pe":[{"item":"vitals","options":["tachypnea"],"state":"present","text":"Kussmaul respiration"},{"item":"general","options":["dehydrated"],"text":"Dry mucous membranes, dehydration"},{"item":"vitals","options":["tachycardia","hypotension"],"state":"present","text":"Tachycardia, hypotension"},{"item":"tenderness","options":["diffuse","none"],"text":"Diffuse tenderness without localized peritonism"},{"item":"general","options":["confused"],"text":"Altered mental status"}],"labs":["Glucose, blood ketones (β-hydroxybutyrate), venous blood gas, anion gap","Electrolytes (potassium!), creatinine, osmolality","Lipase and amylase can be raised without pancreatitis"],"imaging":["Not needed for DKA itself; image if pain persists after acidosis improves"],"pitfalls":["Euglycemic DKA on SGLT2 inhibitors — glucose may be < 250 mg/dL.","DKA can be caused by an abdominal emergency (appendicitis, pancreatitis); persistent pain after correcting acidosis needs a search.","Total-body potassium is low even when serum potassium is normal or high."]},"drug_induced_diarrhea":{"id":"drug_induced_diarrhea","name":"Drug-induced diarrhea","must_not_miss":false,"timecourse":["acute","subacute","chronic"],"status":"draft","one_liner":"Diarrhea that started after a new drug or dose change — metformin, magnesium antacids or laxatives, colchicine, PPIs, SSRIs, antibiotics, or chemotherapy — and improves when it is stopped; immune checkpoint inhibitors can cause a serious colitis.","symptoms":[{"item":"diarrhea_drugs","options":["metformin","magnesium","ppi","ssri","colchicine","chemo_ici","antibiotics"],"state":"present","text":"A drug known to cause diarrhea"},{"item":"risk","options":["new_meds"],"state":"present","text":"New medication or herbal supplement, or recent dose increase"},{"item":"risk","options":["nsaid"],"state":"present","text":"NSAIDs (can cause enteropathy or microscopic colitis)"},{"item":"stool_character","options":["watery","loose"],"text":"Watery or loose stools"},{"item":"fasting_effect","options":["stops"],"text":"Osmotic drugs (magnesium, sugar alcohols) stop with fasting"},{"item":"assoc_sys","options":["fever"],"state":"absent","text":"No fever"}],"pe":[{"item":"tenderness","options":["none","diffuse"],"text":"Usually unremarkable abdomen"},{"item":"vitals","options":["fever"],"state":"absent","text":"Afebrile"}],"labs":["Electrolytes, creatinine (colchicine toxicity with renal impairment)","C. difficile testing if antibiotics were involved","For immune checkpoint inhibitor colitis — CRP, stool infection screen, early oncology input"],"imaging":["Colonoscopy if symptoms persist after stopping the drug, or for immunotherapy colitis"],"pitfalls":["Ask about over-the-counter antacids, laxatives, supplements, and Chinese herbal medicines.","Metformin diarrhea can begin years after starting, especially after dose increases.","Diarrhea in a patient on immune checkpoint inhibitors needs same-day assessment."]},"ebv_infection":{"id":"ebv_infection","name":"EBV infection (infectious mononucleosis)","must_not_miss":false,"timecourse":["acute","subacute"],"status":"draft","one_liner":"Fever, sore throat, and tender cervical lymphadenopathy with fatigue in an adolescent or young adult, often with splenomegaly and a mild-to-moderate ALT rise (usually < 5–10 × ULN); jaundice is uncommon.","symptoms":[{"item":"viral_sx","options":["sore_throat"],"state":"present","text":"Sore throat"},{"item":"viral_sx","options":["lymph_nodes"],"state":"present","text":"Swollen, tender neck glands"},{"item":"assoc_sys","options":["fever","malaise"],"state":"present","text":"Fever and marked fatigue"},{"item":"age_group","options":["under_40"],"text":"Adolescent or young adult"},{"item":"viral_sx","options":["rash"],"state":"present","text":"Rash — especially after amoxicillin or ampicillin"},{"item":"lft_duration","options":["lt1m","first_found"],"text":"Acute"},{"item":"pain_location","options":["ruq"],"text":"Mild RUQ or LUQ discomfort"},{"item":"assoc_sys","options":["jaundice"],"state":"absent","text":"Jaundice uncommon (more often in older adults)"}],"pe":[{"item":"infection_pe","options":["lymphadenopathy","tonsillar_exudate"],"state":"present","text":"Posterior cervical lymphadenopathy, tonsillar exudate"},{"item":"palpable","options":["splenomegaly"],"state":"present","text":"Splenomegaly"},{"item":"vitals","options":["fever"],"state":"present","text":"Fever"},{"item":"palpable","options":["hepatomegaly"],"state":"present","text":"Mild hepatomegaly"}],"labs":["CBC — lymphocytosis with atypical lymphocytes (> 10%)","Heterophile (monospot) test; EBV VCA IgM / IgG and EBNA if negative or in young children","ALT typically 2–5 × ULN, peaking in week 2"],"imaging":["Ultrasound if splenomegaly is uncertain"],"pitfalls":["Avoid contact sports for at least 3–4 weeks — risk of splenic rupture.","Amoxicillin often causes a widespread rash in EBV infection; it is not necessarily drug allergy.","A mononucleosis-like illness with a negative monospot may be CMV, acute HIV, or toxoplasmosis."]},"ectopic_pregnancy":{"id":"ectopic_pregnancy","name":"Ectopic pregnancy","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Unilateral lower abdominal pain with vaginal bleeding after a missed period in a woman of reproductive age; rupture causes sudden severe pain, shoulder-tip pain, syncope, and shock.","symptoms":[{"item":"sex","options":["female"],"text":"Woman of reproductive age"},{"item":"repro_status","options":["period_late","preg_possible","pregnant"],"text":"Missed or late period; pregnancy possible"},{"item":"pain_location","options":["rlq","llq","suprapubic"],"text":"Unilateral lower abdominal or pelvic pain"},{"item":"assoc_gu","options":["vaginal_bleeding"],"state":"present","text":"Vaginal bleeding or spotting"},{"item":"onset","options":["sudden"],"text":"Sudden severe pain suggests rupture"},{"item":"radiation","options":["r_shoulder","l_shoulder"],"text":"Shoulder-tip pain (hemoperitoneum)"},{"item":"assoc_other","options":["syncope"],"state":"present","text":"Syncope or dizziness"},{"item":"risk","options":["sti_risk"],"state":"present","text":"Prior PID / STI (also prior ectopic, tubal surgery, IVF, IUD)"}],"pe":[{"item":"pelvic","options":["adnexal_tender","cmt"],"state":"present","text":"Adnexal tenderness, cervical motion tenderness"},{"item":"pelvic","options":["adnexal_mass"],"state":"present","text":"Adnexal mass (often not palpable)"},{"item":"tenderness","options":["rlq","llq","suprapubic"],"text":"Lower abdominal tenderness"},{"item":"vitals","options":["hypotension","tachycardia"],"state":"present","text":"Tachycardia, hypotension (rupture)"},{"item":"rebound","options":["present"],"text":"Peritoneal signs (hemoperitoneum)"}],"labs":["Urine / serum hCG in every woman of reproductive age with abdominal pain","Quantitative β-hCG trend; CBC; blood type and Rh"],"imaging":["Transvaginal ultrasound — no intrauterine pregnancy with positive hCG, adnexal mass, free fluid","FAST in unstable patients"],"pitfalls":["Histories of \"no chance of pregnancy\" are unreliable — test everyone.","A pregnancy of unknown location needs serial hCG and follow-up ultrasound, not reassurance.","Heterotopic pregnancy is more common after assisted reproduction.","Pain can be mild before rupture."]},"functional_dyspepsia":{"id":"functional_dyspepsia","name":"Functional dyspepsia","must_not_miss":false,"timecourse":["chronic"],"status":"draft","one_liner":"Chronic or recurrent epigastric pain or burning, postprandial fullness, or early satiety without alarm features and with no structural cause found on evaluation.","symptoms":[{"item":"pain_location","options":["epigastric"],"text":"Epigastric pain or burning"},{"item":"pain_quality","options":["burning","pressure","dull"],"text":"Burning, fullness, or vague discomfort"},{"item":"duration","options":["m1_3","gt3m"],"text":"Chronic (Rome IV — symptoms for the last 3 months, onset ≥ 6 months ago)"},{"item":"assoc_gi","options":["early_satiety","bloating"],"state":"present","text":"Early satiety, postprandial fullness or bloating"},{"item":"meal_relation","options":["worse_eating"],"text":"Often triggered by meals (postprandial distress type)"},{"item":"episodes","options":["recurrent"],"text":"Recurrent, fluctuating course"},{"item":"assoc_sys","options":["weight_loss"],"state":"absent","text":"No weight loss"},{"item":"assoc_gi","options":["melena","hematemesis","dysphagia","vomiting"],"state":"absent","text":"No GI bleeding, dysphagia, or persistent vomiting"},{"item":"age_group","options":["under_40","age_40_59"],"text":"Usually younger patients"}],"pe":[{"item":"tenderness","options":["none","epigastric"],"text":"Normal exam or mild epigastric tenderness"},{"item":"guarding","options":["soft"],"text":"Soft abdomen"},{"item":"palpable","options":["mass"],"state":"absent","text":"No mass"},{"item":"skin","options":["pallor"],"state":"absent","text":"No pallor"}],"labs":["CBC normal (anemia is an alarm feature)","H. pylori test-and-treat"],"imaging":["EGD for alarm features or older age; in high gastric-cancer-incidence regions many guidelines use a lower age threshold","Ultrasound only if biliary symptoms are suspected"],"pitfalls":["A diagnosis of exclusion — reassess when new alarm features appear.","Overlaps with GERD, IBS, and gastroparesis; ask about each.","Medication causes (NSAIDs, iron, potassium, bisphosphonates, metformin, GLP-1 agonists) should be considered.","Abdominal wall pain (positive Carnett's sign) is a common unrecognized cause of persistent localized pain."]},"gastric_cancer":{"id":"gastric_cancer","name":"Gastric cancer","must_not_miss":false,"timecourse":["subacute","chronic"],"status":"draft","one_liner":"Persistent epigastric discomfort with early satiety, anorexia and weight loss in an older patient, sometimes with iron-deficiency anemia, melena, or vomiting from outlet obstruction.","symptoms":[{"item":"pain_location","options":["epigastric"],"text":"Epigastric discomfort, often vague"},{"item":"onset","options":["gradual"],"text":"Insidious onset"},{"item":"duration","options":["w1_4","m1_3","gt3m"],"text":"Weeks to months"},{"item":"assoc_gi","options":["early_satiety","anorexia"],"state":"present","text":"Early satiety and anorexia"},{"item":"assoc_sys","options":["weight_loss"],"state":"present","text":"Unintentional weight loss"},{"item":"assoc_gi","options":["melena","hematemesis"],"state":"present","text":"Melena or hematemesis"},{"item":"assoc_gi","options":["vomiting"],"state":"present","text":"Persistent vomiting (gastric outlet obstruction)"},{"item":"assoc_gi","options":["dysphagia"],"state":"present","text":"Dysphagia (cardia / GE junction tumors)"},{"item":"age_group","options":["age_40_59","age_60_plus"],"text":"Usually over 50"},{"item":"risk","options":["hpylori","gi_cancer_fhx","smoking"],"state":"present","text":"H. pylori, family history, smoking"}],"pe":[{"item":"skin","options":["pallor"],"state":"present","text":"Pallor (iron-deficiency anemia)"},{"item":"palpable","options":["mass"],"state":"present","text":"Epigastric mass (advanced)"},{"item":"skin","options":["virchow"],"state":"present","text":"Left supraclavicular (Virchow) node"},{"item":"palpable","options":["hepatomegaly","ascites"],"state":"present","text":"Hepatomegaly or ascites (metastatic)"},{"item":"tenderness","options":["epigastric","none"],"text":"Mild epigastric tenderness or none"}],"labs":["CBC — iron-deficiency anemia; ferritin","Albumin; liver tests","Tumor markers (CEA, CA 19-9) are not for diagnosis"],"imaging":["EGD with multiple biopsies of any ulcer or suspicious mucosa","CT chest / abdomen / pelvis for staging; EUS for local staging"],"pitfalls":["PPI therapy can temporarily heal a malignant ulcer and relieve symptoms — biopsy gastric ulcers and confirm healing.","Diffuse-type (signet ring) cancer may occur in younger patients and show subtle endoscopic findings.","Treat dyspepsia with any alarm feature as possible malignancy until endoscopy."]},"gastritis":{"id":"gastritis","name":"Gastritis / gastropathy","must_not_miss":false,"timecourse":["acute","subacute","chronic"],"status":"draft","one_liner":"Epigastric burning or discomfort with nausea, often after NSAIDs or alcohol or with H. pylori infection; erosive forms can bleed. A histologic / endoscopic diagnosis, not a clinical one.","symptoms":[{"item":"pain_location","options":["epigastric"],"text":"Epigastric discomfort"},{"item":"pain_quality","options":["burning","dull","gnawing"],"text":"Burning or gnawing"},{"item":"precipitant","options":["nsaid","alcohol"],"text":"After NSAIDs or alcohol"},{"item":"assoc_gi","options":["nausea","vomiting"],"state":"present","text":"Nausea, sometimes vomiting"},{"item":"assoc_gi","options":["anorexia","early_satiety"],"state":"present","text":"Anorexia or early satiety"},{"item":"assoc_gi","options":["hematemesis","melena"],"state":"present","text":"Hematemesis or melena (erosive / hemorrhagic gastritis)"},{"item":"risk","options":["nsaid","alcohol","hpylori"],"state":"present","text":"Regular NSAIDs, heavy drinking, H. pylori"}],"pe":[{"item":"tenderness","options":["epigastric","none"],"text":"Mild epigastric tenderness or normal exam"},{"item":"guarding","options":["soft"],"text":"Soft abdomen"},{"item":"rectal","options":["melena"],"text":"Melena if bleeding"}],"labs":["CBC if bleeding is suspected","H. pylori testing"],"imaging":["EGD when bleeding, alarm features, or persistent symptoms"],"pitfalls":["The label \"gastritis\" is often used loosely for functional dyspepsia — endoscopic findings correlate poorly with symptoms.","Stress-related mucosal disease in critically ill patients presents with bleeding rather than pain.","Chronic atrophic gastritis (H. pylori, autoimmune) raises gastric cancer risk and can cause B12 or iron deficiency."]},"gerd":{"id":"gerd","name":"Gastroesophageal reflux disease","must_not_miss":false,"timecourse":["chronic"],"status":"draft","one_liner":"Retrosternal or epigastric burning (heartburn) and acid regurgitation, worse after meals and lying down, relieved by antacids or PPIs.","symptoms":[{"item":"assoc_gi","options":["heartburn"],"state":"present","text":"Heartburn and acid regurgitation (the key symptoms)"},{"item":"pain_location","options":["epigastric"],"text":"Epigastric or retrosternal location"},{"item":"pain_quality","options":["burning"],"text":"Burning quality"},{"item":"meal_relation","options":["worse_eating"],"text":"Worse after meals"},{"item":"aggravating","options":["lying_flat"],"text":"Worse lying down or bending over"},{"item":"relieving","options":["antacid"],"text":"Relieved by antacids or PPIs"},{"item":"duration","options":["m1_3","gt3m"],"text":"Chronic, recurrent"},{"item":"assoc_other","options":["cough"],"state":"present","text":"Chronic cough or hoarseness (extra-esophageal)"},{"item":"assoc_gi","options":["dysphagia"],"state":"absent","text":"No dysphagia (dysphagia is an alarm feature)"}],"pe":[{"item":"tenderness","options":["none","epigastric"],"text":"Usually normal exam"},{"item":"guarding","options":["soft"],"text":"Soft abdomen"}],"labs":["No routine labs; CBC if bleeding or anemia is suspected"],"imaging":["Empiric PPI trial in typical symptoms without alarm features","EGD for alarm features, refractory symptoms, or long-standing symptoms with Barrett's risk","pH / impedance monitoring if the diagnosis is uncertain"],"pitfalls":["Cardiac chest pain can be described as \"burning\" — exclude ACS first in at-risk patients.","Dysphagia, weight loss, bleeding, or anemia require endoscopy.","Poor PPI response — check adherence and dosing timing, then consider functional heartburn, eosinophilic esophagitis, or other causes."]},"hbv_flare":{"id":"hbv_flare","name":"HBV flare / reactivation","must_not_miss":true,"timecourse":["acute","subacute"],"status":"draft","one_liner":"Sudden rise in ALT (often > 5–10 × ULN) in a known or unrecognized HBV carrier — after stopping antivirals, during chemotherapy or immunosuppression, or spontaneously — which can progress to hepatic decompensation.","symptoms":[{"item":"viral_history","options":["hbv"],"state":"present","text":"Known HBV carrier"},{"item":"viral_history","options":["hbv_stop"],"state":"present","text":"Recently stopped antiviral therapy"},{"item":"viral_history","options":["immunosupp"],"state":"present","text":"Chemotherapy, rituximab, steroids, or other immunosuppression"},{"item":"lft_duration","options":["lt1m","m1_6","first_found"],"text":"Recent rise"},{"item":"assoc_sys","options":["jaundice","malaise"],"state":"present","text":"Fatigue; jaundice in severe flares"},{"item":"assoc_gi","options":["anorexia","nausea"],"state":"present","text":"Anorexia, nausea"},{"item":"other_liver","options":["fhx_liver"],"state":"present","text":"Family history of HBV or liver cancer"},{"item":"liver_warning","options":["bruising","distension"],"state":"present","text":"Bleeding or ascites — decompensation"}],"pe":[{"item":"skin","options":["icterus"],"state":"present","text":"Jaundice"},{"item":"liver_pe","options":["asterixis"],"state":"present","text":"Asterixis — decompensation"},{"item":"palpable","options":["ascites","splenomegaly"],"state":"present","text":"Ascites, splenomegaly (underlying cirrhosis)"}],"labs":["HBsAg, HBeAg, anti-HBe, HBV DNA (very high in flares), anti-HBc IgM (can be positive in flares)","INR, bilirubin, albumin — severity","Exclude HDV, HCV, HAV, HEV, drugs"],"imaging":["Ultrasound — cirrhosis, HCC"],"pitfalls":["Screen HBsAg and anti-HBc before chemotherapy or immunosuppression and give prophylaxis — reactivation is preventable.","Flares after stopping antivirals can be fatal in cirrhosis; restart treatment early.","A flare can unmask an HCC — check AFP and imaging."]},"hyperthyroidism":{"id":"hyperthyroidism","name":"Hyperthyroidism","must_not_miss":false,"timecourse":["subacute","chronic"],"status":"draft","one_liner":"Frequent loose stools with weight loss despite a good appetite, heat intolerance, palpitations, tremor and anxiety, typically from Graves' disease or toxic nodular goiter.","symptoms":[{"item":"extraintestinal","options":["thyrotoxic"],"state":"present","text":"Heat intolerance, palpitations"},{"item":"assoc_sys","options":["weight_loss"],"state":"present","text":"Weight loss despite good appetite"},{"item":"stool_character","options":["loose"],"text":"Frequent loose stools (rapid transit)"},{"item":"diarrhea_history","options":["hyperthyroid"],"state":"present","text":"Known thyroid disease"},{"item":"diarrhea_duration","options":["w2_4","m1_3","gt3m"],"text":"Weeks to months"}],"pe":[{"item":"systemic_pe","options":["goiter","tremor"],"state":"present","text":"Goiter, fine tremor"},{"item":"vitals","options":["tachycardia"],"state":"present","text":"Tachycardia"},{"item":"tenderness","options":["none"],"text":"Non-tender abdomen"}],"labs":["TSH, free T4 (free T3 if TSH low with normal free T4)","TSH receptor antibodies"],"imaging":["Thyroid ultrasound or uptake scan when the cause is unclear"],"pitfalls":["Older patients may have apathetic hyperthyroidism with few classic signs.","Check TSH in any chronic diarrhea with weight loss."]},"ibs":{"id":"ibs","name":"Irritable bowel syndrome","must_not_miss":false,"timecourse":["chronic"],"status":"draft","one_liner":"Recurrent abdominal pain related to defecation and associated with a change in stool frequency or form, for at least 3 months, without alarm features — a positive diagnosis, not just one of exclusion.","symptoms":[{"item":"relieving","options":["defecation"],"text":"Pain related to defecation (improves or worsens)"},{"item":"assoc_gi","options":["diarrhea","constipation","bowel_change"],"state":"present","text":"Change in stool frequency or form (IBS-D, IBS-C, or mixed)"},{"item":"assoc_gi","options":["bloating"],"state":"present","text":"Bloating and distension"},{"item":"pain_quality","options":["cramping"],"text":"Crampy pain"},{"item":"pain_location","options":["llq","diffuse","periumbilical"],"text":"Often lower abdominal or variable location"},{"item":"duration","options":["m1_3","gt3m"],"text":"Chronic (Rome IV — at least 1 day / week for 3 months, onset ≥ 6 months ago)"},{"item":"episodes","options":["recurrent"],"text":"Recurrent episodes, often with stress"},{"item":"nocturnal","options":["no_wake"],"text":"Does not wake the patient at night"},{"item":"assoc_sys","options":["weight_loss","fever"],"state":"absent","text":"No weight loss or fever"},{"item":"assoc_gi","options":["hematochezia","melena","bloody_diarrhea"],"state":"absent","text":"No GI bleeding"},{"item":"age_group","options":["under_40","age_40_59"],"text":"Onset usually before 50"},{"item":"stool_character","options":["loose","watery","mucus"],"text":"Loose stools, sometimes with mucus"},{"item":"diarrhea_pattern","options":["intermittent","alternating"],"text":"Intermittent, or alternating with constipation"},{"item":"nocturnal_stool","options":["daytime"],"text":"No nocturnal diarrhea"},{"item":"assoc_gi","options":["tenesmus"],"state":"present","text":"Urgency, often in the morning or after meals"},{"item":"diarrhea_duration","options":["m1_3","gt3m"],"text":"Chronic (symptoms for at least 3 months)"}],"pe":[{"item":"tenderness","options":["none","llq","diffuse"],"text":"Normal exam or mild non-specific tenderness"},{"item":"guarding","options":["soft"],"text":"Soft abdomen"},{"item":"palpable","options":["mass"],"state":"absent","text":"No mass"},{"item":"skin","options":["pallor"],"state":"absent","text":"No pallor"}],"labs":["CBC, CRP; fecal calprotectin in diarrhea-predominant symptoms to screen for IBD","Celiac serology in diarrhea-predominant symptoms (lower prevalence in Taiwan); thyroid function as indicated"],"imaging":["Colonoscopy for alarm features, age ≥ 45–50 without prior screening, or persistent diarrhea (microscopic colitis)"],"pitfalls":["New symptoms after age 50, rectal bleeding, weight loss, nocturnal symptoms, anemia, or family history of colorectal cancer / IBD require evaluation.","Microscopic colitis, bile acid diarrhea, and lactose intolerance can mimic IBS-D.","Avoid repeated investigation once the diagnosis is confidently made."]},"infectious_ileocecitis":{"id":"infectious_ileocecitis","name":"Infectious ileocecitis","must_not_miss":false,"timecourse":["acute"],"status":"draft","one_liner":"Acute RLQ pain with fever and diarrhea from Yersinia, Campylobacter, or Salmonella infection of the terminal ileum and cecum — a classic appendicitis mimic (\"pseudoappendicitis\").","symptoms":[{"item":"pain_location","options":["rlq","periumbilical"],"text":"RLQ pain"},{"item":"assoc_gi","options":["diarrhea"],"state":"present","text":"Diarrhea, sometimes preceding the pain"},{"item":"assoc_sys","options":["fever"],"state":"present","text":"Fever"},{"item":"assoc_gi","options":["nausea","vomiting"],"state":"present","text":"Nausea, vomiting"},{"item":"duration","options":["h6_24","d1_3","d4_7"],"text":"Days"},{"item":"risk","options":["sick_contacts","travel"],"state":"present","text":"Suspicious food (undercooked pork, poultry), travel, sick contacts"},{"item":"stool_character","options":["watery","loose","bloody"],"text":"Diarrhea, sometimes bloody"},{"item":"diarrhea_duration","options":["lt3d","d3_7","w1_2"],"text":"Acute, days"},{"item":"exposure","options":["undercooked"],"state":"present","text":"Undercooked pork or poultry (Yersinia, Campylobacter)"}],"pe":[{"item":"tenderness","options":["rlq"],"text":"RLQ tenderness"},{"item":"vitals","options":["fever"],"state":"present","text":"Fever"},{"item":"guarding","options":["soft","voluntary"],"text":"Usually less peritonism than appendicitis"},{"item":"rebound","options":["absent"],"text":"Rebound usually absent"}],"labs":["Leukocytosis, raised CRP","Stool culture (request Yersinia culture specifically if suspected)"],"imaging":["Ultrasound or CT — thickened terminal ileum / cecum, enlarged mesenteric nodes, normal appendix"],"pitfalls":["The appendix must be clearly seen as normal before attributing RLQ pain to ileocecitis.","Persistent or recurrent symptoms suggest Crohn's disease or intestinal tuberculosis."]},"intestinal_tuberculosis":{"id":"intestinal_tuberculosis","name":"Intestinal tuberculosis","must_not_miss":false,"timecourse":["chronic"],"status":"draft","one_liner":"Months of RLQ pain, change in bowel habit or diarrhea, weight loss, fever and night sweats from ileocecal tuberculosis — the main mimic of Crohn's disease in Taiwan.","symptoms":[{"item":"diarrhea_duration","options":["m1_3","gt3m"],"text":"Chronic, over months"},{"item":"pain_location","options":["rlq","periumbilical"],"text":"RLQ or periumbilical pain (ileocecal disease)"},{"item":"assoc_sys","options":["fever","night_sweats"],"state":"present","text":"Fever and night sweats"},{"item":"assoc_sys","options":["weight_loss"],"state":"present","text":"Weight loss"},{"item":"diarrhea_pattern","options":["alternating","intermittent"],"text":"Diarrhea alternating with constipation or obstructive symptoms"},{"item":"stool_character","options":["loose","bloody"],"text":"Loose stools; frank bleeding less common than in Crohn's"},{"item":"risk","options":["immunocompromised","diabetes"],"state":"present","text":"HIV, diabetes, immunosuppression, or prior TB / TB contact"}],"pe":[{"item":"palpable","options":["mass"],"state":"present","text":"RLQ mass"},{"item":"tenderness","options":["rlq"],"text":"RLQ tenderness"},{"item":"vitals","options":["fever"],"state":"present","text":"Fever"}],"labs":["Chest X-ray (active or old TB in up to half), IGRA","Colonoscopy biopsies for histology (caseating granulomas), AFB stain, TB culture and PCR","CBC, CRP, albumin, HIV"],"imaging":["Colonoscopy — transverse ulcers, patulous ileocecal valve, involvement of the ileocecal area","CT enterography — short-segment ileocecal thickening, necrotic lymph nodes"],"pitfalls":["Always exclude intestinal TB before starting steroids or biologics for presumed Crohn's disease.","Biopsy yield is limited; an empirical anti-TB trial with endoscopic reassessment is sometimes needed.","Long skip lesions, perianal disease, and longitudinal ulcers favor Crohn's."]},"invasive_bacterial_enterocolitis":{"id":"invasive_bacterial_enterocolitis","name":"Invasive bacterial enterocolitis (Campylobacter, Salmonella, Shigella)","must_not_miss":false,"timecourse":["acute"],"status":"draft","one_liner":"Acute diarrhea with fever and crampy abdominal pain, often bloody or with mucus and tenesmus, beginning 1–3 days after undercooked poultry, eggs, or a shared meal; usually self-limiting within a week.","symptoms":[{"item":"stool_character","options":["bloody","mucus"],"text":"Bloody or mucoid stools (dysentery)"},{"item":"assoc_sys","options":["fever"],"state":"present","text":"Fever"},{"item":"assoc_gi","options":["tenesmus"],"state":"present","text":"Tenesmus"},{"item":"pain_quality","options":["cramping"],"text":"Crampy abdominal pain"},{"item":"stool_volume","options":["small"],"text":"Small-volume, frequent stools (colitis)"},{"item":"exposure","options":["undercooked","banquet","untreated_water"],"state":"present","text":"Undercooked poultry or eggs, shared meal, or untreated water"},{"item":"risk","options":["travel","sick_contacts"],"state":"present","text":"Travel or others ill with the same illness"},{"item":"diarrhea_duration","options":["lt3d","d3_7"],"text":"Acute, under a week"}],"pe":[{"item":"vitals","options":["fever"],"state":"present","text":"Fever"},{"item":"tenderness","options":["llq","diffuse","rlq"],"text":"Lower or diffuse abdominal tenderness without peritonism"},{"item":"rebound","options":["absent"],"text":"No rebound tenderness"},{"item":"general","options":["dehydrated"],"text":"Dry mucous membranes"}],"labs":["Stool culture (or multiplex PCR) — bloody stool, fever, severe illness, immunocompromise","Blood cultures if febrile and systemically unwell (Salmonella bacteremia in the elderly)","CBC, CRP, electrolytes, creatinine"],"imaging":["Usually none; CT only if peritonism or a complication is suspected"],"pitfalls":["Exclude STEC before giving antibiotics for bloody diarrhea with little fever.","Salmonella in patients > 50 years with vascular disease or grafts can seed endovascular infection — consider treatment.","Campylobacter can be followed 1–3 weeks later by Guillain–Barré syndrome or reactive arthritis.","Fluoroquinolone resistance in Campylobacter is high in Asia; azithromycin is preferred when treatment is needed."]},"ischemic_colitis":{"id":"ischemic_colitis","name":"Ischemic colitis","must_not_miss":false,"timecourse":["acute"],"status":"draft","one_liner":"Sudden mild-to-moderate crampy left-sided abdominal pain followed within 24 hours by bloody diarrhea or hematochezia in an older patient with vascular risk factors.","symptoms":[{"item":"onset","options":["sudden","hours"],"text":"Sudden or rapid onset"},{"item":"pain_location","options":["llq","diffuse"],"text":"Left-sided (LLQ) pain"},{"item":"pain_quality","options":["cramping"],"text":"Crampy"},{"item":"assoc_gi","options":["hematochezia","bloody_diarrhea"],"state":"present","text":"Bloody diarrhea or hematochezia within 24 h"},{"item":"assoc_gi","options":["diarrhea"],"state":"present","text":"Urge to defecate"},{"item":"age_group","options":["age_60_plus"],"text":"Usually over 60"},{"item":"risk","options":["atherosclerosis","diabetes","chronic_constipation"],"state":"present","text":"Vascular disease, diabetes, constipation, recent hypotension"},{"item":"stool_character","options":["bloody"],"text":"Bloody diarrhea within 24 hours of the pain"},{"item":"diarrhea_duration","options":["lt3d","d3_7"],"text":"Acute"}],"pe":[{"item":"tenderness","options":["llq"],"text":"Mild LLQ tenderness"},{"item":"guarding","options":["soft"],"text":"Usually soft (peritonism = transmural necrosis)"},{"item":"rectal","options":["fresh_blood"],"text":"Blood on rectal exam"},{"item":"vitals","options":["tachycardia"],"state":"present","text":"Tachycardia if severe"}],"labs":["CBC, lactate, electrolytes, creatinine","Stool culture and C. difficile to exclude infectious colitis"],"imaging":["CT with contrast — segmental colonic wall thickening (watershed areas such as the splenic flexure and rectosigmoid)","Colonoscopy (gentle, minimal insufflation) within 48 h to confirm"],"pitfalls":["Isolated right-sided ischemic colitis can signal SMA disease — consider CT angiography for acute mesenteric ischemia.","Severe pain out of proportion is more typical of small bowel ischemia than ischemic colitis.","Peritonitis, gangrene, or pneumatosis require surgery."]},"ischemic_hepatitis":{"id":"ischemic_hepatitis","name":"Ischemic hepatitis (shock liver)","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Massive, rapid rise in AST/ALT (often > 1000, with very high LDH) within 1–3 days of hypotension, shock, sepsis, or cardiac arrest, usually on a background of heart failure; falls quickly once perfusion is restored.","symptoms":[{"item":"congestion_sx","options":["shock"],"state":"present","text":"Recent hypotension, shock, sepsis, or arrhythmia"},{"item":"congestion_sx","options":["heart_failure"],"state":"present","text":"Underlying heart failure (most cases)"},{"item":"lft_duration","options":["lt1m","first_found"],"text":"Acute, within days of the insult"},{"item":"assoc_other","options":["confusion"],"state":"present","text":"Confusion (hypoperfusion or encephalopathy)"},{"item":"assoc_sys","options":["jaundice"],"state":"absent","text":"Little or no jaundice early"}],"pe":[{"item":"vitals","options":["hypotension","tachycardia"],"state":"present","text":"Hypotension, tachycardia"},{"item":"congestion_pe","options":["jvp","edema"],"state":"present","text":"Signs of heart failure"},{"item":"general","options":["ill","confused"],"text":"Unwell, confused"}],"labs":["AST/ALT > 1000 with LDH very high (ALT/LDH < 1.5 favors ischemia over viral)","Creatinine (concurrent AKI), lactate, INR, troponin","Rapid fall of transaminases (about 50% in 3 days) supports the diagnosis"],"imaging":["Echocardiography","Doppler ultrasound — hepatic artery and portal vein patency"],"pitfalls":["The hypotensive episode may have been brief or unrecorded — ask specifically.","Consider acetaminophen and viral hepatitis in any ALT > 1000."]},"lactose_intolerance":{"id":"lactose_intolerance","name":"Lactose intolerance","must_not_miss":false,"timecourse":["chronic"],"status":"draft","one_liner":"Bloating, crampy abdominal pain, flatulence and loose stools within hours of milk or dairy, settling when dairy is avoided — very common in Taiwanese adults (primary lactase deficiency).","symptoms":[{"item":"food_trigger","options":["dairy"],"state":"present","text":"Clearly worse after milk or dairy"},{"item":"assoc_gi","options":["bloating"],"state":"present","text":"Bloating and flatulence"},{"item":"stool_character","options":["watery","loose"],"text":"Loose or watery stools"},{"item":"fasting_effect","options":["stops"],"text":"Stops with fasting (osmotic)"},{"item":"pain_quality","options":["cramping"],"text":"Crampy abdominal pain"},{"item":"diarrhea_pattern","options":["intermittent"],"text":"Intermittent, diet-related"},{"item":"nocturnal_stool","options":["daytime"],"text":"No nocturnal diarrhea"},{"item":"assoc_sys","options":["weight_loss"],"state":"absent","text":"No weight loss"}],"pe":[{"item":"tenderness","options":["none","diffuse"],"text":"Normal or mildly tender abdomen"},{"item":"bowel_sounds","options":["hyper","normal"],"text":"Normal or hyperactive bowel sounds"}],"labs":["Usually a clinical diagnosis — 2-week dairy exclusion trial","Lactose hydrogen breath test where available"],"imaging":["None needed unless alarm features"],"pitfalls":["Secondary lactase deficiency follows gastroenteritis or accompanies celiac or Crohn's disease.","Lactose intolerance is common and can coexist with another disease — alarm features still need workup.","Yogurt and hard cheeses are often tolerated."]},"liver_abscess":{"id":"liver_abscess","name":"Liver abscess","must_not_miss":true,"timecourse":["acute","subacute"],"status":"draft","one_liner":"Fever with rigors and RUQ pain or tenderness over days to weeks, often in a diabetic patient; in Taiwan Klebsiella pneumoniae is the leading cause and can spread to the eye and CNS.","symptoms":[{"item":"assoc_sys","options":["fever","chills"],"state":"present","text":"High fever with chills or rigors (may be the only symptom)"},{"item":"pain_location","options":["ruq"],"text":"RUQ pain (absent in many patients)"},{"item":"pain_quality","options":["dull"],"text":"Dull, constant ache"},{"item":"duration","options":["d4_7","w1_4"],"text":"Days to weeks"},{"item":"aggravating","options":["deep_breath"],"text":"Pleuritic pain or right shoulder discomfort from diaphragmatic irritation"},{"item":"assoc_sys","options":["malaise","weight_loss"],"state":"present","text":"Malaise, anorexia, weight loss"},{"item":"risk","options":["diabetes","immunocompromised","biliary_procedure"],"state":"present","text":"Diabetes, immunocompromise, biliary disease or intervention"},{"item":"risk","options":["travel"],"state":"present","text":"Travel to endemic areas (amebic abscess)"},{"item":"lft_duration","options":["lt1m","first_found"],"text":"Acute, days to weeks"}],"pe":[{"item":"vitals","options":["fever"],"state":"present","text":"Fever"},{"item":"palpable","options":["liver_tender","hepatomegaly"],"state":"present","text":"Liver tenderness on fist percussion, hepatomegaly"},{"item":"tenderness","options":["ruq"],"text":"RUQ tenderness"},{"item":"chest","options":["crackles_r"],"state":"present","text":"Reduced breath sounds / crackles at the right base (effusion, atelectasis)"},{"item":"vitals","options":["tachycardia","hypotension"],"state":"present","text":"Tachycardia; hypotension if septic"}],"labs":["Leukocytosis, markedly raised CRP; raised ALP is common","Blood cultures (positive in many Klebsiella cases); glucose / HbA1c","Amebic serology when exposure is possible"],"imaging":["Ultrasound or contrast CT — CT is more sensitive and guides drainage","Percutaneous aspiration / drainage for diagnosis and treatment"],"pitfalls":["Fever without localizing symptoms is a common presentation — image the liver in febrile diabetics.","Klebsiella liver abscess can cause endophthalmitis and meningitis; ask about visual symptoms and examine the eyes.","Consider colonoscopy after recovery in cryptogenic Klebsiella abscess (association with colorectal neoplasia).","Early lesions on ultrasound can look solid and be mistaken for a tumor."]},"liver_malignancy":{"id":"liver_malignancy","name":"Hepatocellular carcinoma / liver metastases","must_not_miss":false,"timecourse":["subacute","chronic"],"status":"draft","one_liner":"New or worsening liver test abnormalities, weight loss, RUQ discomfort or decompensation in a patient with chronic HBV, HCV, or cirrhosis (HCC), or with a known primary cancer (metastases).","symptoms":[{"item":"viral_history","options":["hbv","hcv"],"state":"present","text":"Chronic HBV or HCV"},{"item":"alcohol_use","options":["heavy","former"],"text":"Alcohol-related cirrhosis"},{"item":"assoc_sys","options":["weight_loss","malaise"],"state":"present","text":"Weight loss, fatigue"},{"item":"assoc_gi","options":["anorexia"],"state":"present","text":"Anorexia"},{"item":"pain_location","options":["ruq"],"text":"RUQ pain or fullness"},{"item":"liver_warning","options":["distension"],"state":"present","text":"Abdominal swelling"},{"item":"other_liver","options":["fhx_liver"],"state":"present","text":"Family history of HCC"},{"item":"age_group","options":["age_40_59","age_60_plus"],"text":"Middle-aged or older"}],"pe":[{"item":"palpable","options":["hepatomegaly","mass"],"state":"present","text":"Hard, irregular liver or mass"},{"item":"palpable","options":["ascites"],"state":"present","text":"Ascites"},{"item":"skin","options":["icterus"],"state":"present","text":"Jaundice (advanced or biliary invasion)"}],"labs":["AFP (normal in up to a third of HCC)","CEA, CA 19-9 for metastases; liver panel, INR, albumin"],"imaging":["Multiphase contrast CT or MRI (arterial enhancement with washout = HCC)","Biopsy for metastases or atypical lesions"],"pitfalls":["HBV-related HCC can develop without cirrhosis.","Missed surveillance is common — check when the last ultrasound was."]},"malignant_biliary_obstruction":{"id":"malignant_biliary_obstruction","name":"Malignant biliary obstruction (pancreatic head, cholangiocarcinoma)","must_not_miss":false,"timecourse":["subacute","chronic"],"status":"draft","one_liner":"Painless, progressive jaundice with dark urine, pale stools and itching, often with weight loss and anorexia, in an older patient — a cholestatic pattern with dilated bile ducts.","symptoms":[{"item":"assoc_sys","options":["jaundice","dark_urine","pale_stool"],"state":"present","text":"Progressive obstructive jaundice"},{"item":"assoc_sys","options":["pruritus"],"state":"present","text":"Itching"},{"item":"assoc_sys","options":["weight_loss"],"state":"present","text":"Weight loss"},{"item":"assoc_gi","options":["anorexia"],"state":"present","text":"Anorexia"},{"item":"assoc_sys","options":["fever"],"state":"absent","text":"Usually afebrile unless cholangitis"},{"item":"age_group","options":["age_60_plus","age_40_59"],"text":"Older patient"},{"item":"pain_location","options":["epigastric","ruq"],"text":"Vague epigastric or back pain (often painless)"},{"item":"lft_duration","options":["lt1m","m1_6"],"text":"Weeks"},{"item":"risk","options":["diabetes"],"state":"present","text":"New-onset diabetes (pancreatic cancer)"},{"item":"radiation","options":["back"],"text":"Back pain (pancreatic cancer)"}],"pe":[{"item":"skin","options":["icterus"],"state":"present","text":"Jaundice"},{"item":"palpable","options":["gallbladder"],"state":"present","text":"Palpable non-tender gallbladder (Courvoisier)"},{"item":"liver_pe","options":["excoriations"],"state":"present","text":"Scratch marks"},{"item":"palpable","options":["hepatomegaly","mass"],"state":"present","text":"Hepatomegaly or mass"}],"labs":["Cholestatic pattern: ALP, GGT, direct bilirubin","CA 19-9 (raised by obstruction itself), CEA","INR (vitamin K malabsorption)"],"imaging":["Ultrasound — dilated ducts","Pancreas-protocol CT, MRCP; EUS with biopsy","ERCP for drainage and brushing"],"pitfalls":["Painless jaundice in an older adult is cancer until proven otherwise.","Hilar cholangiocarcinoma can cause intrahepatic duct dilatation without a dilated CBD.","Liver flukes (Clonorchis) are a cholangiocarcinoma risk factor in parts of Asia."]},"masld":{"id":"masld","name":"MASLD / MASH (metabolic dysfunction-associated steatotic liver disease)","must_not_miss":false,"timecourse":["chronic"],"status":"draft","one_liner":"Mild ALT > AST elevation with fatty liver on ultrasound in a patient with obesity, diabetes, dyslipidemia, or hypertension and little alcohol; most are asymptomatic, and fibrosis stage decides prognosis.","symptoms":[{"item":"metabolic","options":["obesity","weight_gain"],"state":"present","text":"Overweight, central obesity, weight gain"},{"item":"metabolic","options":["dyslipidemia","hypertension"],"state":"present","text":"Dyslipidemia, hypertension"},{"item":"risk","options":["diabetes","hypertriglyceridemia"],"state":"present","text":"Diabetes, hypertriglyceridemia"},{"item":"alcohol_use","options":["never","social"],"text":"Little or no alcohol"},{"item":"lft_duration","options":["gt6m","first_found"],"text":"Chronic or found on routine testing"},{"item":"assoc_sys","options":["jaundice"],"state":"absent","text":"No jaundice"}],"pe":[{"item":"palpable","options":["hepatomegaly"],"state":"present","text":"Hepatomegaly"},{"item":"tenderness","options":["none"],"text":"Non-tender"}],"labs":["ALT > AST (AST > ALT suggests advanced fibrosis or alcohol); GGT may be mildly raised","HbA1c, lipids; FIB-4 for fibrosis risk","Exclude HBV, HCV, alcohol, drugs, iron overload"],"imaging":["Ultrasound — bright liver","Transient elastography if FIB-4 ≥ 1.3"],"pitfalls":["Normal ALT does not exclude MASH or fibrosis.","Can coexist with HBV or alcohol use (MetALD: moderate alcohol + metabolic risk).","Weight loss of 7–10% improves steatosis and inflammation."]},"microscopic_colitis":{"id":"microscopic_colitis","name":"Microscopic colitis","must_not_miss":false,"timecourse":["chronic"],"status":"draft","one_liner":"Chronic or relapsing watery, non-bloody diarrhea, often nocturnal and urgent, in a middle-aged or older woman, frequently linked to NSAIDs, PPIs, or SSRIs; the colon looks normal and the diagnosis needs biopsies.","symptoms":[{"item":"stool_character","options":["watery"],"text":"Watery, non-bloody diarrhea"},{"item":"diarrhea_duration","options":["w2_4","m1_3","gt3m"],"text":"Weeks to months, often relapsing"},{"item":"nocturnal_stool","options":["wakes"],"text":"Nocturnal diarrhea"},{"item":"assoc_gi","options":["tenesmus"],"state":"present","text":"Urgency"},{"item":"continence","options":["incontinence"],"state":"present","text":"Fecal incontinence"},{"item":"fasting_effect","options":["persists"],"text":"Persists with fasting (secretory)"},{"item":"sex","options":["female"],"text":"Women more often affected"},{"item":"age_group","options":["age_60_plus","age_40_59"],"text":"Usually over 50"},{"item":"diarrhea_drugs","options":["ppi","ssri"],"state":"present","text":"PPI or SSRI use"},{"item":"risk","options":["nsaid"],"state":"present","text":"NSAID use"},{"item":"assoc_sys","options":["weight_loss"],"state":"present","text":"Mild weight loss can occur"}],"pe":[{"item":"tenderness","options":["none","diffuse"],"text":"Unremarkable abdomen, or mild diffuse tenderness"},{"item":"rectal","options":["normal"],"text":"Normal rectal exam"}],"labs":["Fecal calprotectin may be mildly raised; stool infection screen and TSH, celiac serology if indicated","CBC, CRP, albumin usually normal"],"imaging":["Colonoscopy with random biopsies from right and left colon even if the mucosa looks normal"],"pitfalls":["A normal-looking colonoscopy does not exclude it — biopsies are essential.","Nocturnal diarrhea argues against IBS; think microscopic colitis in an older patient.","Stop culprit drugs; budesonide is first-line treatment."]},"muscle_injury":{"id":"muscle_injury","name":"Muscle injury (AST / ALT from muscle)","must_not_miss":false,"timecourse":["acute"],"status":"draft","one_liner":"Raised AST (more than ALT) with normal bilirubin, ALP and GGT after strenuous exercise, trauma, seizures, statins, or myositis — the source is muscle, not liver; CK is markedly raised.","symptoms":[{"item":"other_liver","options":["exercise"],"state":"present","text":"Strenuous exercise or muscle injury"},{"item":"liver_drugs","options":["statin"],"state":"present","text":"Statin use"},{"item":"lft_duration","options":["lt1m","first_found"],"text":"Acute"},{"item":"assoc_sys","options":["jaundice"],"state":"absent","text":"No jaundice"},{"item":"alcohol_use","options":["never","social"],"text":"Little alcohol"},{"item":"extraintestinal","options":["thyrotoxic"],"state":"present","text":"Thyroid disease can cause myopathy"}],"pe":[{"item":"tenderness","options":["none"],"text":"Non-tender abdomen"},{"item":"skin","options":["icterus"],"state":"absent","text":"No jaundice"}],"labs":["CK (often > 5 × ULN); AST > ALT; GGT and bilirubin normal","Creatinine, urinalysis (myoglobinuria); TSH","Repeat liver tests after 1–2 weeks of rest"],"imaging":["None needed"],"pitfalls":["Check CK before an extensive liver work-up for isolated AST elevation.","Persistent CK elevation without exercise suggests myositis or hypothyroidism."]},"ovarian_torsion":{"id":"ovarian_torsion","name":"Ovarian torsion","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Sudden severe unilateral lower abdominal pain with nausea and vomiting in a woman with an ovarian cyst or mass; pain may be intermittent with partial torsion. Normal Doppler flow does not exclude it.","symptoms":[{"item":"sex","options":["female"],"text":"Female, often reproductive age (also children, pregnancy)"},{"item":"onset","options":["sudden"],"text":"Sudden onset, sometimes after exertion"},{"item":"pain_location","options":["rlq","llq","suprapubic"],"text":"Unilateral lower abdominal / pelvic pain"},{"item":"severity","options":["s7","s8","s9","s10"],"text":"Severe"},{"item":"pain_pattern","options":["waves","attacks"],"text":"Intermittent with partial torsion / detorsion"},{"item":"assoc_gi","options":["nausea","vomiting"],"state":"present","text":"Nausea and vomiting (common)"},{"item":"precipitant","options":["exertion"],"text":"May follow exercise or sudden movement"}],"pe":[{"item":"pelvic","options":["adnexal_mass","adnexal_tender"],"state":"present","text":"Adnexal tenderness or mass"},{"item":"tenderness","options":["rlq","llq","suprapubic"],"text":"Lower abdominal tenderness"},{"item":"vitals","options":["fever"],"state":"present","text":"Low-grade fever suggests necrosis"},{"item":"rebound","options":["present"],"text":"Peritonism (late)"}],"labs":["hCG; CBC (mild leukocytosis)"],"imaging":["Pelvic / transvaginal ultrasound with Doppler — enlarged ovary with peripheral follicles, mass, \"whirlpool\" sign","Diagnosis is ultimately surgical (laparoscopy)"],"pitfalls":["Preserved Doppler flow does not exclude torsion.","Often misdiagnosed as renal colic or gastroenteritis because of vomiting.","Time to detorsion determines ovarian salvage — involve gynecology early."]},"overflow_diarrhea":{"id":"overflow_diarrhea","name":"Overflow diarrhea (fecal impaction)","must_not_miss":false,"timecourse":["subacute","chronic"],"status":"draft","one_liner":"Frequent small-volume liquid stools or soiling leaking around impacted stool, in an elderly, bedbound, or cognitively impaired patient, often on opioids or anticholinergics.","symptoms":[{"item":"age_group","options":["age_60_plus"],"text":"Elderly"},{"item":"exposure","options":["institution"],"state":"present","text":"Care home resident or bedbound"},{"item":"stool_volume","options":["small"],"text":"Small-volume, frequent liquid stools"},{"item":"continence","options":["incontinence"],"state":"present","text":"Soiling or fecal incontinence"},{"item":"diarrhea_pattern","options":["alternating"],"text":"Preceded by constipation"},{"item":"assoc_gi","options":["bloating"],"state":"present","text":"Bloating, abdominal discomfort"},{"item":"assoc_sys","options":["fever"],"state":"absent","text":"No fever"}],"pe":[{"item":"rectal","options":["hard_stool"],"text":"Hard stool in the rectum on digital exam"},{"item":"abd_contour","options":["mild","marked"],"text":"Abdominal distension"},{"item":"palpable","options":["mass"],"state":"present","text":"Palpable fecal mass"}],"labs":["Electrolytes, calcium, TSH (causes of constipation)"],"imaging":["Plain abdominal X-ray — fecal loading, excludes obstruction if no rectal impaction"],"pitfalls":["Treating with antidiarrheals makes it worse — always do a rectal exam in the elderly with \"diarrhea\".","Impaction can be higher in the colon with an empty rectum.","Review opioids, anticholinergics, calcium channel blockers, and iron."]},"peptic_ulcer_disease":{"id":"peptic_ulcer_disease","name":"Peptic ulcer disease","must_not_miss":false,"timecourse":["subacute","chronic"],"status":"draft","one_liner":"Recurrent burning or gnawing epigastric pain related to meals, often waking the patient at night and relieved by antacids, in a patient with H. pylori infection or NSAID / aspirin use.","symptoms":[{"item":"pain_location","options":["epigastric"],"text":"Epigastric pain, well localized"},{"item":"pain_quality","options":["burning","gnawing"],"text":"Burning or gnawing, hunger-like pain"},{"item":"meal_relation","options":["better_eating","worse_hungry","worse_eating"],"text":"Meal-related — duodenal ulcer classically eased by food and worse when hungry; gastric ulcer often worse after eating"},{"item":"nocturnal","options":["wakes"],"text":"Wakes the patient at night (typical of duodenal ulcer)"},{"item":"relieving","options":["antacid"],"text":"Relieved by antacids or acid suppression"},{"item":"episodes","options":["recurrent"],"text":"Episodic, recurring over weeks to months"},{"item":"assoc_gi","options":["nausea","bloating","early_satiety"],"state":"present","text":"Nausea, bloating, or early satiety"},{"item":"risk","options":["nsaid","hpylori","pud"],"state":"present","text":"NSAID / aspirin use, H. pylori, or a prior ulcer"},{"item":"assoc_gi","options":["melena","hematemesis"],"state":"present","text":"Melena or hematemesis signal a bleeding ulcer"},{"item":"assoc_sys","options":["weight_loss"],"state":"absent","text":"No weight loss (weight loss raises concern for malignancy)"}],"pe":[{"item":"tenderness","options":["epigastric"],"text":"Mild epigastric tenderness"},{"item":"guarding","options":["soft"],"text":"Soft abdomen without peritoneal signs (rigidity suggests perforation)"},{"item":"skin","options":["pallor"],"state":"present","text":"Pallor if there is chronic blood loss"},{"item":"rectal","options":["melena"],"text":"Melena on rectal exam if bleeding"}],"labs":["CBC — iron-deficiency anemia from occult bleeding","H. pylori test (urea breath test or stool antigen; hold PPI for 2 weeks beforehand)","Otherwise usually normal"],"imaging":["EGD for alarm features (bleeding, anemia, weight loss, dysphagia, persistent vomiting) or age ≥ 60","Biopsy every gastric ulcer and confirm healing by repeat EGD"],"pitfalls":["Symptoms alone cannot reliably separate PUD, functional dyspepsia, and gastric cancer.","NSAID-related ulcers are often painless and first present with bleeding or perforation.","Sudden severe pain with rigidity means perforation; persistent vomiting suggests gastric outlet obstruction.","PPI use, antibiotics, and bismuth cause false-negative H. pylori tests.","Exclude ACS in older patients with new \"epigastric\" pain, especially on exertion."]},"perforated_peptic_ulcer":{"id":"perforated_peptic_ulcer","name":"Perforated peptic ulcer","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Sudden, severe epigastric pain that rapidly becomes generalized, with a rigid, silent abdomen, in a patient with ulcer history, NSAID use or smoking; free air on upright X-ray or CT.","symptoms":[{"item":"onset","options":["sudden"],"text":"Abrupt onset — patients often recall the exact moment"},{"item":"pain_location","options":["epigastric","diffuse"],"text":"Epigastric pain becoming diffuse"},{"item":"pain_migration","options":["local_to_diffuse"],"text":"Spreads from the epigastrium over the whole abdomen"},{"item":"severity","options":["s8","s9","s10"],"text":"Severe pain"},{"item":"aggravating","options":["movement"],"text":"Worse with any movement or breathing"},{"item":"relieving","options":["lying_still"],"text":"Lies still to avoid pain"},{"item":"radiation","options":["r_shoulder"],"text":"Shoulder-tip pain from diaphragmatic irritation"},{"item":"risk","options":["nsaid","pud","smoking","hpylori"],"state":"present","text":"NSAID / aspirin use, prior ulcer, smoking, H. pylori"},{"item":"precipitant","options":["nsaid"],"text":"Recent NSAID or steroid use"}],"pe":[{"item":"guarding","options":["rigid","involuntary"],"text":"Board-like rigidity / involuntary guarding"},{"item":"rebound","options":["present"],"text":"Rebound tenderness"},{"item":"tenderness","options":["epigastric","diffuse"],"text":"Epigastric then diffuse tenderness"},{"item":"bowel_sounds","options":["hypo","absent"],"text":"Reduced or absent bowel sounds"},{"item":"general","options":["lying_still"],"text":"Lying still, reluctant to move"},{"item":"vitals","options":["tachycardia","fever"],"state":"present","text":"Tachycardia; fever develops later"}],"labs":["Leukocytosis; lipase can be mildly raised","Lactate, creatinine, and electrolytes for resuscitation"],"imaging":["Erect chest X-ray — free subdiaphragmatic air (absent in a sizable minority)","CT abdomen — more sensitive for small amounts of free air and locating the perforation"],"pitfalls":["Elderly patients, those on steroids, and the immunosuppressed may have few peritoneal signs.","Absence of free air on X-ray does not exclude perforation.","A raised lipase can mislead toward pancreatitis.","Initial chemical peritonitis may briefly \"improve\" before bacterial peritonitis sets in."]},"perforation_peritonitis":{"id":"perforation_peritonitis","name":"Hollow viscus perforation / peritonitis","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Severe, constant, diffuse abdominal pain worsened by any movement, with the patient lying still, a rigid abdomen, rebound tenderness, fever and tachycardia — from perforation of the stomach, bowel, or appendix.","symptoms":[{"item":"pain_location","options":["diffuse"],"text":"Diffuse pain (may start localized)"},{"item":"pain_migration","options":["local_to_diffuse"],"text":"Localized pain spreading over the whole abdomen"},{"item":"onset","options":["sudden","hours"],"text":"Sudden (perforation) or progressive onset"},{"item":"pain_pattern","options":["constant"],"text":"Constant pain"},{"item":"severity","options":["s8","s9","s10"],"text":"Severe"},{"item":"aggravating","options":["movement"],"text":"Worse with movement, coughing, bumps in the road"},{"item":"relieving","options":["lying_still"],"text":"Lies still"},{"item":"assoc_sys","options":["fever"],"state":"present","text":"Fever"},{"item":"assoc_gi","options":["vomiting","anorexia"],"state":"present","text":"Vomiting, anorexia"}],"pe":[{"item":"guarding","options":["rigid","involuntary"],"text":"Rigidity / involuntary guarding"},{"item":"rebound","options":["present"],"text":"Rebound tenderness; pain with percussion or heel drop"},{"item":"tenderness","options":["diffuse"],"text":"Diffuse tenderness"},{"item":"bowel_sounds","options":["hypo","absent"],"text":"Reduced or absent bowel sounds"},{"item":"general","options":["lying_still","ill"],"text":"Ill-appearing, lying still"},{"item":"vitals","options":["fever","tachycardia","hypotension"],"state":"present","text":"Fever, tachycardia, hypotension (sepsis)"}],"labs":["Leukocytosis (or leukopenia), raised CRP and lactate","Electrolytes, creatinine, coagulation, blood cultures, type and screen"],"imaging":["Erect chest X-ray for free air","CT abdomen / pelvis — free air, fluid, source"],"pitfalls":["Steroids, immunosuppression, old age, and spinal cord injury blunt peritoneal signs.","Analgesia does not mask peritonitis enough to delay diagnosis — give it.","Spontaneous bacterial peritonitis in cirrhosis presents subtly (fever, encephalopathy) and is managed medically."]},"pid":{"id":"pid","name":"Pelvic inflammatory disease","must_not_miss":false,"timecourse":["acute","subacute"],"status":"draft","one_liner":"Bilateral lower abdominal / pelvic pain with abnormal vaginal discharge, dyspareunia, and fever in a sexually active woman, with cervical motion, uterine, or adnexal tenderness.","symptoms":[{"item":"sex","options":["female"],"text":"Sexually active woman"},{"item":"pain_location","options":["suprapubic","rlq","llq"],"text":"Bilateral lower abdominal or pelvic pain"},{"item":"onset","options":["gradual","hours"],"text":"Gradual onset, often during or after menses"},{"item":"assoc_gu","options":["vaginal_discharge"],"state":"present","text":"Abnormal vaginal discharge"},{"item":"assoc_gu","options":["dyspareunia"],"state":"present","text":"Dyspareunia"},{"item":"assoc_gu","options":["vaginal_bleeding"],"state":"present","text":"Intermenstrual or postcoital bleeding"},{"item":"assoc_sys","options":["fever"],"state":"present","text":"Fever (not always)"},{"item":"risk","options":["sti_risk"],"state":"present","text":"New or multiple sexual partners, prior STI"},{"item":"radiation","options":["r_shoulder"],"text":"RUQ / right shoulder pain (Fitz-Hugh–Curtis perihepatitis)"}],"pe":[{"item":"pelvic","options":["cmt"],"state":"present","text":"Cervical motion tenderness"},{"item":"pelvic","options":["adnexal_tender"],"state":"present","text":"Adnexal tenderness (usually bilateral)"},{"item":"pelvic","options":["cervical_discharge"],"state":"present","text":"Mucopurulent cervical discharge"},{"item":"pelvic","options":["adnexal_mass"],"state":"present","text":"Adnexal mass suggests tubo-ovarian abscess"},{"item":"tenderness","options":["suprapubic","rlq","llq"],"text":"Lower abdominal tenderness"},{"item":"vitals","options":["fever"],"state":"present","text":"Fever"}],"labs":["hCG (exclude ectopic pregnancy)","NAAT for gonorrhea and chlamydia; CBC, CRP; HIV and syphilis screening"],"imaging":["Transvaginal ultrasound if severe, or to exclude tubo-ovarian abscess"],"pitfalls":["Clinical diagnosis has a low threshold — treat empirically when minimum criteria are met.","Always exclude ectopic pregnancy and appendicitis.","Treat partners; follow up within 72 h."]},"primary_biliary_cholangitis":{"id":"primary_biliary_cholangitis","name":"Primary biliary cholangitis (PBC)","must_not_miss":false,"timecourse":["chronic"],"status":"draft","one_liner":"Persistently raised ALP and GGT, often with fatigue and itching, in a middle-aged woman with positive anti-mitochondrial antibody; treated with ursodeoxycholic acid.","symptoms":[{"item":"sex","options":["female"],"text":"Women (about 9:1), usually middle-aged"},{"item":"assoc_sys","options":["pruritus"],"state":"present","text":"Itching"},{"item":"assoc_sys","options":["malaise"],"state":"present","text":"Fatigue"},{"item":"other_liver","options":["autoimmune"],"state":"present","text":"Sjögren, thyroid disease, other autoimmunity"},{"item":"lft_duration","options":["gt6m","first_found"],"text":"Chronic, often found on routine testing"},{"item":"age_group","options":["age_40_59","age_60_plus"],"text":"Middle-aged or older"},{"item":"assoc_sys","options":["jaundice"],"state":"absent","text":"Jaundice only in advanced disease"}],"pe":[{"item":"liver_pe","options":["excoriations"],"state":"present","text":"Scratch marks"},{"item":"palpable","options":["hepatomegaly"],"state":"present","text":"Hepatomegaly"},{"item":"skin","options":["icterus"],"state":"present","text":"Jaundice (late, poor prognosis)"}],"labs":["ALP > 1.5 × ULN with GGT raised; anti-mitochondrial antibody (AMA-M2)","IgM raised; lipids raised; check vitamin D and bone density"],"imaging":["Ultrasound to exclude extrahepatic obstruction","Elastography; bone densitometry"],"pitfalls":["AMA-negative PBC exists (check PBC-specific ANA — sp100, gp210).","Rising bilirubin is the strongest predictor of poor outcome."]},"renal_colic":{"id":"renal_colic","name":"Renal colic (urolithiasis)","must_not_miss":false,"timecourse":["acute"],"status":"draft","one_liner":"Sudden severe colicky flank pain radiating to the groin in a restless patient who cannot find a comfortable position, with hematuria, nausea and vomiting.","symptoms":[{"item":"pain_location","options":["flank_r","flank_l","rlq","llq"],"text":"Flank pain (lower quadrant as the stone descends)"},{"item":"onset","options":["sudden"],"text":"Sudden onset"},{"item":"pain_quality","options":["colicky","sharp"],"text":"Colicky, sharp"},{"item":"pain_pattern","options":["waves"],"text":"Comes in waves"},{"item":"severity","options":["s7","s8","s9","s10"],"text":"Severe"},{"item":"radiation","options":["groin"],"text":"Radiates to the groin, testis, or labia"},{"item":"relieving","options":["no_position"],"text":"No position of comfort"},{"item":"assoc_gu","options":["hematuria"],"state":"present","text":"Hematuria"},{"item":"assoc_gu","options":["frequency","dysuria"],"state":"present","text":"Urgency or frequency (distal ureteric stone)"},{"item":"assoc_gi","options":["nausea","vomiting"],"state":"present","text":"Nausea and vomiting"},{"item":"risk","options":["kidney_stones"],"state":"present","text":"Previous stones"}],"pe":[{"item":"general","options":["restless"],"text":"Restless, writhing"},{"item":"cva_tenderness","options":["right","left"],"text":"CVA tenderness"},{"item":"guarding","options":["soft"],"text":"Soft abdomen, no peritonism"},{"item":"vitals","options":["fever"],"state":"absent","text":"Afebrile (fever + obstruction = emergency)"}],"labs":["Urinalysis (hematuria in most, but not all)","Creatinine; CBC and urine culture if fever"],"imaging":["Non-contrast CT KUB (low-dose) or ultrasound for hydronephrosis","Ultrasound first in pregnancy and young patients with prior stones"],"pitfalls":["Fever with an obstructed kidney is a urologic emergency — needs decompression.","First \"renal colic\" over 60 — exclude ruptured AAA.","Absence of hematuria does not exclude a stone; hematuria also occurs with AAA and appendicitis.","In women, consider ovarian torsion and ectopic pregnancy."]},"rll_pneumonia":{"id":"rll_pneumonia","name":"Right lower lobe pneumonia","must_not_miss":false,"timecourse":["acute"],"status":"draft","one_liner":"Fever, cough and pleuritic RUQ or upper abdominal pain from diaphragmatic pleural irritation, with crackles at the right base and a benign abdominal exam.","symptoms":[{"item":"pain_location","options":["ruq","epigastric"],"text":"RUQ or upper abdominal pain"},{"item":"aggravating","options":["deep_breath"],"text":"Worse with deep breathing or coughing (pleuritic)"},{"item":"assoc_other","options":["cough"],"state":"present","text":"Cough, sometimes productive"},{"item":"assoc_other","options":["dyspnea"],"state":"present","text":"Shortness of breath"},{"item":"assoc_sys","options":["fever","chills"],"state":"present","text":"Fever and chills"},{"item":"duration","options":["h6_24","d1_3","d4_7"],"text":"Acute onset over days"}],"pe":[{"item":"chest","options":["crackles_r"],"state":"present","text":"Crackles or bronchial breath sounds at the right base"},{"item":"vitals","options":["fever"],"state":"present","text":"Fever"},{"item":"vitals","options":["tachypnea","hypoxemia"],"state":"present","text":"Tachypnea, low oxygen saturation"},{"item":"guarding","options":["soft"],"text":"Abdomen soft; tenderness, if any, is mild and not peritoneal"},{"item":"abd_signs","options":["murphy"],"state":"absent","text":"Murphy's sign negative"}],"labs":["Leukocytosis, raised CRP; procalcitonin if available","Liver tests and lipase are usually normal"],"imaging":["Chest X-ray (PA and lateral) — lower lobe consolidation can hide behind the diaphragm on a supine film","Lung bases are visible on abdominal CT — always review them"],"pitfalls":["Always auscultate the lung bases in RUQ or upper abdominal pain.","Children and the elderly often have fewer respiratory symptoms.","Pulmonary embolism with infarction and pleural effusion can produce the same picture."]},"ruptured_aaa":{"id":"ruptured_aaa","name":"Ruptured abdominal aortic aneurysm","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Sudden severe abdominal, back, or flank pain with syncope or hypotension in an older male smoker; a pulsatile mass may be felt. Classic triad is present in only about half.","symptoms":[{"item":"onset","options":["sudden"],"text":"Sudden onset"},{"item":"severity","options":["s8","s9","s10"],"text":"Severe pain"},{"item":"pain_location","options":["diffuse","periumbilical","flank_l","flank_r"],"text":"Abdominal, back, or flank pain"},{"item":"radiation","options":["back","groin"],"text":"Radiates to the back, flank, or groin"},{"item":"assoc_other","options":["syncope"],"state":"present","text":"Syncope or near-syncope"},{"item":"age_group","options":["age_60_plus"],"text":"Usually over 60"},{"item":"sex","options":["male"],"text":"Men more than women"},{"item":"risk","options":["aaa","smoking","atherosclerosis"],"state":"present","text":"Known AAA, smoking, atherosclerotic disease"}],"pe":[{"item":"vitals","options":["hypotension","tachycardia"],"state":"present","text":"Hypotension, tachycardia"},{"item":"palpable","options":["pulsatile"],"state":"present","text":"Pulsatile, tender epigastric / periumbilical mass (often not felt in obese patients)"},{"item":"general","options":["pale_diaphoretic"],"text":"Pale and diaphoretic"},{"item":"skin","options":["ecchymosis"],"state":"present","text":"Flank or periumbilical ecchymosis (retroperitoneal blood)"}],"labs":["Type and crossmatch, CBC, coagulation, creatinine — do not delay surgery for results"],"imaging":["Bedside ultrasound of the aorta if unstable","CT angiography if stable enough"],"pitfalls":["Commonly misdiagnosed as renal colic — first \"renal colic\" in a patient over 60 needs the aorta imaged.","Hypotension may be transient; a contained rupture can look stable.","A normal-sized aorta on ultrasound does not exclude aortic dissection."]},"sibo":{"id":"sibo","name":"Small intestinal bacterial overgrowth (SIBO)","must_not_miss":false,"timecourse":["chronic"],"status":"draft","one_liner":"Chronic bloating, flatulence and loose or fatty stools, sometimes with weight loss and B12 deficiency, in a patient with altered anatomy or motility — gastrectomy, bowel resection, diabetes, scleroderma, or long-term PPI.","symptoms":[{"item":"assoc_gi","options":["bloating"],"state":"present","text":"Marked bloating and flatulence"},{"item":"stool_character","options":["loose","watery","greasy"],"text":"Loose stools; steatorrhea in severe cases"},{"item":"diarrhea_history","options":["gastric_surgery","bowel_resection"],"state":"present","text":"Previous gastrectomy, bariatric surgery, or bowel resection"},{"item":"risk","options":["diabetes"],"state":"present","text":"Diabetes with autonomic neuropathy"},{"item":"diarrhea_drugs","options":["ppi"],"state":"present","text":"Long-term PPI use"},{"item":"assoc_sys","options":["weight_loss"],"state":"present","text":"Weight loss (malabsorption)"},{"item":"diarrhea_duration","options":["m1_3","gt3m"],"text":"Chronic"}],"pe":[{"item":"abd_contour","options":["mild","marked"],"text":"Abdominal distension"},{"item":"skin","options":["pallor"],"state":"present","text":"Pallor (B12 deficiency)"}],"labs":["B12 low with folate high (bacteria make folate); albumin, vitamin D","Glucose or lactulose hydrogen breath test (limited availability)","Jejunal aspirate culture — the reference test, rarely done"],"imaging":["Consider small-bowel imaging for strictures, diverticula, or blind loops"],"pitfalls":["Treat the underlying cause; recurrence is common after antibiotics alone.","Breath tests have false positives (rapid transit) and false negatives."]},"sigmoid_volvulus":{"id":"sigmoid_volvulus","name":"Sigmoid volvulus","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Massive abdominal distension with colicky pain and obstipation in an elderly, often institutionalized or neurologically impaired patient with chronic constipation; risk of strangulation and perforation.","symptoms":[{"item":"assoc_gi","options":["obstipation"],"state":"present","text":"No stool or flatus"},{"item":"assoc_gi","options":["bloating"],"state":"present","text":"Marked distension"},{"item":"pain_quality","options":["colicky","cramping"],"text":"Colicky pain"},{"item":"pain_location","options":["llq","diffuse"],"text":"LLQ or diffuse pain"},{"item":"assoc_gi","options":["vomiting"],"state":"present","text":"Vomiting (late)"},{"item":"age_group","options":["age_60_plus"],"text":"Elderly"},{"item":"risk","options":["chronic_constipation","retention_drugs"],"state":"present","text":"Chronic constipation, psychotropic or anticholinergic drugs, neurologic disease"},{"item":"episodes","options":["recurrent"],"text":"Previous similar episodes are common"}],"pe":[{"item"
