<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POMD — Chief complaint work-up</title>
<style>
/* POMD styles — no external fonts or resources (must work offline from file://). */

:root {
  --bg: #f3f5f7;
  --panel: #ffffff;
  --line: #d8dde3;
  --text: #1f2933;
  --muted: #6b7785;
  --brand: #1f3a5f;
  --sel: #2563eb;
  --sel-bg: #dbe7ff;
  --present: #15803d;
  --present-bg: #dcfce7;
  --absent: #9f1239;
  --absent-bg: #fde7ec;
  --hit-bg: #fff3c4;
  --hit-line: #e0a800;
  --mnm: #c62828;
  --match: #2e7d32;
  --match-bg: #e8f5e9;
  --diff: #c2410c;
  --diff-bg: #fff1e6;
  --none: #8a94a0;
  --footer-h: 160px;
}

* { box-sizing: border-box; }

html, body { margin: 0; height: 100%; }

body {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) var(--footer-h);
  height: 100vh;
  font: 14px/1.4 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
  color: var(--text);
  background: var(--bg);
}

button { font: inherit; cursor: pointer; }

/* ---------- top bar ---------- */

#topbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
  padding: 6px 12px;
  background: var(--brand);
  color: #fff;
}
.brand { font-weight: 700; letter-spacing: 0.06em; }
.ctl { display: inline-flex; align-items: center; gap: 6px; }
.ctl select { font: inherit; padding: 2px 4px; }
.spacer { flex: 1; }
.version { font-size: 11px; opacity: 0.7; }

.btn {
  border: 1px solid #b8c2cc;
  background: #fff;
  color: var(--text);
  border-radius: 4px;
  padding: 3px 10px;
}
.btn:hover { background: #eef2f6; }
.btn.primary { background: var(--sel); border-color: var(--sel); color: #fff; font-weight: 600; }
.btn.primary:hover { background: #1d4fd8; }
.btn.small { padding: 0 6px; font-size: 12px; }
#btn-new.armed { background: #fee2e2; border-color: var(--mnm); color: var(--mnm); font-weight: 600; }

/* ---------- columns ---------- */

#cols {
  display: grid;
  grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 0.95fr);
  min-height: 0;
}
.col {
  overflow-y: auto;
  padding: 6px 12px 24px;
  background: var(--panel);
  border-right: 1px solid var(--line);
}
.col:last-child { border-right: 0; background: #fbfcfd; }

h2 {
  font-size: 15px;
  margin: 10px 0 4px;
  color: var(--brand);
  border-bottom: 2px solid var(--brand);
  padding-bottom: 2px;
}
h2 .seg { float: right; display: inline-flex; font-size: 11px; font-weight: 400; }
.seg button {
  border: 1px solid #b8c2cc;
  background: #fff;
  color: var(--text);
  padding: 0 7px;
  line-height: 1.6;
}
.seg button:first-child { border-radius: 4px 0 0 4px; }
.seg button:last-child { border-radius: 0 4px 4px 0; border-left: 0; }
.seg button.on { background: var(--brand); border-color: var(--brand); color: #fff; }
h2 .sub { font-size: 11px; font-weight: 400; color: var(--muted); }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 10px 0 2px; }

.hint { font-size: 11px; color: var(--muted); margin: 2px 0 4px; }

/* ---------- items & chips ---------- */

.item { padding: 3px 0 5px; border-bottom: 1px dotted #e3e7ec; }
.item-head { display: flex; align-items: baseline; gap: 6px; }
.item-label { font-weight: 600; font-size: 13px; }
.item.answered .item-label { color: var(--sel); }
.item-kind { font-size: 10px; color: var(--muted); border: 1px solid #d0d6dd; border-radius: 3px; padding: 0 3px; }
.item-clear {
  margin-left: auto;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 11px;
  padding: 0 2px;
  visibility: hidden;
}
.item.answered .item-clear { visibility: visible; }
.item-clear:hover { color: var(--mnm); text-decoration: underline; }

.ask { display: none; margin: 1px 0 3px; padding-left: 16px; font-size: 12px; font-style: italic; color: #36557a; }
.show-ask .ask { display: block; }

.chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
.chip {
  border: 1px solid #c3ccd6;
  background: #fff;
  color: var(--text);
  border-radius: 12px;
  padding: 1px 9px;
  font-size: 12.5px;
  line-height: 1.5;
}
.chip:hover { border-color: var(--sel); }
.chip.rf::after { content: "!"; color: var(--mnm); font-weight: 700; margin-left: 3px; }
.chip.on { background: var(--sel); border-color: var(--sel); color: #fff; }
.chip.on.rf::after { color: #ffd6d6; }
.chip.present { background: var(--present-bg); border-color: var(--present); color: var(--present); font-weight: 600; }
.chip.present::before { content: "+ "; }
.chip.absent { background: var(--absent-bg); border-color: var(--absent); color: var(--absent); text-decoration: line-through; }
.chip.absent::before { content: "\2212  "; display: inline-block; text-decoration: none; }
.chips.single .chip { border-radius: 4px; }

/* ---------- suggestion lists ---------- */

.suggest { margin: 2px 0 8px; padding-left: 16px; font-size: 12.5px; }
.suggest li { margin: 1px 0; }
.s-note { color: var(--muted); font-size: 11.5px; }
.s-note::before { content: " — "; }

/* ---------- differential ---------- */

.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.lg.hit { background: var(--hit-bg); padding: 0 4px; border-radius: 3px; }

.group { margin-bottom: 4px; }
.group h3 { margin-top: 8px; }
.group.promoted h3 { color: var(--sel); }
.group.promoted h3::after { content: "  \2190 location"; font-size: 10px; text-transform: none; letter-spacing: 0; }
.group ul { list-style: none; margin: 0; padding: 0; }

.dx {
  display: flex;
  align-items: center;
  width: 100%;
  gap: 6px;
  text-align: left;
  border: 1px solid transparent;
  border-left: 3px solid transparent;
  background: none;
  padding: 2px 6px;
  border-radius: 3px;
  color: var(--text);
}
.dx:hover { background: #eef2f6; }
.dx-groups { display: block; font-size: 10.5px; font-weight: 400; color: var(--muted); }
.dx.hit { background: var(--hit-bg); border-left-color: var(--hit-line); }
.dx.open { border-color: var(--sel); border-left-color: var(--sel); }
.dx-name { flex: 1; }
.dx-meta { display: inline-flex; align-items: center; gap: 2px; }

.tc {
  display: inline-block;
  min-width: 15px;
  text-align: center;
  font-size: 10px;
  font-weight: 600;
  color: var(--none);
  border: 1px solid #cfd5dc;
  border-radius: 3px;
  padding: 0 2px;
  margin-left: 1px;
}
.tc.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.count {
  display: inline-block;
  min-width: 18px;
  text-align: center;
  background: var(--hit-line);
  color: #fff;
  border-radius: 9px;
  font-size: 11px;
  padding: 0 4px;
  margin-left: 3px;
}

/* ---------- disease card ---------- */

#card {
  position: fixed;
  top: var(--top-h, 40px);
  right: 0;
  bottom: var(--footer-h);
  width: min(480px, 40vw);
  min-width: 340px;
  overflow-y: auto;
  background: #fff;
  border-left: 3px solid var(--sel);
  box-shadow: -6px 0 18px rgba(0, 0, 0, 0.18);
  padding: 8px 14px 24px;
  z-index: 10;
}
#card[hidden] { display: none; }
.card-head { display: flex; align-items: flex-start; gap: 8px; }
.card-head h2 { flex: 1; border: 0; margin: 4px 0; font-size: 17px; }
.card-close { border: 0; background: none; font-size: 22px; line-height: 1; color: var(--muted); padding: 0 4px; }
.card-close:hover { color: var(--text); }
.card-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
.badge { font-size: 11px; border-radius: 3px; padding: 0 5px; border: 1px solid #cfd5dc; color: var(--muted); }
.badge.mnm { background: #e9edf2; border-color: #9aa5b1; color: var(--text); }
.badge.status-draft { background: #f1f3f5; }
.badge.status-reviewed { background: var(--match-bg); color: var(--match); border-color: var(--match); }
.badge.tcb.match { background: var(--match-bg); color: var(--match); border-color: var(--match); }
.badge.tcb.different { background: var(--diff-bg); color: var(--diff); border-color: var(--diff); }
.one-liner { margin: 4px 0 6px; font-size: 13.5px; }
#card h3 { margin-top: 12px; border-bottom: 1px solid var(--line); }

.legend-feats { display: flex; gap: 10px; font-size: 11px; margin: 0; }
.feats, .plain { margin: 3px 0; padding: 0; list-style: none; font-size: 13px; }
.plain { padding-left: 16px; list-style: disc; }
.plain li { margin: 2px 0; }
.feat { display: flex; gap: 6px; padding: 2px 4px; border-radius: 3px; margin: 1px 0; color: var(--none); }
.feat .ic { width: 14px; flex: none; text-align: center; font-weight: 700; }
.feat.match { background: var(--match-bg); color: var(--match); }
.feat.different { background: var(--diff-bg); color: var(--diff); }
.legend-feats .feat { padding: 0 4px; }
.selected-now { display: block; font-size: 11px; opacity: 0.9; }
.muted { color: var(--muted); }

/* ---------- output ---------- */

#output {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto;
  gap: 8px;
  padding: 6px 12px;
  background: #e9edf2;
  border-top: 1px solid #c3ccd6;
  min-height: 0;
}
.out-box { display: flex; flex-direction: column; min-height: 0; }
.out-head { font-size: 12px; font-weight: 700; color: var(--brand); display: flex; gap: 8px; align-items: center; margin-bottom: 2px; }
.out-text {
  flex: 1;
  overflow-y: auto;
  background: #fff;
  border: 1px solid #c3ccd6;
  border-radius: 3px;
  padding: 4px 8px;
  font-size: 13px;
  white-space: pre-wrap;
  user-select: text;
}
.out-text.placeholder::before { content: "Selections will appear here."; color: var(--muted); font-style: italic; }
.out-actions { display: flex; flex-direction: column; gap: 6px; justify-content: center; align-items: stretch; min-width: 140px; }
#copy-status { font-size: 12px; text-align: center; min-height: 1.4em; }
#copy-status.ok { color: var(--present); }
#copy-status.fail { color: var(--mnm); }

/* ---------- quick history page (dist/POMD-history.html) ---------- */

body.quick { --footer-h: 52px; }
.brand-sub { font-weight: 400; letter-spacing: 0; opacity: 0.8; }
.quick #cols { grid-template-columns: minmax(0, 1fr); }
.quick .col { border-right: 0; }
.quick-wrap { max-width: 900px; margin: 0 auto; }
/* hint | Submit (centered) | empty */
.quick #output { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; }
.quick #btn-submit { padding: 6px 18px; }
.quick-add { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.quick-add select { font: inherit; padding: 2px 4px; }
.item-edit { display: none; gap: 3px; }
.edit-only, .edit-hint { display: none; }
.editing .item-edit { display: inline-flex; }
.editing .edit-only { display: inline-block; }
.editing .edit-hint { display: block; }
.editing .item { background: #f7f9fb; }
.item-edit .btn:disabled { opacity: 0.35; cursor: default; }
.drag-handle { display: none; cursor: grab; color: var(--muted); padding: 0 2px; user-select: none; }
.editing .drag-handle { display: inline; }
.item.dragging { opacity: 0.4; }
.item.drop-before { box-shadow: inset 0 3px 0 var(--sel); }
.item.drop-after { box-shadow: inset 0 -3px 0 var(--sel); }

/* ---------- narrow screens (phone fallback) ---------- */

@media (max-width: 900px) {
  body { display: block; height: auto; }
  #cols { display: block; }
  .col { overflow: visible; border-right: 0; border-bottom: 1px solid var(--line); }
  #output { grid-template-columns: 1fr; position: sticky; bottom: 0; max-height: 45vh; overflow-y: auto; }
  .out-text { max-height: 18vh; }
  .chip { padding: 3px 10px; font-size: 13.5px; }
  #card { top: 0; bottom: 0; width: 100%; min-width: 0; z-index: 20; }
}

</style>
</head>
<body>
<header id="topbar">
  <span class="brand">POMD</span>
  <label class="ctl">Chief complaint
    <select id="complaint-select"></select>
  </label>
  <label class="ctl toggle"><input type="checkbox" id="toggle-ask"> Show English phrasing</label>
  <button type="button" id="btn-new" class="btn">New patient</button>
  <span class="spacer"></span>
  <span class="version">v0.4.0 · built 2026-11-18</span>
</header>

<main id="cols">
  <section class="col" id="col-history">
    <h2>History</h2>
    <p class="hint">Click to select · click again to clear · <span class="hint-presence">symptoms: 1× present, 2× absent, 3× clear</span></p>
    <div id="history"></div>
  </section>
  <section class="col" id="col-pe">
    <h2>Physical exam</h2>
    <div id="pe"></div>
    <h2>Labs <span class="sub">suggested</span></h2>
    <ul id="labs" class="suggest"></ul>
    <h2>Imaging / Endoscopy <span class="sub">suggested</span></h2>
    <ul id="imaging" class="suggest"></ul>
  </section>
  <section class="col" id="col-ddx">
    <h2>Differential
      <span class="seg" role="group" aria-label="Sort differential">
        <button type="button" data-sort="location" class="on">By location</button><button type="button" data-sort="matches">By matches</button>
      </span>
    </h2>
    <p class="hint legend">
      <span class="lg hit">highlighted = typical feature selected <b class="count">n</b></span>
      <span class="lg">time course <span class="tc">A</span><span class="tc">S</span><span class="tc">C</span></span>
    </p>
    <div id="ddx"></div>
  </section>
</main>

<footer id="output">
  <div class="out-box">
    <div class="out-head">HPI <button type="button" class="btn small" data-copy="hpi">Copy HPI</button></div>
    <div id="out-hpi" class="out-text"></div>
  </div>
  <div class="out-box">
    <div class="out-head">PE <button type="button" class="btn small" data-copy="pe">Copy PE</button></div>
    <div id="out-pe" class="out-text"></div>
  </div>
  <div class="out-actions">
    <button type="button" class="btn primary" data-copy="all">Copy HPI + PE</button>
    <span id="copy-status" role="status"></span>
  </div>
</footer>

<aside id="card" hidden aria-label="Disease card"></aside>

uggests perforation"},{"item":"episodes","options":["first"],"text":"First episode"}],"pe":[{"item":"tenderness","options":["rlq"],"text":"RLQ tenderness"},{"item":"abd_signs","options":["mcburney"],"state":"present","text":"McBurney's point tenderness"},{"item":"abd_signs","options":["rovsing"],"state":"present","text":"Rovsing's sign"},{"item":"abd_signs","options":["psoas","obturator"],"state":"present","text":"Psoas sign (retrocecal) or obturator sign (pelvic appendix)"},{"item":"rebound","options":["present"],"text":"Rebound tenderness"},{"item":"guarding","options":["voluntary","involuntary"],"text":"Guarding in the RLQ"},{"item":"vitals","options":["fever"],"state":"present","text":"Low-grade fever"}],"labs":["Leukocytosis with neutrophilia; CRP rises after 12–24 h","Normal WBC and CRP together make appendicitis much less likely but do not exclude it","Urinalysis may show a few WBC / RBC from bladder or ureter irritation","hCG in every woman of reproductive age"],"imaging":["CT abdomen / pelvis with IV contrast in most adults","Ultrasound first in children, pregnant women, and young women; MRI in pregnancy if ultrasound is non-diagnostic"],"pitfalls":["Retrocecal appendix causes flank or back pain with little anterior tenderness; pelvic appendix causes suprapubic pain, diarrhea, or urinary symptoms.","Elderly and immunocompromised patients present late and atypically, with high perforation rates.","In pregnancy the pain may sit higher in the right flank or RUQ.","A sudden improvement in pain may mean perforation, not resolution.","In young women consider ectopic pregnancy, ovarian torsion, and PID; scores such as Alvarado or AIR help stratify but do not replace reassessment."]},"acute_cholangitis":{"id":"acute_cholangitis","name":"Acute cholangitis","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Fever with rigors, jaundice and RUQ pain (Charcot triad) from infection above an obstructed bile duct, usually a stone; hypotension and confusion signal severe disease needing urgent drainage.","symptoms":[{"item":"assoc_sys","options":["fever","chills"],"state":"present","text":"Fever, often with rigors"},{"item":"assoc_sys","options":["jaundice"],"state":"present","text":"Jaundice"},{"item":"pain_location","options":["ruq","epigastric"],"text":"RUQ or epigastric pain"},{"item":"assoc_sys","options":["dark_urine","pale_stool"],"state":"present","text":"Dark urine, pale stools"},{"item":"assoc_other","options":["confusion"],"state":"present","text":"Confusion (Reynolds pentad — severe)"},{"item":"duration","options":["lt6h","h6_24","d1_3"],"text":"Acute presentation over hours to days"},{"item":"risk","options":["gallstones","biliary_procedure"],"state":"present","text":"Gallstones, biliary stent, prior ERCP or biliary surgery"}],"pe":[{"item":"vitals","options":["fever"],"state":"present","text":"Fever"},{"item":"skin","options":["icterus"],"state":"present","text":"Scleral icterus"},{"item":"tenderness","options":["ruq"],"text":"RUQ tenderness"},{"item":"vitals","options":["tachycardia"],"state":"present","text":"Tachycardia"},{"item":"vitals","options":["hypotension"],"state":"present","text":"Hypotension (severe / septic)"},{"item":"general","options":["confused","ill"],"text":"Ill-appearing or confused"}],"labs":["Leukocytosis (or leukopenia), raised CRP","Cholestatic liver tests (bilirubin, ALP, GGT)","Blood cultures before antibiotics; lactate, creatinine, platelets, INR for severity grading"],"imaging":["RUQ ultrasound — duct dilatation, stones","CT if the cause is unclear (tumor, stent occlusion); MRCP when stable","ERCP (or percutaneous drainage) — timing by severity"],"pitfalls":["The full Charcot triad is present in only about half of patients; the elderly may present with confusion or hypotension alone.","Do not wait for imaging to start antibiotics and fluids.","Blocked biliary stents cause cholangitis without stones.","Grade severity (e.g. Tokyo Guidelines) — organ dysfunction means urgent drainage."]},"acute_cholecystitis":{"id":"acute_cholecystitis","name":"Acute cholecystitis","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Constant RUQ pain lasting more than several hours with fever, RUQ tenderness and a positive Murphy's sign, usually from persistent cystic duct obstruction by a gallstone.","symptoms":[{"item":"pain_location","options":["ruq","epigastric"],"text":"RUQ (sometimes epigastric) pain"},{"item":"pain_pattern","options":["constant"],"text":"Constant pain, unlike the self-limited attacks of biliary colic"},{"item":"duration","options":["h6_24","d1_3","d4_7"],"text":"Lasting more than ~6 hours, typically 1 day or longer at presentation"},{"item":"radiation","options":["r_shoulder"],"text":"May radiate to the right shoulder or scapula"},{"item":"aggravating","options":["deep_breath","movement"],"text":"Worse with deep breathing or movement"},{"item":"assoc_sys","options":["fever"],"state":"present","text":"Fever"},{"item":"assoc_gi","options":["nausea","vomiting"],"state":"present","text":"Nausea and vomiting"},{"item":"assoc_gi","options":["anorexia"],"state":"present","text":"Anorexia"},{"item":"episodes","options":["recurrent"],"text":"Often preceded by episodes of biliary colic"},{"item":"risk","options":["gallstones"],"state":"present","text":"Known gallstones"}],"pe":[{"item":"vitals","options":["fever"],"state":"present","text":"Fever (may be absent in the elderly)"},{"item":"vitals","options":["tachycardia"],"state":"present","text":"Tachycardia"},{"item":"tenderness","options":["ruq"],"text":"RUQ tenderness"},{"item":"abd_signs","options":["murphy"],"state":"present","text":"Positive Murphy's sign"},{"item":"guarding","options":["voluntary","involuntary"],"text":"Guarding in the RUQ"},{"item":"palpable","options":["gallbladder"],"state":"present","text":"Palpable, tender gallbladder in some patients"},{"item":"skin","options":["icterus"],"state":"absent","text":"Usually anicteric; marked jaundice suggests a CBD stone, Mirizzi syndrome, or cholangitis"}],"labs":["Leukocytosis and raised CRP","Mild rises in bilirubin, ALP, or transaminases are common","Bilirubin > ~4 mg/dL or a high ALP / GGT → look for a CBD stone"],"imaging":["RUQ ultrasound — stones, wall thickening > 4 mm, pericholecystic fluid, sonographic Murphy's sign","Cholescintigraphy (HIDA) if ultrasound is equivocal","CT for suspected complications (gangrene, emphysematous cholecystitis, perforation, abscess)"],"pitfalls":["Elderly and diabetic patients may have little fever, minimal tenderness, and a negative Murphy's sign.","Acalculous cholecystitis occurs in critically ill, post-operative, or prolonged-fasting patients.","Fever with jaundice and hypotension or confusion is cholangitis, not simple cholecystitis.","Right lower lobe pneumonia and inferior MI can mimic RUQ pain.","Grade severity (e.g. Tokyo Guidelines) to decide on early cholecystectomy vs drainage."]},"acute_coronary_syndrome":{"id":"acute_coronary_syndrome","name":"Acute coronary syndrome","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Epigastric pain or pressure, sometimes the only symptom of myocardial ischemia (especially inferior MI), in an older, diabetic, or atherosclerotic patient — with exertional trigger, diaphoresis, dyspnea, or radiation to chest, arm, or jaw.","symptoms":[{"item":"pain_location","options":["epigastric"],"text":"Epigastric pain or \"indigestion\""},{"item":"pain_quality","options":["pressure","dull","burning"],"text":"Pressure, heaviness, or burning"},{"item":"precipitant","options":["exertion"],"text":"Triggered by exertion or emotional stress"},{"item":"radiation","options":["chest_arm_jaw"],"text":"Radiates to the chest, arm, neck, or jaw"},{"item":"assoc_other","options":["chest_pain","dyspnea"],"state":"present","text":"Chest discomfort or dyspnea"},{"item":"assoc_other","options":["diaphoresis"],"state":"present","text":"Diaphoresis"},{"item":"assoc_gi","options":["nausea","vomiting"],"state":"present","text":"Nausea and vomiting (common with inferior MI)"},{"item":"risk","options":["atherosclerosis","diabetes","smoking"],"state":"present","text":"Coronary risk factors — known vascular disease, diabetes, smoking"},{"item":"age_group","options":["age_40_59","age_60_plus"],"text":"Older age"}],"pe":[{"item":"general","options":["pale_diaphoretic"],"text":"Pale, diaphoretic"},{"item":"tenderness","options":["none"],"text":"Abdomen non-tender — pain without tenderness"},{"item":"guarding","options":["soft"],"text":"Soft abdomen"},{"item":"vitals","options":["tachycardia","hypotension"],"state":"present","text":"Tachycardia, bradycardia (inferior MI), or hypotension"}],"labs":["High-sensitivity troponin at presentation and repeated per protocol","Electrolytes, glucose; lipase and liver tests to look for an abdominal mimic"],"imaging":["12-lead ECG within 10 minutes; repeat if symptoms persist (include right-sided leads for inferior MI)","Chest X-ray; echocardiography as indicated"],"pitfalls":["Women, diabetics, and the elderly often present without chest pain.","A \"GI cocktail\" response does not exclude cardiac ischemia.","Epigastric pain with normal abdominal exam in a patient with risk factors — get an ECG before calling it gastritis.","Aortic dissection can also present with epigastric or back pain; check pulses and blood pressure in both arms."]},"acute_gastroenteritis":{"id":"acute_gastroenteritis","name":"Acute gastroenteritis","must_not_miss":false,"timecourse":["acute"],"status":"draft","one_liner":"Diffuse crampy abdominal pain with vomiting and watery diarrhea of short duration, often with sick contacts or a suspicious meal; the abdomen is soft without localized peritonism.","symptoms":[{"item":"pain_location","options":["diffuse","periumbilical"],"text":"Diffuse or periumbilical crampy pain"},{"item":"pain_quality","options":["cramping","colicky"],"text":"Crampy"},{"item":"pain_pattern","options":["waves"],"text":"Comes in waves, often before bowel movements"},{"item":"assoc_gi","options":["diarrhea"],"state":"present","text":"Watery diarrhea"},{"item":"assoc_gi","options":["vomiting","nausea"],"state":"present","text":"Vomiting and nausea"},{"item":"assoc_sys","options":["fever"],"state":"present","text":"Low-grade fever"},{"item":"relieving","options":["defecation"],"text":"Briefly relieved by passing stool"},{"item":"duration","options":["lt6h","h6_24","d1_3"],"text":"Short history — hours to a few days"},{"item":"risk","options":["sick_contacts","travel"],"state":"present","text":"Sick contacts, suspicious food, travel"}],"pe":[{"item":"guarding","options":["soft"],"text":"Soft abdomen"},{"item":"tenderness","options":["diffuse","none","periumbilical"],"text":"Mild diffuse tenderness or none"},{"item":"bowel_sounds","options":["hyper"],"text":"Hyperactive bowel sounds"},{"item":"general","options":["dehydrated"],"text":"Dry mucous membranes if dehydrated"},{"item":"rebound","options":["absent"],"text":"No rebound tenderness"}],"labs":["Often none needed; electrolytes and creatinine if dehydrated","Stool studies for bloody diarrhea, high fever, severe illness, immunocompromise, recent antibiotics (C. difficile), or prolonged symptoms"],"imaging":["Not routinely needed — image if there are focal signs or peritonism"],"pitfalls":["Vomiting without diarrhea is not gastroenteritis until proven otherwise (obstruction, appendicitis, DKA, MI, raised intracranial pressure).","Early appendicitis, especially pelvic, can cause diarrhea.","Severe pain with minimal diarrhea in an older patient — think mesenteric ischemia.","Recheck if pain becomes localized or persists beyond 48–72 h."]},"acute_hepatitis":{"id":"acute_hepatitis","name":"Acute hepatitis","must_not_miss":false,"timecourse":["acute","subacute"],"status":"draft","one_liner":"Dull RUQ ache with malaise, anorexia and nausea, followed by dark urine and jaundice, with tender hepatomegaly and markedly raised transaminases — viral, drug / herbal, alcoholic, or a flare of chronic hepatitis B.","symptoms":[{"item":"pain_location","options":["ruq","epigastric"],"text":"Dull RUQ discomfort"},{"item":"pain_quality","options":["dull"],"text":"Dull, aching quality"},{"item":"onset","options":["gradual","hours"],"text":"Gradual onset after a prodrome"},{"item":"assoc_sys","options":["malaise"],"state":"present","text":"Malaise and fatigue"},{"item":"assoc_gi","options":["anorexia","nausea"],"state":"present","text":"Anorexia and nausea"},{"item":"assoc_sys","options":["jaundice","dark_urine"],"state":"present","text":"Jaundice and dark urine"},{"item":"assoc_sys","options":["fever"],"state":"present","text":"Low-grade fever in the prodrome"},{"item":"risk","options":["alcohol","liver_disease","new_meds","travel"],"state":"present","text":"Alcohol, known HBV / HCV, new drug or herbal supplement, travel"}],"pe":[{"item":"skin","options":["icterus"],"state":"present","text":"Scleral icterus"},{"item":"palpable","options":["hepatomegaly","liver_tender"],"state":"present","text":"Tender hepatomegaly / pain on fist percussion"},{"item":"tenderness","options":["ruq"],"text":"RUQ tenderness"},{"item":"general","options":["confused"],"text":"Confusion signals acute liver failure"}],"labs":["AST/ALT often > 10× ULN in viral, drug, or ischemic hepatitis; AST:ALT > 2 with AST < 300 suggests alcohol","Bilirubin and INR (INR ≥ 1.5 = severe; with encephalopathy = acute liver failure)","IgM anti-HAV, HBsAg + IgM anti-HBc, HBV DNA, anti-HCV / HCV RNA, IgM anti-HEV","Acetaminophen level when relevant; autoimmune markers if no other cause"],"imaging":["Ultrasound — exclude biliary obstruction, assess liver and hepatic veins"],"pitfalls":["In chronic HBV carriers, a flare (e.g. after stopping antivirals or during chemotherapy / immunosuppression) can be severe.","Ask specifically about herbal products, supplements, and recently started drugs.","Rising INR or new confusion means acute liver failure — refer urgently.","Biliary obstruction from a passing stone can briefly produce very high transaminases."]},"acute_mesenteric_ischemia":{"id":"acute_mesenteric_ischemia","name":"Acute mesenteric ischemia","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Sudden, severe periumbilical or diffuse pain out of proportion to a soft, minimally tender abdomen in an older patient with atrial fibrillation or atherosclerotic disease; peritonitis and bloody stool appear late.","symptoms":[{"item":"onset","options":["sudden"],"text":"Sudden onset (embolic); thrombotic and venous forms may develop over hours to days"},{"item":"pain_location","options":["periumbilical","diffuse"],"text":"Periumbilical or diffuse, poorly localized pain"},{"item":"severity","options":["s8","s9","s10"],"text":"Severe pain"},{"item":"age_group","options":["age_60_plus"],"text":"Usually over 60"},{"item":"risk","options":["af","atherosclerosis","hypercoagulable"],"state":"present","text":"Atrial fibrillation, atherosclerotic disease, or a hypercoagulable state"},{"item":"assoc_gi","options":["vomiting","diarrhea"],"state":"present","text":"Vomiting and urge to defecate / diarrhea early"},{"item":"assoc_gi","options":["hematochezia","bloody_diarrhea"],"state":"present","text":"Bloody stool is a late sign of mucosal infarction"},{"item":"assoc_other","options":["food_fear"],"state":"present","text":"Prior postprandial pain and fear of eating (chronic mesenteric ischemia preceding thrombosis)"},{"item":"assoc_sys","options":["weight_loss"],"state":"present","text":"Weight loss from food avoidance (chronic mesenteric ischemia)"}],"pe":[{"item":"abd_signs","options":["out_of_proportion"],"state":"present","text":"Pain out of proportion to the examination — the hallmark early finding"},{"item":"guarding","options":["soft"],"text":"Abdomen soft early on"},{"item":"tenderness","options":["none","periumbilical","diffuse"],"text":"Minimal or diffuse mild tenderness early"},{"item":"chest","options":["irregular"],"state":"present","text":"Irregularly irregular rhythm (atrial fibrillation)"},{"item":"vitals","options":["tachycardia"],"state":"present","text":"Tachycardia"},{"item":"rebound","options":["present"],"text":"Rebound and rigidity appear only after transmural infarction (late)"},{"item":"rectal","options":["fresh_blood"],"text":"Blood on rectal exam (late)"}],"labs":["Leukocytosis, metabolic acidosis, raised lactate — but all may be normal early","D-dimer is sensitive but non-specific","Amylase / lipase and LDH may be mildly elevated"],"imaging":["CT angiography (arterial and portal venous phase) immediately when suspected — do not wait for lactate","Plain films are often normal early; \"thumbprinting\" or pneumatosis are late findings"],"pitfalls":["A benign abdominal exam early on is the classic trap; the pain is real.","A normal lactate does not exclude ischemia; by the time lactate rises, bowel is often necrotic.","Non-occlusive mesenteric ischemia occurs in shock, heart failure, dialysis, vasopressor or digoxin use.","Mesenteric venous thrombosis is more gradual and affects younger patients with hypercoagulable states, cirrhosis, or malignancy.","Older patient with AF and severe abdominal pain → CT angiography first, not \"observe and recheck\"."]},"acute_pancreatitis":{"id":"acute_pancreatitis","name":"Acute pancreatitis","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Acute, constant, severe epigastric pain radiating to the back with nausea and vomiting, typically after gallstone passage or heavy drinking; diagnosis requires two of pain, lipase ≥3× ULN, and imaging findings.","symptoms":[{"item":"pain_location","options":["epigastric","luq","ruq"],"text":"Epigastric pain, sometimes LUQ or band-like across the upper abdomen"},{"item":"onset","options":["sudden","hours"],"text":"Onset over minutes to hours"},{"item":"pain_pattern","options":["constant"],"text":"Constant, boring pain"},{"item":"severity","options":["s7","s8","s9","s10"],"text":"Usually severe"},{"item":"radiation","options":["back"],"text":"Radiates straight through to the back"},{"item":"relieving","options":["leaning_forward"],"text":"Eased by sitting up and leaning forward"},{"item":"aggravating","options":["lying_flat"],"text":"Worse lying supine"},{"item":"meal_relation","options":["worse_eating"],"text":"Worse after eating"},{"item":"precipitant","options":["alcohol","fatty_meal"],"text":"After an alcohol binge or a heavy meal"},{"item":"assoc_gi","options":["nausea","vomiting"],"state":"present","text":"Nausea and vomiting are prominent"},{"item":"risk","options":["gallstones","alcohol","hypertriglyceridemia"],"state":"present","text":"Gallstones, heavy alcohol use, or hypertriglyceridemia"}],"pe":[{"item":"tenderness","options":["epigastric"],"text":"Epigastric tenderness, often with less rigidity than the pain would suggest"},{"item":"guarding","options":["voluntary","soft"],"text":"Voluntary guarding; true board-like rigidity is unusual"},{"item":"vitals","options":["tachycardia"],"state":"present","text":"Tachycardia"},{"item":"vitals","options":["fever"],"state":"present","text":"Low-grade fever"},{"item":"bowel_sounds","options":["hypo"],"text":"Hypoactive bowel sounds (ileus)"},{"item":"abd_contour","options":["mild"],"text":"Mild distension"},{"item":"skin","options":["icterus"],"state":"present","text":"Icterus suggests a biliary cause or CBD obstruction"},{"item":"skin","options":["ecchymosis"],"state":"present","text":"Grey Turner / Cullen sign — uncommon and late, indicates severe disease"}],"labs":["Lipase ≥ 3× ULN (more specific than amylase); the level does not reflect severity","ALT > 3× ULN early suggests a gallstone cause","Triglycerides and calcium to identify the cause","BUN, hematocrit, creatinine, and CRP to assess severity; rising BUN in the first 24–48 h is a bad sign"],"imaging":["Abdominal ultrasound in every patient to look for gallstones","Contrast CT only if the diagnosis is uncertain or the patient fails to improve after 48–72 h","MRCP or EUS for persistent bile duct stone suspicion or recurrent \"idiopathic\" pancreatitis"],"pitfalls":["Early CT underestimates necrosis; do not image routinely on day 1 if the diagnosis is clear.","A raised lipase also occurs with perforated ulcer, mesenteric ischemia, bowel obstruction, and renal failure.","Amylase can be falsely normal in hypertriglyceridemia-induced pancreatitis.","Unexplained pancreatitis in a patient over 40–50 should prompt a search for a pancreatic tumor.","Watch for organ failure (persistent > 48 h defines severe disease); aggressive early fluid support, avoid overload."]},"acute_pyelonephritis":{"id":"acute_pyelonephritis","name":"Acute pyelonephritis","must_not_miss":false,"timecourse":["acute"],"status":"draft","one_liner":"Fever, chills and flank pain with CVA tenderness, often preceded by dysuria and frequency, with nausea and vomiting; mostly young women.","symptoms":[{"item":"pain_location","options":["flank_r","flank_l"],"text":"Flank pain"},{"item":"pain_quality","options":["dull"],"text":"Dull, constant ache"},{"item":"assoc_sys","options":["fever","chills"],"state":"present","text":"Fever and chills"},{"item":"assoc_gu","options":["dysuria","frequency"],"state":"present","text":"Dysuria and frequency"},{"item":"assoc_gi","options":["nausea","vomiting"],"state":"present","text":"Nausea and vomiting"},{"item":"duration","options":["h6_24","d1_3","d4_7"],"text":"Over 1–3 days"},{"item":"sex","options":["female"],"text":"More common in women"}],"pe":[{"item":"vitals","options":["fever"],"state":"present","text":"Fever"},{"item":"cva_tenderness","options":["right","left"],"text":"CVA tenderness"},{"item":"vitals","options":["tachycardia","hypotension"],"state":"present","text":"Tachycardia; hypotension if urosepsis"},{"item":"guarding","options":["soft"],"text":"Abdomen soft"}],"labs":["Urinalysis and urine culture (before antibiotics)","CBC, CRP, creatinine; blood cultures if septic"],"imaging":["Ultrasound or CT if no improvement after 48–72 h, sepsis, suspected obstruction or abscess","Imaging early in men, diabetics, and recurrent cases"],"pitfalls":["Obstruction with infection needs urgent drainage.","Emphysematous pyelonephritis in poorly controlled diabetes — CT.","Pregnant women need admission and close monitoring."]},"acute_urinary_retention":{"id":"acute_urinary_retention","name":"Acute urinary retention","must_not_miss":false,"timecourse":["acute"],"status":"draft","one_liner":"Painful inability to void with suprapubic fullness and a palpable bladder, usually in an older man with BPH, often precipitated by anticholinergic or opioid drugs, constipation, or infection.","symptoms":[{"item":"assoc_gu","options":["cannot_void"],"state":"present","text":"Unable to pass urine"},{"item":"pain_location","options":["suprapubic"],"text":"Suprapubic pain and fullness"},{"item":"sex","options":["male"],"text":"Mostly men"},{"item":"age_group","options":["age_60_plus"],"text":"Older age"},{"item":"risk","options":["bph","retention_drugs"],"state":"present","text":"BPH; anticholinergics, opioids, decongestants"},{"item":"assoc_gi","options":["constipation"],"state":"present","text":"Constipation (precipitant)"},{"item":"onset","options":["hours","sudden"],"text":"Develops over hours"}],"pe":[{"item":"palpable","options":["bladder"],"state":"present","text":"Distended, palpable bladder, dull to percussion"},{"item":"tenderness","options":["suprapubic"],"text":"Suprapubic tenderness"},{"item":"rectal","options":["hard_stool","normal"],"text":"Rectal exam — prostate size, fecal impaction"},{"item":"general","options":["restless"],"text":"Restless and uncomfortable"}],"labs":["Creatinine and electrolytes; urinalysis and culture"],"imaging":["Bladder scan / ultrasound — post-void residual","Catheterization is diagnostic and therapeutic"],"pitfalls":["Painless retention may present with overflow incontinence.","Consider spinal cord compression or cauda equina when there are neurologic symptoms.","Check renal function — chronic retention can cause obstructive uropathy."]},"biliary_colic":{"id":"biliary_colic","name":"Biliary colic","must_not_miss":false,"timecourse":["acute","chronic"],"status":"draft","one_liner":"Steady, intense RUQ or epigastric pain lasting 30 minutes to a few hours, often after a fatty meal or at night, from transient gallstone impaction in the cystic duct; the patient is well between attacks.","symptoms":[{"item":"pain_location","options":["ruq","epigastric"],"text":"RUQ or epigastric pain"},{"item":"pain_pattern","options":["attacks"],"text":"Discrete attacks lasting 30 min to a few hours, pain-free in between"},{"item":"pain_quality","options":["dull","pressure"],"text":"Steady, intense ache — not truly \"colicky\" despite the name"},{"item":"precipitant","options":["fatty_meal"],"text":"Often after a fatty or heavy meal, or at night"},{"item":"radiation","options":["r_shoulder","back"],"text":"May radiate to the right shoulder / scapula or to the back"},{"item":"assoc_gi","options":["nausea","vomiting"],"state":"present","text":"Nausea, sometimes vomiting"},{"item":"episodes","options":["recurrent"],"text":"Recurrent similar attacks"},{"item":"assoc_sys","options":["fever"],"state":"absent","text":"No fever"},{"item":"assoc_sys","options":["jaundice"],"state":"absent","text":"No jaundice"},{"item":"risk","options":["gallstones"],"state":"present","text":"Known gallstones"}],"pe":[{"item":"vitals","options":["fever"],"state":"absent","text":"Afebrile"},{"item":"tenderness","options":["ruq","epigastric"],"text":"Mild RUQ / epigastric tenderness during an attack; may be non-tender between attacks"},{"item":"abd_signs","options":["murphy"],"state":"absent","text":"Murphy's sign negative or equivocal"},{"item":"guarding","options":["soft"],"text":"Soft abdomen, no peritoneal signs"},{"item":"skin","options":["icterus"],"state":"absent","text":"Anicteric"}],"labs":["Usually normal — WBC, liver panel, and lipase within normal limits","A transient AST/ALT rise can follow passage of a small stone"],"imaging":["RUQ ultrasound — gallstones without wall thickening or pericholecystic fluid"],"pitfalls":["Pain persisting beyond about 6 hours, fever, or leukocytosis suggests acute cholecystitis rather than colic.","Jaundice, dark urine, or a cholestatic liver panel points to a common bile duct stone.","Gallstones are common and often incidental; bloating or vague postprandial discomfort alone is usually not biliary.","In older or diabetic patients with upper abdominal pain, exclude ACS before blaming the gallbladder."]},"choledocholithiasis":{"id":"choledocholithiasis","name":"Choledocholithiasis","must_not_miss":false,"timecourse":["acute","subacute"],"status":"draft","one_liner":"Biliary-type RUQ or epigastric pain with jaundice, dark urine and pale stools from a stone in the common bile duct; liver tests show a cholestatic pattern, often fluctuating as the stone moves.","symptoms":[{"item":"pain_location","options":["ruq","epigastric"],"text":"RUQ or epigastric pain (may be painless)"},{"item":"pain_pattern","options":["attacks","constant"],"text":"Biliary-type attacks, sometimes more persistent"},{"item":"assoc_sys","options":["jaundice"],"state":"present","text":"Jaundice, often fluctuating"},{"item":"assoc_sys","options":["dark_urine","pale_stool"],"state":"present","text":"Dark urine and pale stools"},{"item":"assoc_sys","options":["pruritus"],"state":"present","text":"Pruritus"},{"item":"assoc_gi","options":["nausea","vomiting"],"state":"present","text":"Nausea or vomiting"},{"item":"assoc_sys","options":["fever"],"state":"absent","text":"No fever (fever + jaundice = think cholangitis)"},{"item":"risk","options":["gallstones","biliary_procedure"],"state":"present","text":"Known gallstones or prior cholecystectomy / biliary procedure"}],"pe":[{"item":"skin","options":["icterus"],"state":"present","text":"Scleral icterus"},{"item":"tenderness","options":["ruq","epigastric"],"text":"Mild RUQ / epigastric tenderness"},{"item":"vitals","options":["fever"],"state":"absent","text":"Afebrile"},{"item":"abd_signs","options":["murphy"],"state":"absent","text":"Murphy's sign usually negative"}],"labs":["Raised bilirubin (direct), ALP and GGT; AST/ALT may spike early (even > 500) then fall quickly","Lipase to exclude associated gallstone pancreatitis"],"imaging":["RUQ ultrasound — dilated CBD (stone itself is often not seen)","MRCP or EUS when the probability is intermediate","ERCP for high probability (stone seen on imaging, cholangitis, or bilirubin > 4 mg/dL with a dilated duct)"],"pitfalls":["A normal ultrasound does not exclude CBD stones; ultrasound misses many distal stones.","Early in obstruction transaminases may dominate and mimic acute hepatitis.","Painless jaundice with weight loss suggests malignant obstruction (pancreatic head, cholangiocarcinoma), not a stone.","Stones can form or remain after cholecystectomy."]},"chronic_pancreatitis":{"id":"chronic_pancreatitis","name":"Chronic pancreatitis","must_not_miss":false,"timecourse":["chronic"],"status":"draft","one_liner":"Recurrent or constant epigastric pain radiating to the back, worse after meals, in a heavy drinker or smoker, eventually with weight loss, steatorrhea and diabetes.","symptoms":[{"item":"pain_location","options":["epigastric","luq"],"text":"Epigastric (or LUQ) pain"},{"item":"radiation","options":["back"],"text":"Radiates to the back"},{"item":"meal_relation","options":["worse_eating"],"text":"Worse after meals"},{"item":"relieving","options":["leaning_forward"],"text":"Eased by leaning forward"},{"item":"episodes","options":["recurrent"],"text":"Recurrent attacks or continuous pain"},{"item":"duration","options":["m1_3","gt3m"],"text":"Chronic course"},{"item":"assoc_gi","options":["steatorrhea"],"state":"present","text":"Steatorrhea (late — exocrine insufficiency)"},{"item":"assoc_sys","options":["weight_loss"],"state":"present","text":"Weight loss"},{"item":"assoc_other","options":["food_fear"],"state":"present","text":"Avoids eating because of pain"},{"item":"risk","options":["alcohol","smoking","diabetes"],"state":"present","text":"Heavy alcohol use, smoking; diabetes develops later"}],"pe":[{"item":"tenderness","options":["epigastric"],"text":"Epigastric tenderness"},{"item":"guarding","options":["soft"],"text":"Usually soft, no peritonism"},{"item":"palpable","options":["mass"],"state":"present","text":"Mass if a pseudocyst is present"},{"item":"skin","options":["icterus"],"state":"present","text":"Jaundice if the distal CBD is compressed"}],"labs":["Lipase is often normal or only mildly raised","Fecal elastase (exocrine function), glucose / HbA1c, fat-soluble vitamins","Liver tests (biliary stricture)"],"imaging":["CT — calcifications, duct dilatation, atrophy, pseudocysts","MRCP and EUS for early disease; EUS to exclude a mass"],"pitfalls":["Pancreatic cancer can mimic or complicate chronic pancreatitis — new weight loss, jaundice, or diabetes needs imaging.","Ongoing pain may come from a pseudocyst, duct obstruction, or opioid-induced hyperalgesia.","Lipase does not track disease activity."]},"colorectal_cancer":{"id":"colorectal_cancer","name":"Colorectal cancer","must_not_miss":false,"timecourse":["subacute","chronic"],"status":"draft","one_liner":"Change in bowel habit, rectal bleeding or iron-deficiency anemia with weight loss in a patient over 50 (or with a family history); left-sided tumors obstruct and bleed, right-sided tumors present with anemia.","symptoms":[{"item":"assoc_gi","options":["bowel_change","constipation","diarrhea"],"state":"present","text":"Change in bowel habit"},{"item":"assoc_gi","options":["hematochezia","melena"],"state":"present","text":"Rectal bleeding or melena (right-sided)"},{"item":"assoc_sys","options":["weight_loss"],"state":"present","text":"Weight loss"},{"item":"assoc_sys","options":["malaise"],"state":"present","text":"Fatigue (anemia)"},{"item":"assoc_gi","options":["tenesmus"],"state":"present","text":"Tenesmus (rectal cancer)"},{"item":"assoc_gi","options":["obstipation","bloating"],"state":"present","text":"Obstructive symptoms"},{"item":"onset","options":["gradual"],"text":"Insidious"},{"item":"duration","options":["w1_4","m1_3","gt3m"],"text":"Weeks to months"},{"item":"age_group","options":["age_40_59","age_60_plus"],"text":"Mostly over 50 (rising incidence in younger adults)"},{"item":"risk","options":["gi_cancer_fhx","ibd"],"state":"present","text":"Family history, long-standing IBD"}],"pe":[{"item":"skin","options":["pallor"],"state":"present","text":"Pallor"},{"item":"palpable","options":["mass","hepatomegaly"],"state":"present","text":"Abdominal mass; hepatomegaly (metastases)"},{"item":"rectal","options":["mass","fresh_blood","melena"],"text":"Rectal mass or blood on rectal exam"},{"item":"abd_contour","options":["mild","marked"],"text":"Distension if obstructing"}],"labs":["CBC, ferritin (iron-deficiency anemia), liver tests","Fecal immunochemical test (FIT) is for screening, not for symptomatic patients","CEA for staging / follow-up, not diagnosis"],"imaging":["Colonoscopy with biopsy","CT chest / abdomen / pelvis for staging; pelvic MRI for rectal cancer"],"pitfalls":["Iron-deficiency anemia in a man or post-menopausal woman needs both upper and lower endoscopy.","Do not attribute rectal bleeding to hemorrhoids without examining the colon in at-risk patients.","Obstructing cancer can present as large bowel obstruction or perforation."]},"constipation":{"id":"constipation","name":"Constipation","must_not_miss":false,"timecourse":["subacute","chronic"],"status":"draft","one_liner":"Crampy lower or diffuse abdominal discomfort and bloating with infrequent, hard, or difficult-to-pass stools, eased by defecation; look for medication, metabolic, and structural causes.","symptoms":[{"item":"assoc_gi","options":["constipation"],"state":"present","text":"Infrequent, hard, or difficult stools"},{"item":"pain_quality","options":["cramping","dull","pressure"],"text":"Crampy or dull discomfort"},{"item":"pain_location","options":["llq","diffuse","suprapubic"],"text":"Lower abdominal or diffuse"},{"item":"assoc_gi","options":["bloating"],"state":"present","text":"Bloating"},{"item":"relieving","options":["defecation"],"text":"Relieved by defecation"},{"item":"risk","options":["chronic_constipation","retention_drugs"],"state":"present","text":"Chronic constipation; opioids, anticholinergics, iron, calcium-channel blockers"},{"item":"assoc_sys","options":["weight_loss"],"state":"absent","text":"No weight loss"},{"item":"assoc_gi","options":["hematochezia","melena"],"state":"absent","text":"No GI bleeding"}],"pe":[{"item":"abd_contour","options":["mild","flat"],"text":"Mild distension or normal contour"},{"item":"tenderness","options":["llq","none","diffuse"],"text":"Mild LLQ tenderness, palpable stool in the sigmoid"},{"item":"guarding","options":["soft"],"text":"Soft abdomen"},{"item":"rectal","options":["hard_stool"],"text":"Hard stool in the rectal vault"}],"labs":["CBC, glucose, calcium, TSH for new or refractory constipation"],"imaging":["Plain X-ray only if fecal loading or obstruction is a question","Colonoscopy for alarm features or new constipation after 50"],"pitfalls":["New-onset constipation in an older adult may be colorectal cancer.","Overflow diarrhea from fecal impaction is easily mistaken for diarrhea.","Obstipation with distension and vomiting is obstruction, not constipation."]},"crohns_disease":{"id":"crohns_disease","name":"Crohn's disease","must_not_miss":false,"timecourse":["subacute","chronic"],"status":"draft","one_liner":"Recurrent RLQ crampy pain with chronic diarrhea, weight loss and low-grade fever in a young adult, sometimes with perianal fistula / abscess or a tender RLQ mass from terminal ileal disease.","symptoms":[{"item":"pain_location","options":["rlq","periumbilical"],"text":"RLQ or periumbilical pain"},{"item":"pain_quality","options":["cramping","colicky"],"text":"Crampy, often postprandial (stricturing disease)"},{"item":"meal_relation","options":["worse_eating"],"text":"Worse after eating"},{"item":"duration","options":["w1_4","m1_3","gt3m"],"text":"Weeks to months, relapsing"},{"item":"assoc_gi","options":["diarrhea"],"state":"present","text":"Chronic diarrhea (usually non-bloody)"},{"item":"assoc_sys","options":["weight_loss","fever"],"state":"present","text":"Weight loss, low-grade fever"},{"item":"assoc_sys","options":["malaise"],"state":"present","text":"Fatigue"},{"item":"age_group","options":["under_40"],"text":"Peak onset 15–35"},{"item":"risk","options":["ibd","smoking"],"state":"present","text":"Known IBD; smoking increases risk"},{"item":"episodes","options":["recurrent"],"text":"Relapsing course"}],"pe":[{"item":"tenderness","options":["rlq"],"text":"RLQ tenderness"},{"item":"palpable","options":["mass"],"state":"present","text":"Tender RLQ mass (inflammatory mass or abscess)"},{"item":"rectal","options":["perianal"],"text":"Perianal fistula, abscess, or skin tags"},{"item":"skin","options":["pallor"],"state":"present","text":"Pallor"},{"item":"vitals","options":["fever"],"state":"present","text":"Low-grade fever"}],"labs":["CBC (anemia, thrombocytosis), CRP, albumin, ferritin, B12","Fecal calprotectin; stool culture and C. difficile to exclude infection"],"imaging":["Ileocolonoscopy with ileal biopsies","CT or MR enterography for small bowel extent, strictures, fistulas, abscess"],"pitfalls":["Intestinal tuberculosis mimics ileocecal Crohn's — important in Taiwan; exclude before starting immunosuppression.","Acute presentation can mimic appendicitis.","Normal CRP does not exclude active disease in some patients.","Before biologics or steroids, screen for HBV and latent TB."]},"cystitis":{"id":"cystitis","name":"Cystitis","must_not_miss":false,"timecourse":["acute"],"status":"draft","one_liner":"Suprapubic discomfort with dysuria, frequency and urgency, sometimes hematuria, without fever or flank pain — most often in women.","symptoms":[{"item":"pain_location","options":["suprapubic"],"text":"Suprapubic discomfort"},{"item":"assoc_gu","options":["dysuria"],"state":"present","text":"Dysuria"},{"item":"assoc_gu","options":["frequency"],"state":"present","text":"Frequency and urgency"},{"item":"assoc_gu","options":["hematuria"],"state":"present","text":"Hematuria"},{"item":"assoc_sys","options":["fever"],"state":"absent","text":"No fever (fever or flank pain = pyelonephritis)"},{"item":"assoc_gu","options":["vaginal_discharge"],"state":"absent","text":"No vaginal discharge (discharge suggests vaginitis / cervicitis)"},{"item":"sex","options":["female"],"text":"Mostly women; in men consider prostatitis or complicated UTI"},{"item":"duration","options":["lt6h","h6_24","d1_3"],"text":"Short history"}],"pe":[{"item":"tenderness","options":["suprapubic","none"],"text":"Suprapubic tenderness or normal exam"},{"item":"vitals","options":["fever"],"state":"absent","text":"Afebrile"},{"item":"cva_tenderness","options":["none"],"text":"No CVA tenderness"}],"labs":["Urine dipstick (leukocyte esterase, nitrite), urinalysis","Urine culture for men, pregnancy, recurrence, treatment failure, or complicated UTI","hCG when relevant"],"imaging":["Not needed in uncomplicated cystitis"],"pitfalls":["UTI in men is considered complicated — evaluate for prostatitis or retention.","Recurrent hematuria without infection needs urologic evaluation.","Pelvic appendicitis and PID can cause pyuria and urinary symptoms."]},"diverticulitis":{"id":"diverticulitis","name":"Diverticulitis","must_not_miss":false,"timecourse":["acute"],"status":"draft","one_liner":"Constant LLQ pain over days with fever and LLQ tenderness, sometimes a mass, in a middle-aged or older patient; in Asian patients right-sided (cecal / ascending) diverticulitis is common and mimics appendicitis.","symptoms":[{"item":"pain_location","options":["llq","rlq","suprapubic"],"text":"LLQ pain (RLQ in right-sided disease — common in Asia)"},{"item":"pain_pattern","options":["constant"],"text":"Constant pain"},{"item":"onset","options":["hours","gradual"],"text":"Develops over hours to days"},{"item":"duration","options":["h6_24","d1_3","d4_7"],"text":"Usually presents after 1–3 days"},{"item":"assoc_sys","options":["fever"],"state":"present","text":"Fever"},{"item":"assoc_gi","options":["constipation","diarrhea","bowel_change"],"state":"present","text":"Change in bowel habit"},{"item":"assoc_gi","options":["nausea","anorexia"],"state":"present","text":"Nausea, anorexia"},{"item":"assoc_gu","options":["frequency","dysuria"],"state":"present","text":"Urinary symptoms (bladder irritation; pneumaturia = colovesical fistula)"},{"item":"risk","options":["diverticular"],"state":"present","text":"Known diverticulosis or prior attack"}],"pe":[{"item":"tenderness","options":["llq","rlq"],"text":"Localized LLQ (or RLQ) tenderness"},{"item":"vitals","options":["fever"],"state":"present","text":"Fever"},{"item":"palpable","options":["mass"],"state":"present","text":"Tender mass (phlegmon or abscess)"},{"item":"guarding","options":["voluntary","involuntary"],"text":"Localized guarding"},{"item":"rebound","options":["present"],"text":"Diffuse peritonitis suggests perforation"}],"labs":["Leukocytosis, raised CRP (very high CRP suggests complicated disease)","Urinalysis (may show pyuria)"],"imaging":["CT abdomen / pelvis with IV contrast — confirms diagnosis, detects abscess or perforation","Colonoscopy 6–8 weeks after recovery for complicated disease or if not recently done (exclude cancer)"],"pitfalls":["Colorectal cancer can mimic diverticulitis — ensure colonoscopy follow-up.","Elderly and immunosuppressed patients have fewer signs and more complications.","Right-sided diverticulitis is frequently mistaken for appendicitis."]},"dka":{"id":"dka","name":"Diabetic ketoacidosis","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Diffuse abdominal pain with vomiting, polyuria and polydipsia, dehydration and Kussmaul breathing in a diabetic patient (or as the first presentation of diabetes); pain tracks the severity of acidosis.","symptoms":[{"item":"pain_location","options":["diffuse","epigastric","periumbilical"],"text":"Diffuse or epigastric pain"},{"item":"assoc_gi","options":["nausea","vomiting"],"state":"present","text":"Nausea and vomiting"},{"item":"assoc_other","options":["polyuria"],"state":"present","text":"Polyuria and polydipsia"},{"item":"assoc_other","options":["dyspnea"],"state":"present","text":"Deep, rapid breathing"},{"item":"assoc_sys","options":["weight_loss","malaise"],"state":"present","text":"Weight loss, fatigue"},{"item":"assoc_other","options":["confusion"],"state":"present","text":"Drowsiness or confusion"},{"item":"risk","options":["diabetes"],"state":"present","text":"Known diabetes (missed insulin, infection, SGLT2 inhibitor) — or new type 1 diabetes"},{"item":"duration","options":["lt6h","h6_24","d1_3"],"text":"Develops over hours to a day or two"}],"pe":[{"item":"vitals","options":["tachypnea"],"state":"present","text":"Kussmaul respiration"},{"item":"general","options":["dehydrated"],"text":"Dry mucous membranes, dehydration"},{"item":"vitals","options":["tachycardia","hypotension"],"state":"present","text":"Tachycardia, hypotension"},{"item":"tenderness","options":["diffuse","none"],"text":"Diffuse tenderness without localized peritonism"},{"item":"general","options":["confused"],"text":"Altered mental status"}],"labs":["Glucose, blood ketones (β-hydroxybutyrate), venous blood gas, anion gap","Electrolytes (potassium!), creatinine, osmolality","Lipase and amylase can be raised without pancreatitis"],"imaging":["Not needed for DKA itself; image if pain persists after acidosis improves"],"pitfalls":["Euglycemic DKA on SGLT2 inhibitors — glucose may be < 250 mg/dL.","DKA can be caused by an abdominal emergency (appendicitis, pancreatitis); persistent pain after correcting acidosis needs a search.","Total-body potassium is low even when serum potassium is normal or high."]},"ectopic_pregnancy":{"id":"ectopic_pregnancy","name":"Ectopic pregnancy","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Unilateral lower abdominal pain with vaginal bleeding after a missed period in a woman of reproductive age; rupture causes sudden severe pain, shoulder-tip pain, syncope, and shock.","symptoms":[{"item":"sex","options":["female"],"text":"Woman of reproductive age"},{"item":"repro_status","options":["period_late","preg_possible","pregnant"],"text":"Missed or late period; pregnancy possible"},{"item":"pain_location","options":["rlq","llq","suprapubic"],"text":"Unilateral lower abdominal or pelvic pain"},{"item":"assoc_gu","options":["vaginal_bleeding"],"state":"present","text":"Vaginal bleeding or spotting"},{"item":"onset","options":["sudden"],"text":"Sudden severe pain suggests rupture"},{"item":"radiation","options":["r_shoulder","l_shoulder"],"text":"Shoulder-tip pain (hemoperitoneum)"},{"item":"assoc_other","options":["syncope"],"state":"present","text":"Syncope or dizziness"},{"item":"risk","options":["sti_risk"],"state":"present","text":"Prior PID / STI (also prior ectopic, tubal surgery, IVF, IUD)"}],"pe":[{"item":"pelvic","options":["adnexal_tender","cmt"],"state":"present","text":"Adnexal tenderness, cervical motion tenderness"},{"item":"pelvic","options":["adnexal_mass"],"state":"present","text":"Adnexal mass (often not palpable)"},{"item":"tenderness","options":["rlq","llq","suprapubic"],"text":"Lower abdominal tenderness"},{"item":"vitals","options":["hypotension","tachycardia"],"state":"present","text":"Tachycardia, hypotension (rupture)"},{"item":"rebound","options":["present"],"text":"Peritoneal signs (hemoperitoneum)"}],"labs":["Urine / serum hCG in every woman of reproductive age with abdominal pain","Quantitative β-hCG trend; CBC; blood type and Rh"],"imaging":["Transvaginal ultrasound — no intrauterine pregnancy with positive hCG, adnexal mass, free fluid","FAST in unstable patients"],"pitfalls":["Histories of \"no chance of pregnancy\" are unreliable — test everyone.","A pregnancy of unknown location needs serial hCG and follow-up ultrasound, not reassurance.","Heterotopic pregnancy is more common after assisted reproduction.","Pain can be mild before rupture."]},"functional_dyspepsia":{"id":"functional_dyspepsia","name":"Functional dyspepsia","must_not_miss":false,"timecourse":["chronic"],"status":"draft","one_liner":"Chronic or recurrent epigastric pain or burning, postprandial fullness, or early satiety without alarm features and with no structural cause found on evaluation.","symptoms":[{"item":"pain_location","options":["epigastric"],"text":"Epigastric pain or burning"},{"item":"pain_quality","options":["burning","pressure","dull"],"text":"Burning, fullness, or vague discomfort"},{"item":"duration","options":["m1_3","gt3m"],"text":"Chronic (Rome IV — symptoms for the last 3 months, onset ≥ 6 months ago)"},{"item":"assoc_gi","options":["early_satiety","bloating"],"state":"present","text":"Early satiety, postprandial fullness or bloating"},{"item":"meal_relation","options":["worse_eating"],"text":"Often triggered by meals (postprandial distress type)"},{"item":"episodes","options":["recurrent"],"text":"Recurrent, fluctuating course"},{"item":"assoc_sys","options":["weight_loss"],"state":"absent","text":"No weight loss"},{"item":"assoc_gi","options":["melena","hematemesis","dysphagia","vomiting"],"state":"absent","text":"No GI bleeding, dysphagia, or persistent vomiting"},{"item":"age_group","options":["under_40","age_40_59"],"text":"Usually younger patients"}],"pe":[{"item":"tenderness","options":["none","epigastric"],"text":"Normal exam or mild epigastric tenderness"},{"item":"guarding","options":["soft"],"text":"Soft abdomen"},{"item":"palpable","options":["mass"],"state":"absent","text":"No mass"},{"item":"skin","options":["pallor"],"state":"absent","text":"No pallor"}],"labs":["CBC normal (anemia is an alarm feature)","H. pylori test-and-treat"],"imaging":["EGD for alarm features or older age; in high gastric-cancer-incidence regions many guidelines use a lower age threshold","Ultrasound only if biliary symptoms are suspected"],"pitfalls":["A diagnosis of exclusion — reassess when new alarm features appear.","Overlaps with GERD, IBS, and gastroparesis; ask about each.","Medication causes (NSAIDs, iron, potassium, bisphosphonates, metformin, GLP-1 agonists) should be considered.","Abdominal wall pain (positive Carnett's sign) is a common unrecognized cause of persistent localized pain."]},"gastric_cancer":{"id":"gastric_cancer","name":"Gastric cancer","must_not_miss":false,"timecourse":["subacute","chronic"],"status":"draft","one_liner":"Persistent epigastric discomfort with early satiety, anorexia and weight loss in an older patient, sometimes with iron-deficiency anemia, melena, or vomiting from outlet obstruction.","symptoms":[{"item":"pain_location","options":["epigastric"],"text":"Epigastric discomfort, often vague"},{"item":"onset","options":["gradual"],"text":"Insidious onset"},{"item":"duration","options":["w1_4","m1_3","gt3m"],"text":"Weeks to months"},{"item":"assoc_gi","options":["early_satiety","anorexia"],"state":"present","text":"Early satiety and anorexia"},{"item":"assoc_sys","options":["weight_loss"],"state":"present","text":"Unintentional weight loss"},{"item":"assoc_gi","options":["melena","hematemesis"],"state":"present","text":"Melena or hematemesis"},{"item":"assoc_gi","options":["vomiting"],"state":"present","text":"Persistent vomiting (gastric outlet obstruction)"},{"item":"assoc_gi","options":["dysphagia"],"state":"present","text":"Dysphagia (cardia / GE junction tumors)"},{"item":"age_group","options":["age_40_59","age_60_plus"],"text":"Usually over 50"},{"item":"risk","options":["hpylori","gi_cancer_fhx","smoking"],"state":"present","text":"H. pylori, family history, smoking"}],"pe":[{"item":"skin","options":["pallor"],"state":"present","text":"Pallor (iron-deficiency anemia)"},{"item":"palpable","options":["mass"],"state":"present","text":"Epigastric mass (advanced)"},{"item":"skin","options":["virchow"],"state":"present","text":"Left supraclavicular (Virchow) node"},{"item":"palpable","options":["hepatomegaly","ascites"],"state":"present","text":"Hepatomegaly or ascites (metastatic)"},{"item":"tenderness","options":["epigastric","none"],"text":"Mild epigastric tenderness or none"}],"labs":["CBC — iron-deficiency anemia; ferritin","Albumin; liver tests","Tumor markers (CEA, CA 19-9) are not for diagnosis"],"imaging":["EGD with multiple biopsies of any ulcer or suspicious mucosa","CT chest / abdomen / pelvis for staging; EUS for local staging"],"pitfalls":["PPI therapy can temporarily heal a malignant ulcer and relieve symptoms — biopsy gastric ulcers and confirm healing.","Diffuse-type (signet ring) cancer may occur in younger patients and show subtle endoscopic findings.","Treat dyspepsia with any alarm feature as possible malignancy until endoscopy."]},"gastritis":{"id":"gastritis","name":"Gastritis / gastropathy","must_not_miss":false,"timecourse":["acute","subacute","chronic"],"status":"draft","one_liner":"Epigastric burning or discomfort with nausea, often after NSAIDs or alcohol or with H. pylori infection; erosive forms can bleed. A histologic / endoscopic diagnosis, not a clinical one.","symptoms":[{"item":"pain_location","options":["epigastric"],"text":"Epigastric discomfort"},{"item":"pain_quality","options":["burning","dull","gnawing"],"text":"Burning or gnawing"},{"item":"precipitant","options":["nsaid","alcohol"],"text":"After NSAIDs or alcohol"},{"item":"assoc_gi","options":["nausea","vomiting"],"state":"present","text":"Nausea, sometimes vomiting"},{"item":"assoc_gi","options":["anorexia","early_satiety"],"state":"present","text":"Anorexia or early satiety"},{"item":"assoc_gi","options":["hematemesis","melena"],"state":"present","text":"Hematemesis or melena (erosive / hemorrhagic gastritis)"},{"item":"risk","options":["nsaid","alcohol","hpylori"],"state":"present","text":"Regular NSAIDs, heavy drinking, H. pylori"}],"pe":[{"item":"tenderness","options":["epigastric","none"],"text":"Mild epigastric tenderness or normal exam"},{"item":"guarding","options":["soft"],"text":"Soft abdomen"},{"item":"rectal","options":["melena"],"text":"Melena if bleeding"}],"labs":["CBC if bleeding is suspected","H. pylori testing"],"imaging":["EGD when bleeding, alarm features, or persistent symptoms"],"pitfalls":["The label \"gastritis\" is often used loosely for functional dyspepsia — endoscopic findings correlate poorly with symptoms.","Stress-related mucosal disease in critically ill patients presents with bleeding rather than pain.","Chronic atrophic gastritis (H. pylori, autoimmune) raises gastric cancer risk and can cause B12 or iron deficiency."]},"gerd":{"id":"gerd","name":"Gastroesophageal reflux disease","must_not_miss":false,"timecourse":["chronic"],"status":"draft","one_liner":"Retrosternal or epigastric burning (heartburn) and acid regurgitation, worse after meals and lying down, relieved by antacids or PPIs.","symptoms":[{"item":"assoc_gi","options":["heartburn"],"state":"present","text":"Heartburn and acid regurgitation (the key symptoms)"},{"item":"pain_location","options":["epigastric"],"text":"Epigastric or retrosternal location"},{"item":"pain_quality","options":["burning"],"text":"Burning quality"},{"item":"meal_relation","options":["worse_eating"],"text":"Worse after meals"},{"item":"aggravating","options":["lying_flat"],"text":"Worse lying down or bending over"},{"item":"relieving","options":["antacid"],"text":"Relieved by antacids or PPIs"},{"item":"duration","options":["m1_3","gt3m"],"text":"Chronic, recurrent"},{"item":"assoc_other","options":["cough"],"state":"present","text":"Chronic cough or hoarseness (extra-esophageal)"},{"item":"assoc_gi","options":["dysphagia"],"state":"absent","text":"No dysphagia (dysphagia is an alarm feature)"}],"pe":[{"item":"tenderness","options":["none","epigastric"],"text":"Usually normal exam"},{"item":"guarding","options":["soft"],"text":"Soft abdomen"}],"labs":["No routine labs; CBC if bleeding or anemia is suspected"],"imaging":["Empiric PPI trial in typical symptoms without alarm features","EGD for alarm features, refractory symptoms, or long-standing symptoms with Barrett's risk","pH / impedance monitoring if the diagnosis is uncertain"],"pitfalls":["Cardiac chest pain can be described as \"burning\" — exclude ACS first in at-risk patients.","Dysphagia, weight loss, bleeding, or anemia require endoscopy.","Poor PPI response — check adherence and dosing timing, then consider functional heartburn, eosinophilic esophagitis, or other causes."]},"ibs":{"id":"ibs","name":"Irritable bowel syndrome","must_not_miss":false,"timecourse":["chronic"],"status":"draft","one_liner":"Recurrent abdominal pain related to defecation and associated with a change in stool frequency or form, for at least 3 months, without alarm features — a positive diagnosis, not just one of exclusion.","symptoms":[{"item":"relieving","options":["defecation"],"text":"Pain related to defecation (improves or worsens)"},{"item":"assoc_gi","options":["diarrhea","constipation","bowel_change"],"state":"present","text":"Change in stool frequency or form (IBS-D, IBS-C, or mixed)"},{"item":"assoc_gi","options":["bloating"],"state":"present","text":"Bloating and distension"},{"item":"pain_quality","options":["cramping"],"text":"Crampy pain"},{"item":"pain_location","options":["llq","diffuse","periumbilical"],"text":"Often lower abdominal or variable location"},{"item":"duration","options":["m1_3","gt3m"],"text":"Chronic (Rome IV — at least 1 day / week for 3 months, onset ≥ 6 months ago)"},{"item":"episodes","options":["recurrent"],"text":"Recurrent episodes, often with stress"},{"item":"nocturnal","options":["no_wake"],"text":"Does not wake the patient at night"},{"item":"assoc_sys","options":["weight_loss","fever"],"state":"absent","text":"No weight loss or fever"},{"item":"assoc_gi","options":["hematochezia","melena","bloody_diarrhea"],"state":"absent","text":"No GI bleeding"},{"item":"age_group","options":["under_40","age_40_59"],"text":"Onset usually before 50"}],"pe":[{"item":"tenderness","options":["none","llq","diffuse"],"text":"Normal exam or mild non-specific tenderness"},{"item":"guarding","options":["soft"],"text":"Soft abdomen"},{"item":"palpable","options":["mass"],"state":"absent","text":"No mass"},{"item":"skin","options":["pallor"],"state":"absent","text":"No pallor"}],"labs":["CBC, CRP; fecal calprotectin in diarrhea-predominant symptoms to screen for IBD","Celiac serology in diarrhea-predominant symptoms (lower prevalence in Taiwan); thyroid function as indicated"],"imaging":["Colonoscopy for alarm features, age ≥ 45–50 without prior screening, or persistent diarrhea (microscopic colitis)"],"pitfalls":["New symptoms after age 50, rectal bleeding, weight loss, nocturnal symptoms, anemia, or family history of colorectal cancer / IBD require evaluation.","Microscopic colitis, bile acid diarrhea, and lactose intolerance can mimic IBS-D.","Avoid repeated investigation once the diagnosis is confidently made."]},"infectious_ileocecitis":{"id":"infectious_ileocecitis","name":"Infectious ileocecitis","must_not_miss":false,"timecourse":["acute"],"status":"draft","one_liner":"Acute RLQ pain with fever and diarrhea from Yersinia, Campylobacter, or Salmonella infection of the terminal ileum and cecum — a classic appendicitis mimic (\"pseudoappendicitis\").","symptoms":[{"item":"pain_location","options":["rlq","periumbilical"],"text":"RLQ pain"},{"item":"assoc_gi","options":["diarrhea"],"state":"present","text":"Diarrhea, sometimes preceding the pain"},{"item":"assoc_sys","options":["fever"],"state":"present","text":"Fever"},{"item":"assoc_gi","options":["nausea","vomiting"],"state":"present","text":"Nausea, vomiting"},{"item":"duration","options":["h6_24","d1_3","d4_7"],"text":"Days"},{"item":"risk","options":["sick_contacts","travel"],"state":"present","text":"Suspicious food (undercooked pork, poultry), travel, sick contacts"}],"pe":[{"item":"tenderness","options":["rlq"],"text":"RLQ tenderness"},{"item":"vitals","options":["fever"],"state":"present","text":"Fever"},{"item":"guarding","options":["soft","voluntary"],"text":"Usually less peritonism than appendicitis"},{"item":"rebound","options":["absent"],"text":"Rebound usually absent"}],"labs":["Leukocytosis, raised CRP","Stool culture (request Yersinia culture specifically if suspected)"],"imaging":["Ultrasound or CT — thickened terminal ileum / cecum, enlarged mesenteric nodes, normal appendix"],"pitfalls":["The appendix must be clearly seen as normal before attributing RLQ pain to ileocecitis.","Persistent or recurrent symptoms suggest Crohn's disease or intestinal tuberculosis."]},"ischemic_colitis":{"id":"ischemic_colitis","name":"Ischemic colitis","must_not_miss":false,"timecourse":["acute"],"status":"draft","one_liner":"Sudden mild-to-moderate crampy left-sided abdominal pain followed within 24 hours by bloody diarrhea or hematochezia in an older patient with vascular risk factors.","symptoms":[{"item":"onset","options":["sudden","hours"],"text":"Sudden or rapid onset"},{"item":"pain_location","options":["llq","diffuse"],"text":"Left-sided (LLQ) pain"},{"item":"pain_quality","options":["cramping"],"text":"Crampy"},{"item":"assoc_gi","options":["hematochezia","bloody_diarrhea"],"state":"present","text":"Bloody diarrhea or hematochezia within 24 h"},{"item":"assoc_gi","options":["diarrhea"],"state":"present","text":"Urge to defecate"},{"item":"age_group","options":["age_60_plus"],"text":"Usually over 60"},{"item":"risk","options":["atherosclerosis","diabetes","chronic_constipation"],"state":"present","text":"Vascular disease, diabetes, constipation, recent hypotension"}],"pe":[{"item":"tenderness","options":["llq"],"text":"Mild LLQ tenderness"},{"item":"guarding","options":["soft"],"text":"Usually soft (peritonism = transmural necrosis)"},{"item":"rectal","options":["fresh_blood"],"text":"Blood on rectal exam"},{"item":"vitals","options":["tachycardia"],"state":"present","text":"Tachycardia if severe"}],"labs":["CBC, lactate, electrolytes, creatinine","Stool culture and C. difficile to exclude infectious colitis"],"imaging":["CT with contrast — segmental colonic wall thickening (watershed areas such as the splenic flexure and rectosigmoid)","Colonoscopy (gentle, minimal insufflation) within 48 h to confirm"],"pitfalls":["Isolated right-sided ischemic colitis can signal SMA disease — consider CT angiography for acute mesenteric ischemia.","Severe pain out of proportion is more typical of small bowel ischemia than ischemic colitis.","Peritonitis, gangrene, or pneumatosis require surgery."]},"liver_abscess":{"id":"liver_abscess","name":"Liver abscess","must_not_miss":true,"timecourse":["acute","subacute"],"status":"draft","one_liner":"Fever with rigors and RUQ pain or tenderness over days to weeks, often in a diabetic patient; in Taiwan Klebsiella pneumoniae is the leading cause and can spread to the eye and CNS.","symptoms":[{"item":"assoc_sys","options":["fever","chills"],"state":"present","text":"High fever with chills or rigors (may be the only symptom)"},{"item":"pain_location","options":["ruq"],"text":"RUQ pain (absent in many patients)"},{"item":"pain_quality","options":["dull"],"text":"Dull, constant ache"},{"item":"duration","options":["d4_7","w1_4"],"text":"Days to weeks"},{"item":"aggravating","options":["deep_breath"],"text":"Pleuritic pain or right shoulder discomfort from diaphragmatic irritation"},{"item":"assoc_sys","options":["malaise","weight_loss"],"state":"present","text":"Malaise, anorexia, weight loss"},{"item":"risk","options":["diabetes","immunocompromised","biliary_procedure"],"state":"present","text":"Diabetes, immunocompromise, biliary disease or intervention"},{"item":"risk","options":["travel"],"state":"present","text":"Travel to endemic areas (amebic abscess)"}],"pe":[{"item":"vitals","options":["fever"],"state":"present","text":"Fever"},{"item":"palpable","options":["liver_tender","hepatomegaly"],"state":"present","text":"Liver tenderness on fist percussion, hepatomegaly"},{"item":"tenderness","options":["ruq"],"text":"RUQ tenderness"},{"item":"chest","options":["crackles_r"],"state":"present","text":"Reduced breath sounds / crackles at the right base (effusion, atelectasis)"},{"item":"vitals","options":["tachycardia","hypotension"],"state":"present","text":"Tachycardia; hypotension if septic"}],"labs":["Leukocytosis, markedly raised CRP; raised ALP is common","Blood cultures (positive in many Klebsiella cases); glucose / HbA1c","Amebic serology when exposure is possible"],"imaging":["Ultrasound or contrast CT — CT is more sensitive and guides drainage","Percutaneous aspiration / drainage for diagnosis and treatment"],"pitfalls":["Fever without localizing symptoms is a common presentation — image the liver in febrile diabetics.","Klebsiella liver abscess can cause endophthalmitis and meningitis; ask about visual symptoms and examine the eyes.","Consider colonoscopy after recovery in cryptogenic Klebsiella abscess (association with colorectal neoplasia).","Early lesions on ultrasound can look solid and be mistaken for a tumor."]},"ovarian_torsion":{"id":"ovarian_torsion","name":"Ovarian torsion","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Sudden severe unilateral lower abdominal pain with nausea and vomiting in a woman with an ovarian cyst or mass; pain may be intermittent with partial torsion. Normal Doppler flow does not exclude it.","symptoms":[{"item":"sex","options":["female"],"text":"Female, often reproductive age (also children, pregnancy)"},{"item":"onset","options":["sudden"],"text":"Sudden onset, sometimes after exertion"},{"item":"pain_location","options":["rlq","llq","suprapubic"],"text":"Unilateral lower abdominal / pelvic pain"},{"item":"severity","options":["s7","s8","s9","s10"],"text":"Severe"},{"item":"pain_pattern","options":["waves","attacks"],"text":"Intermittent with partial torsion / detorsion"},{"item":"assoc_gi","options":["nausea","vomiting"],"state":"present","text":"Nausea and vomiting (common)"},{"item":"precipitant","options":["exertion"],"text":"May follow exercise or sudden movement"}],"pe":[{"item":"pelvic","options":["adnexal_mass","adnexal_tender"],"state":"present","text":"Adnexal tenderness or mass"},{"item":"tenderness","options":["rlq","llq","suprapubic"],"text":"Lower abdominal tenderness"},{"item":"vitals","options":["fever"],"state":"present","text":"Low-grade fever suggests necrosis"},{"item":"rebound","options":["present"],"text":"Peritonism (late)"}],"labs":["hCG; CBC (mild leukocytosis)"],"imaging":["Pelvic / transvaginal ultrasound with Doppler — enlarged ovary with peripheral follicles, mass, \"whirlpool\" sign","Diagnosis is ultimately surgical (laparoscopy)"],"pitfalls":["Preserved Doppler flow does not exclude torsion.","Often misdiagnosed as renal colic or gastroenteritis because of vomiting.","Time to detorsion determines ovarian salvage — involve gynecology early."]},"peptic_ulcer_disease":{"id":"peptic_ulcer_disease","name":"Peptic ulcer disease","must_not_miss":false,"timecourse":["subacute","chronic"],"status":"draft","one_liner":"Recurrent burning or gnawing epigastric pain related to meals, often waking the patient at night and relieved by antacids, in a patient with H. pylori infection or NSAID / aspirin use.","symptoms":[{"item":"pain_location","options":["epigastric"],"text":"Epigastric pain, well localized"},{"item":"pain_quality","options":["burning","gnawing"],"text":"Burning or gnawing, hunger-like pain"},{"item":"meal_relation","options":["better_eating","worse_hungry","worse_eating"],"text":"Meal-related — duodenal ulcer classically eased by food and worse when hungry; gastric ulcer often worse after eating"},{"item":"nocturnal","optio
