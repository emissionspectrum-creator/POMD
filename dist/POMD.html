:"abd_contour","options":["marked"],"text":"Massive, tympanic distension"},{"item":"tenderness","options":["diffuse","llq","none"],"text":"Variable tenderness — peritonism suggests gangrene"},{"item":"rectal","options":["empty"],"text":"Empty rectum"},{"item":"vitals","options":["fever","tachycardia","hypotension"],"state":"present","text":"Fever, tachycardia, hypotension — strangulation"}],"labs":["Electrolytes, creatinine, CBC, lactate"],"imaging":["Plain X-ray — \"coffee bean\" dilated sigmoid loop","CT — whirl sign, transition point, ischemia","Endoscopic detorsion if no peritonitis; most recur without elective surgery"],"pitfalls":["Signs of ischemia or perforation mean emergency surgery, not endoscopy.","Cecal volvulus occurs in younger patients and is not amenable to endoscopic detorsion.","Distinguish from colonic pseudo-obstruction (Ogilvie) on CT."]},"small_bowel_obstruction":{"id":"small_bowel_obstruction","name":"Small bowel obstruction","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Colicky periumbilical pain coming in waves with vomiting, distension and inability to pass stool or flatus, usually from adhesions after surgery or a hernia; constant pain or fever suggests strangulation.","symptoms":[{"item":"pain_location","options":["periumbilical","diffuse"],"text":"Periumbilical or diffuse pain"},{"item":"pain_quality","options":["colicky","cramping"],"text":"Colicky, crampy pain"},{"item":"pain_pattern","options":["waves"],"text":"Comes in waves; becoming constant suggests ischemia"},{"item":"assoc_gi","options":["vomiting"],"state":"present","text":"Vomiting — early and bilious in proximal obstruction"},{"item":"assoc_gi","options":["obstipation"],"state":"present","text":"No stool or flatus (may still pass stool early)"},{"item":"assoc_gi","options":["bloating"],"state":"present","text":"Abdominal distension / bloating"},{"item":"relieving","options":["vomiting"],"text":"Temporarily eased by vomiting"},{"item":"risk","options":["prior_surgery","hernia"],"state":"present","text":"Prior abdominal surgery (adhesions) or a known hernia"}],"pe":[{"item":"abd_contour","options":["mild","marked"],"text":"Distension, tympanic to percussion"},{"item":"bowel_sounds","options":["high_pitched","hyper"],"text":"High-pitched, tinkling bowel sounds (absent later)"},{"item":"hernia","options":["incarcerated"],"text":"Tender, irreducible hernia — always check groin and scars"},{"item":"tenderness","options":["periumbilical","diffuse"],"text":"Diffuse mild tenderness"},{"item":"general","options":["dehydrated"],"text":"Dehydration"},{"item":"vitals","options":["tachycardia","fever"],"state":"present","text":"Tachycardia or fever (suspect strangulation)"},{"item":"rebound","options":["present"],"text":"Peritoneal signs — strangulation or perforation"}],"labs":["Electrolytes, creatinine (dehydration, hypokalemia, metabolic alkalosis from vomiting)","Leukocytosis and raised lactate point to strangulation, but normal values do not exclude it"],"imaging":["CT abdomen / pelvis with IV contrast — transition point, closed loop, ischemia","Plain X-ray — dilated loops with air-fluid levels (limited sensitivity)"],"pitfalls":["Constant pain, fever, tachycardia, or peritonism suggest strangulation — needs surgery, not just a nasogastric tube.","Elderly women — look for a femoral hernia; patients without prior surgery need a cause sought (hernia, tumor, gallstone ileus).","Passage of flatus does not exclude a partial or closed-loop obstruction."]},"splenic_infarction":{"id":"splenic_infarction","name":"Splenic infarction","must_not_miss":false,"timecourse":["acute"],"status":"draft","one_liner":"Acute LUQ pain, sometimes pleuritic or radiating to the left shoulder, with fever, in a patient with an embolic source (atrial fibrillation, endocarditis) or a hematologic / hypercoagulable disorder.","symptoms":[{"item":"pain_location","options":["luq"],"text":"LUQ pain"},{"item":"onset","options":["sudden","hours"],"text":"Acute onset"},{"item":"aggravating","options":["deep_breath"],"text":"Pleuritic component"},{"item":"radiation","options":["l_shoulder"],"text":"Radiates to the left shoulder"},{"item":"assoc_sys","options":["fever","chills"],"state":"present","text":"Fever (common, especially with endocarditis)"},{"item":"assoc_gi","options":["nausea","vomiting"],"state":"present","text":"Nausea or vomiting"},{"item":"risk","options":["af","hypercoagulable"],"state":"present","text":"Atrial fibrillation, malignancy, myeloproliferative or hypercoagulable disorder"}],"pe":[{"item":"tenderness","options":["luq"],"text":"LUQ tenderness"},{"item":"palpable","options":["splenomegaly"],"state":"present","text":"Splenomegaly (hematologic causes)"},{"item":"chest","options":["irregular","murmur"],"state":"present","text":"Irregular rhythm or a new murmur (embolic source)"},{"item":"vitals","options":["fever"],"state":"present","text":"Fever"}],"labs":["Leukocytosis, raised LDH; CBC and smear for hematologic disease","Blood cultures if endocarditis is possible"],"imaging":["Contrast CT — wedge-shaped, peripheral low-attenuation area","Echocardiography (transesophageal if endocarditis suspected) to find an embolic source"],"pitfalls":["Often missed because LUQ pain is attributed to the stomach or chest; up to a third have minimal symptoms.","Look for the underlying cause — endocarditis needs prolonged antibiotics, AF needs anticoagulation.","Large infarcts can progress to abscess or rupture."]},"splenic_rupture":{"id":"splenic_rupture","name":"Splenic rupture","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"LUQ pain with left shoulder-tip pain (Kehr sign) and signs of hemorrhage after trauma, or spontaneously in an enlarged, diseased spleen (infectious mononucleosis, hematologic malignancy).","symptoms":[{"item":"pain_location","options":["luq","diffuse"],"text":"LUQ pain, becoming diffuse with hemoperitoneum"},{"item":"precipitant","options":["trauma"],"text":"Blunt abdominal or lower left chest trauma — rupture may be delayed by days"},{"item":"radiation","options":["l_shoulder"],"text":"Left shoulder-tip pain (Kehr sign)"},{"item":"onset","options":["sudden"],"text":"Sudden onset"},{"item":"assoc_other","options":["syncope"],"state":"present","text":"Lightheadedness or syncope"},{"item":"risk","options":["splenomegaly_mono","anticoag"],"state":"present","text":"Splenomegaly, recent mononucleosis, anticoagulation"}],"pe":[{"item":"vitals","options":["hypotension","tachycardia"],"state":"present","text":"Tachycardia and hypotension"},{"item":"general","options":["pale_diaphoretic"],"text":"Pale, diaphoretic"},{"item":"tenderness","options":["luq","diffuse"],"text":"LUQ or diffuse tenderness"},{"item":"guarding","options":["voluntary","involuntary"],"text":"Guarding"},{"item":"abd_contour","options":["mild","marked"],"text":"Distension with significant hemoperitoneum"}],"labs":["Hemoglobin (may be normal early), type and crossmatch, coagulation","Monospot / EBV serology in spontaneous cases"],"imaging":["FAST if unstable","Contrast CT if hemodynamically stable"],"pitfalls":["Hemoglobin lags behind blood loss.","Delayed rupture can occur days after seemingly minor trauma.","Spontaneous rupture in mononucleosis can follow trivial strain — advise against contact sports for several weeks.","Lower left rib fractures should raise suspicion of splenic injury."]},"stec_infection":{"id":"stec_infection","name":"Shiga toxin–producing E. coli (STEC / EHEC)","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Watery diarrhea turning bloody within 1–3 days, with severe crampy abdominal pain but little or no fever, after undercooked beef, unpasteurized products, or contaminated produce; may progress to hemolytic uremic syndrome.","symptoms":[{"item":"stool_character","options":["bloody"],"text":"Bloody diarrhea, often after a watery start"},{"item":"assoc_sys","options":["fever"],"state":"absent","text":"Little or no fever (unlike Shigella or Campylobacter)"},{"item":"pain_quality","options":["cramping"],"text":"Severe abdominal cramps"},{"item":"pain_location","options":["diffuse","rlq","llq"],"text":"Diffuse or lower abdominal pain, sometimes marked"},{"item":"exposure","options":["undercooked","banquet"],"state":"present","text":"Undercooked beef, unpasteurized milk, or contaminated produce"},{"item":"diarrhea_duration","options":["lt3d","d3_7"],"text":"Acute, days"},{"item":"dehydration_sx","options":["oliguria"],"state":"present","text":"Falling urine output — think HUS"}],"pe":[{"item":"tenderness","options":["diffuse","rlq","llq"],"text":"Abdominal tenderness, sometimes out of proportion to fever"},{"item":"vitals","options":["fever"],"state":"absent","text":"Afebrile or low-grade fever"},{"item":"skin","options":["pallor"],"state":"present","text":"Pallor (hemolysis in HUS)"}],"labs":["Stool culture with Shiga toxin testing (EIA or PCR) for any bloody diarrhea","CBC with smear (schistocytes), platelets, creatinine, LDH — repeat daily for HUS"],"imaging":["Usually not needed; CT may show right-sided colonic wall thickening"],"pitfalls":["Avoid antibiotics and antimotility drugs — they may increase the risk of HUS.","HUS typically appears 5–10 days after diarrhea begins, often as the diarrhea is settling.","Absence of fever with bloody diarrhea can falsely suggest ischemic colitis or IBD."]},"systemic_viral_infection":{"id":"systemic_viral_infection","name":"Systemic viral infection (influenza, COVID-19, other respiratory viruses)","must_not_miss":false,"timecourse":["acute"],"status":"draft","one_liner":"Mild, transient ALT/AST rise (usually < 3–5 × ULN) during or just after a febrile respiratory illness — influenza, COVID-19, adenovirus, or a severe common cold — that normalizes within weeks; acetaminophen use often contributes.","symptoms":[{"item":"viral_sx","options":["uri","sore_throat"],"state":"present","text":"Cough, runny nose, sore throat"},{"item":"viral_sx","options":["myalgia"],"state":"present","text":"Myalgia"},{"item":"assoc_sys","options":["fever","malaise"],"state":"present","text":"Fever, malaise"},{"item":"lft_duration","options":["lt1m","first_found"],"text":"Recent and acute"},{"item":"liver_drugs","options":["apap","nsaid"],"state":"present","text":"Acetaminophen or NSAIDs taken for the illness"},{"item":"assoc_sys","options":["jaundice"],"state":"absent","text":"No jaundice"}],"pe":[{"item":"vitals","options":["fever"],"state":"present","text":"Fever"},{"item":"tenderness","options":["none"],"text":"Non-tender abdomen"},{"item":"skin","options":["icterus"],"state":"absent","text":"No jaundice"}],"labs":["Influenza or COVID-19 rapid test / PCR during the illness","Repeat liver tests 2–4 weeks after recovery — they should normalize","CK if AST > ALT (viral myositis)"],"imaging":["None needed if liver tests normalize"],"pitfalls":["Persistent abnormality after recovery needs the usual work-up — the infection may have unmasked chronic liver disease.","High ALT (> 10 × ULN) or jaundice is not explained by a simple respiratory virus.","Ask how much acetaminophen was taken, including combination cold remedies."]},"ulcerative_colitis":{"id":"ulcerative_colitis","name":"Ulcerative colitis","must_not_miss":false,"timecourse":["subacute","chronic"],"status":"draft","one_liner":"Bloody diarrhea with urgency, tenesmus and crampy lower abdominal pain over weeks, often relieved by defecation; severe flares bring fever, tachycardia, and risk of toxic megacolon.","symptoms":[{"item":"assoc_gi","options":["bloody_diarrhea","hematochezia"],"state":"present","text":"Bloody diarrhea (the cardinal symptom)"},{"item":"assoc_gi","options":["tenesmus"],"state":"present","text":"Urgency and tenesmus"},{"item":"pain_location","options":["llq","suprapubic","diffuse"],"text":"Crampy LLQ or lower abdominal pain"},{"item":"pain_quality","options":["cramping"],"text":"Crampy"},{"item":"relieving","options":["defecation"],"text":"Relieved by defecation"},{"item":"duration","options":["w1_4","m1_3","gt3m"],"text":"Weeks or longer"},{"item":"nocturnal","options":["wakes"],"text":"Nocturnal bowel movements"},{"item":"assoc_sys","options":["fever","weight_loss"],"state":"present","text":"Fever and weight loss in severe flares"},{"item":"risk","options":["ibd"],"state":"present","text":"Known IBD"},{"item":"episodes","options":["recurrent"],"text":"Relapsing–remitting course"},{"item":"stool_character","options":["bloody","mucus"],"text":"Bloody, mucoid stools"},{"item":"stool_volume","options":["small"],"text":"Small-volume, frequent stools"},{"item":"nocturnal_stool","options":["wakes"],"text":"Nocturnal diarrhea"},{"item":"diarrhea_duration","options":["w2_4","m1_3","gt3m"],"text":"Weeks or longer"},{"item":"extraintestinal","options":["arthralgia","red_eye","skin_nodules"],"state":"present","text":"Joint, eye, or skin manifestations"}],"pe":[{"item":"tenderness","options":["llq","diffuse"],"text":"LLQ or diffuse tenderness"},{"item":"rectal","options":["fresh_blood"],"text":"Blood on rectal exam"},{"item":"vitals","options":["fever","tachycardia"],"state":"present","text":"Fever, tachycardia (severe colitis)"},{"item":"abd_contour","options":["mild","marked"],"text":"Distension — consider toxic megacolon"},{"item":"skin","options":["pallor"],"state":"present","text":"Pallor"},{"item":"systemic_pe","options":["erythema_nodosum"],"state":"present","text":"Erythema nodosum"}],"labs":["CBC, CRP, albumin, electrolytes","Stool culture and C. difficile in every flare; fecal calprotectin","CMV testing in steroid-refractory severe colitis"],"imaging":["Colonoscopy (flexible sigmoidoscopy in a severe flare) with biopsies","Plain X-ray in severe colitis — colon > 6 cm suggests toxic megacolon"],"pitfalls":["Always exclude infection, especially C. difficile, before escalating therapy.","Severe colitis (≥ 6 bloody stools / day plus systemic toxicity) needs admission.","Screen for HBV and latent TB before biologics o <script>
/*
 * POMD core logic — pure functions, no DOM access.
 * Loaded by both browser pages (dist/POMD.html, dist/POMD-history.html) and by the Node tests.
 *
 * Selection state shape:
 *   { [itemId]: { [optionId]: true | 'present' | 'absent' } }
 *   - single / multi items store `true` for each selected option
 *   - presence items store 'present' or 'absent' per option
 */
(function (root) {
  'use strict';

  // ---------- data preparation ----------

  // Adds lookup maps to the data produced by build.py. Safe to call twice.
  function prepare(data) {
    Object.keys(data.items).forEach(function (id) {
      var item = data.items[id];
      if (item.optById) return;
      item.optById = {};
      item.options.forEach(function (o) { item.optById[o.id] = o; });
    });
    return data;
  }

  // ---------- complaint view ----------

  // { itemId: true } for the items shown in a complaint's history and PE columns,
  // or null when the complaint lists no columns (then every item counts as shown).
  function shownItems(complaint) {
    if (!complaint || (!complaint.history && !complaint.pe)) return null;
    var out = {};
    (complaint.history || []).concat(complaint.pe || []).forEach(function (sec) {
      sec.items.forEach(function (id) {
        out[id] = true;
        var det = itemDetails(complaint, id);
        if (det) det.items.forEach(function (sub) { out[sub] = true; });
      });
    });
    return out;
  }

  // Collapsible block of sub-items attached to an item (`item_details`): { label, note?, items }.
  function itemDetails(complaint, itemId) {
    return (complaint && complaint.item_details && complaint.item_details[itemId]) || null;
  }

  // One-line summary of what is selected inside a details block, e.g. "Kaoliang · 40–60 g/day".
  function detailsSummary(det, state, items) {
    var parts = [];
    det.items.forEach(function (iid) {
      var item = items[iid];
      var sel = state[iid];
      if (!item || !sel) return;
      item.options.forEach(function (o) {
        if (sel[o.id] === true || sel[o.id] === 'present') parts.push(o.label);
        else if (sel[o.id] === 'absent') parts.push('no ' + o.label);
      });
    });
    return parts.join(' · ');
  }

  // Options of an item as shown in a complaint: the complaint may restrict an item to a
  // subset (`item_options`), so one shared vocabulary item can serve several complaints.
  function itemOptions(complaint, item) {
    var sub = complaint && complaint.item_options && complaint.item_options[item.id];
    if (!sub) return item.options;
    return item.options.filter(function (o) { return sub.indexOf(o.id) >= 0; });
  }

  // English phrasing for an item; a complaint may replace it (`item_ask`) when the shared
  // wording does not fit (e.g. "Have you had pain like this before?" for diarrhea).
  function itemAsk(complaint, item) {
    var own = complaint && complaint.item_ask && complaint.item_ask[item.id];
    return own || item.ask || [];
  }

  // Item label; a complaint may replace it (`item_label`), e.g. "Systemic" instead of
  // "Systemic / hepatobiliary" when only the systemic options are shown.
  function itemLabel(complaint, item) {
    return (complaint && complaint.item_label && complaint.item_label[item.id]) || item.label;
  }

  // A disease feature takes part in a complaint only if its item is shown there and at least
  // one of its options is offered (DESIGN 4.6: diseases shared by several complaints).
  function featureShown(feature, complaint) {
    var shown = shownItems(complaint);
    if (!shown) return true;
    if (!shown[feature.item]) return false;
    var sub = complaint.item_options && complaint.item_options[feature.item];
    return !sub || feature.options.some(function (o) { return sub.indexOf(o) >= 0; });
  }

  // ---------- selection ----------

  function toggle(state, item, optId) {
    var sel = state[item.id] || (state[item.id] = {});
    var k;
    if (item.type === 'presence') {
      var v = sel[optId];
      if (!v) sel[optId] = 'present';
      else if (v === 'present') sel[optId] = 'absent';
      else delete sel[optId];
    } else if (item.type === 'single') {
      var had = !!sel[optId];
      for (k in sel) delete sel[k];
      if (!had) sel[optId] = true;
    } else {
      if (sel[optId]) {
        delete sel[optId];
      } else {
        var exclusive = !!item.optById[optId].exclusive;
        for (k in sel) {
          if (exclusive || item.optById[k].exclusive) delete sel[k];
        }
        sel[optId] = true;
      }
    }
    if (Object.keys(sel).length === 0) delete state[item.id];
    return state;
  }

  function isEmpty(state) {
    return Object.keys(state).length === 0;
  }

  // Starting selections for a new patient, from the complaint's `defaults` ({ item: [option ids] }).
  function defaultState(complaint, items) {
    var s = {};
    var d = (complaint && complaint.defaults) || {};
    Object.keys(d).forEach(function (iid) {
      var item = items[iid];
      if (!item) return;
      d[iid].forEach(function (oid) {

      });
    });
    return s;
  }

  function sameState(a, b) {
    var ka = Object.keys(a);
    if (ka.length !== Object.keys(b).length) return false;
    return ka.every(function (iid) {
      var sa = a[iid];
      var sb = b[iid];
      if (!sb) return false;
      var oa = Object.keys(sa);
      return oa.length === Object.keys(sb).length && oa.every(function (oid) { return sa[oid] === sb[oid]; });
    });
  }

  // True when nothing has been selected beyond the complaint's defaults.
  function isPristine(state, complaint, items) {
    return sameState(state, defaultState(complaint, items));
  }

  // Selected options of an item, in the item's option order.
  function selectedOptions(item, state) {
    var sel = state[item.id];
    if (!sel) return [];
    return item.options.filter(function (o) { return !!sel[o.id]; });
  }

  // ---------- disease feature comparison ----------

  // feature: { item, options: [...], state?: 'present' | 'absent' }
  // returns 'match' | 'different' | 'none'
  function featureStatus(feature, state, items) {
    var sel = state[feature.item];
    var item = items[feature.item];
    if (!sel || !item) return 'none';
    var i;
    if (item.type === 'presence') {
      // "item = a | b"    → any of a, b present = match
      // "item = no a | b" → none of a, b present (at least one marked absent) = match
      var present = false;
      var absent = false;
      for (i = 0; i < feature.options.length; i++) {
        var v = sel[feature.options[i]];
        if (v === 'present') present = true;
        else if (v === 'absent') absent = true;
      }
      if (feature.state === 'absent') return present ? 'different' : (absent ? 'match' : 'none');
      return present ? 'match' : (absent ? 'different' : 'none');
    }
    for (i = 0; i < feature.options.length; i++) {
      if (sel[feature.options[i]]) return 'match';
    }
    return 'different';
  }

  // Human-readable description of what is currently selected for a feature's item
  // (used to explain an orange "Different" status).
  function describeSelection(feature, state, items) {
    var item = items[feature.item];
    var sel = state[feature.item];
    if (!item || !sel) return '';
    if (item.type === 'presence') {
      return feature.options
        .filter(function (o) { return sel[o]; })
        .map(function (o) { return (sel[o] === 'present' ? '+ ' : '− ') + item.optById[o].label; })
        .join(', ');
    }
    return selectedOptions(item, state).map(function (o) { return o.label; }).join(', ');
  }

  // All comparable features; with a complaint, only those that take part in it.
  function diseaseFeatures(disease, complaint) {
    var all = (disease.symptoms || []).concat(disease.pe || []);
    return complaint ? all.filter(function (f) { return featureShown(f, complaint); }) : all;
  }

  function matchCount(disease, state, items, complaint) {
    return diseaseFeatures(disease, complaint).filter(function (f) {
      return featureStatus(f, state, items) === 'match';
    }).length;
  }

  // Time-course tags (acute / subacute / chronic) implied by the current selection.
  function selectedTimecourses(complaint, state, items) {
    var item = items[complaint.timecourse_item];
    var out = [];
    if (!item) return out;
    selectedOptions(item, state).forEach(function (o) {
      (o.tc || []).forEach(function (t) { if (out.indexOf(t) < 0) out.push(t); });
    });
    return out;
  }

  // 'match' | 'different' | 'none'
  function timecourseStatus(disease, selectedTc) {
    if (!selectedTc.length) return 'none';
    for (var i = 0; i < selectedTc.length; i++) {
      if ((disease.timecourse || []).indexOf(selectedTc[i]) >= 0) return 'match';
    }
    return 'different';
  }

  // Groups whose `options` intersect the selection of the complaint's `group_item`
  // (e.g. pain location, stool character) move to the top; otherwise the complaint's order is kept.
  // A presence group item counts only options marked present.
  function orderGroups(complaint, state) {
    var sel = state[complaint.group_item] || {};
    var promoted = [];
    var rest = [];
    complaint.ddx.forEach(function (g) {
      var hit = (g.options || []).some(function (l) { return sel[l] === true || sel[l] === 'present'; });
      (hit ? promoted : rest).push({ group: g, promoted: hit });
    });
    return promoted.concat(rest);
  }

  // Flat, de-duplicated disease list sorted by match count (high → low).
  // Ties keep the group order from orderGroups(), so promoted groups come first.
  // Returns [{ id, n, groups: [group label...] }].
  function rankByMatches(complaint, diseases, state, items) {
    var byId = {};
    var list = [];
    orderGroups(complaint, state).forEach(function (entry) {
      entry.group.diseases.forEach(function (id) {
        if (!byId[id]) {
          byId[id] = { id: id, n: matchCount(diseases[id], state, items, complaint), groups: [], order: list.length };
          list.push(byId[id]);
        }
        byId[id].groups.push(entry.group.group);
      });
    });
    list.sort(function (a, b) { return (b.n - a.n) || (a.order - b.order); });
    return list.map(function (x) { return { id: x.id, n: x.n, groups: x.groups }; });
  }

  // ---------- text generation ----------

  function joinList(arr, conj) {
    if (arr.length === 0) return '';
    if (arr.length === 1) return arr[0];
    if (conj === ',') return arr.join(', ');
    if (arr.length === 2) return arr[0] + ' ' + conj + ' ' + arr[1];
    return arr.slice(0, -1).join(', ') + ', ' + conj + ' ' + arr[arr.length - 1];
  }

  function applyTemplate(tpl, text) {
    return tpl ? tpl.replace('{}', text) : text;
  }

  // Renders one item reference into a list of text pieces.
  // mode: '' (default), '+' (present only), '-' (absent only), '*' (present and absent)
  function renderRef(item, mode, state) {
    var sel = state[item.id];
    if (!sel) return [];
    if (item.type === 'presence') {
      var pos = [];
      var neg = [];
      item.options.forEach(function (o) {
        if (sel[o.id] === 'present') pos.push(o.frag);
        else if (sel[o.id] === 'absent') neg.push(mode === '-' ? o.frag : (o.frag_neg || 'no ' + o.frag));
      });
      if (mode === '+') return pos;
      if (mode === '-') return neg;
      // '*' (and default): positive findings first, then negatives — avoids "no A, B" ambiguity
      var all = pos.concat(neg);
      return all.length ? [joinList(all, item.join || 'and')] : [];
    }
    var opts = selectedOptions(item, state);
    if (!opts.length) return [];
    var normal = opts.filter(function (o) { return !o.exclusive; }).map(function (o) { return o.frag; });
    var excl = opts.filter(function (o) { return o.exclusive; }).map(function (o) { return o.frag; });
    var pieces = [];
    if (normal.length) pieces.push(applyTemplate(item.template, joinList(normal, item.join || 'and')));
    return pieces.concat(excl);
  }

  // Parses a template string into tokens:
  //   { t: 'text', v } | { t: 'ph', refs: [{id, mode}], def } | { t: 'var', name } | { t: 'opt', tokens: [...] }
  function parseTemplate(tpl) {
    var tokens = [];
    var stack = [tokens];
    var cur = tokens;
    var buf = '';
    function flush() { if (buf) { cur.push({ t: 'text', v: buf }); buf = ''; } }
    for (var i = 0; i < tpl.length; i++) {
      var c = tpl[i];
      if (c === '[') {
        flush();
        var seg = { t: 'opt', tokens: [] };
        cur.push(seg);
        stack.push(seg.tokens);
        cur = seg.tokens;
      } else if (c === ']') {
        flush();
        stack.pop();
        cur = stack[stack.length - 1];
      } else if (c === '{') {
        flush();
        var end = tpl.indexOf('}', i);
        cur.push(parsePlaceholder(tpl.slice(i + 1, end)));
        i = end;
      } else {
        buf += c;
      }
    }
    flush();
    return tokens;
  }

  function parsePlaceholder(body) {
    // {@name}: a value supplied by the page (e.g. today's date), not an item.
    if (body.charAt(0) === '@') return { t: 'var', name: body.slice(1).trim() };
    var bar = body.indexOf('|');
    var def = bar >= 0 ? body.slice(bar + 1) : null;
    var refs = (bar >= 0 ? body.slice(0, bar) : body).split(',').map(function (r) {
      r = r.trim();
      var last = r.charAt(r.length - 1);
      if (last === '+' || last === '-' || last === '*') return { id: r.slice(0, -1), mode: last };
      return { id: r, mode: '' };
    });
    return { t: 'ph', refs: refs, def: def };
  }

  function renderPlaceholder(ph, state, items) {
    var pieces = [];
    var conj = null;
    ph.refs.forEach(function (r) {
      var item = items[r.id];
      if (!item) return;
      pieces = pieces.concat(renderRef(item, r.mode, state));
      if (conj === null) {
        conj = r.mode === '-' ? 'or' : (r.mode === '+' ? 'and' : (item.join || 'and'));
      }
    });
    return joinList(pieces, conj || 'and');
  }

  // Returns { text, ok, filled }:
  //   ok     — false when a required placeholder (outside [...] and without default) is empty
  //   filled — true when at least one placeholder produced real (non-default) content
  // vars: values for {@name}; they act like fixed text and never count as "filled".
  function renderTokens(tokens, state, items, vars) {
    var text = '';
    var ok = true;
    var filled = false;
    tokens.forEach(function (tk) {
      if (tk.t === 'text') {
        text += tk.v;
      } else if (tk.t === 'var') {
        text += (vars && vars[tk.name]) || '';
      } else if (tk.t === 'ph') {
        var v = renderPlaceholder(tk, state, items);
        if (v) { text += v; filled = true; }
        else if (tk.def !== null) text += tk.def;
        else ok = false;
      } else {
        var sub = renderTokens(tk.tokens, state, items, vars);
        if (sub.ok && sub.filled) { text += sub.text; filled = true; }
      }
    });
    return { text: text, ok: ok, filled: filled };
  }

  var templateCache = {};
  function renderTemplate(tpl, state, items, vars) {
    var tokens = templateCache[tpl] || (templateCache[tpl] = parseTemplate(tpl));
    return renderTokens(tokens, state, items, vars);
  }

  function pad2(n) {
    return (n < 10 ? '0' : '') + n;
  }

  // Taiwan (ROC / Minguo) date: year - 1911, zero-padded month and day, e.g. 115/01/05.
  function rocDate(d) {
    return (d.getFullYear() - 1911) + '/' + pad2(d.getMonth() + 1) + '/' + pad2(d.getDate());
  }

  // Values available to templates as {@name}.
  function textVars(now) {
    return { date_roc: rocDate(now) };
  }

  function capitalize(s) {
    return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  }

  // spec: { joiner, sentences: [{ lead?, parts: [tpl...], sep?, end?, always? }] }
  // vars: optional values for {@name} placeholders (see textVars)
  function composeText(spec, state, items, vars) {
    var out = [];
    (spec.sentences || []).forEach(function (s) {
      var parts = [];
      var filled = false;
      s.parts.forEach(function (p) {
        var r = renderTemplate(p, state, items, vars);
        if (!r.ok) return;
        if (r.filled) filled = true;
        if (r.text.trim()) parts.push(r.text.trim());
      });
      if (!parts.length || (!filled && !s.always)) return;
      var sep = s.sep === undefined ? ', ' : s.sep;
      var end = s.end === undefined ? '.' : s.end;
      out.push(capitalize((s.lead || '') + parts.join(sep) + end));
    });
    return out.join(spec.joiner === undefined ? ' ' : spec.joiner);
  }

  // ---------- shared state (localStorage, both pages) ----------

  // localStorage keys. The patient state is shared by dist/POMD.html and dist/POMD-history.html
  // (same file:// origin in Edge / Chrome) and kept until "New patient".
  var STATE_KEY = 'pomd.patient.v1';
  var LAYOUT_KEY = 'pomd.quickLayout.v1';

  // Keeps only known items / options with values valid for the item type.
  function sanitizeState(raw, items) {
    var out = {};
    if (!raw || typeof raw !== 'object') return out;
    Object.keys(raw).forEach(function (iid) {
      var item = items[iid];
      var sel = raw[iid];
      if (!item || !sel || typeof sel !== 'object') return;
      var clean = {};
      Object.keys(sel).forEach(function (oid) {
        if (!item.optById[oid]) return;
        var v = sel[oid];
        if (item.type === 'presence' ? (v === 'present' || v === 'absent') : v === true) clean[oid] = v;
      });
      if (item.type === 'single' && Object.keys(clean).length > 1) return;
      if (Object.keys(clean).length) out[iid] = clean;
    });
    return out;
  }

  // Parses the stored patient JSON -> { complaint, state } or null.
  function parseStoredState(json, items) {
    if (!json) return null;
    var raw;
    try { raw = JSON.parse(json); } catch (e) { return null; }
    if (!raw || typeof raw !== 'object' || typeof raw.complaint !== 'string') return null;
    return { complaint: raw.complaint, state: sanitizeState(raw.state, items) };
  }

  function serializeState(complaintId, state) {
    return JSON.stringify({ complaint: complaintId, state: state });
  }

  // Saved question order for one complaint, restricted to that complaint's history items.
  function sanitizeOrder(order, complaint) {
    if (!Array.isArray(order)) return null;
    var allowed = [];
    complaint.history.forEach(function (sec) { allowed = allowed.concat(sec.items); });
    var out = [];
    order.forEach(function (id) {
      if (allowed.indexOf(id) >= 0 && out.indexOf(id) < 0) out.push(id);
    });
    return out;
  }

  var api = {
    STATE_KEY: STATE_KEY,
    LAYOUT_KEY: LAYOUT_KEY,
    sanitizeState: sanitizeState,
    parseStoredState: parseStoredState,
    serializeState: serializeState,
    sanitizeOrder: sanitizeOrder,
    prepare: prepare,
    shownItems: shownItems,
    itemOptions: itemOptions,
    itemAsk: itemAsk,
    itemLabel: itemLabel,
    itemDetails: itemDetails,
    detailsSummary: detailsSummary,
    featureShown: featureShown,
    toggle: toggle,
    isEmpty: isEmpty,
    defaultState: defaultState,
    sameState: sameState,
    isPristine: isPristine,
    selectedOptions: selectedOptions,
    featureStatus: featureStatus,
    describeSelection: describeSelection,
    diseaseFeatures: diseaseFeatures,
    matchCount: matchCount,
    selectedTimecourses: selectedTimecourses,
    timecourseStatus: timecourseStatus,
    orderGroups: orderGroups,
    rankByMatches: rankByMatches,
    joinList: joinList,
    renderTemplate: renderTemplate,
    rocDate: rocDate,
    textVars: textVars,
    composeText: composeText
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.POMDCore = api;
})(this);

</script>
<script>
/*
 * POMD browser UI. All clinical content comes from window.POMD_DATA (built from data/);
 * all matching / text logic lives in core.js (window.POMDCore).
 * The current patient's selections are kept in localStorage (Core.STATE_KEY) and shared live with
 * the quick history page (dist/POMD-history.html); "New patient" clears them on both pages.
 */
(function () {
  'use strict';

  var Core = window.POMDCore;
  var DATA = Core.prepare(window.POMD_DATA);
  var items = DATA.items;
  var diseases = DATA.diseases;

  var complaint = DATA.complaints[0];
  var state = {};
  var openDiseaseId = null;
  var ddxSort = 'group'; // 'group' | 'matches' — a view preference, kept across New patient
  var clearArmTimer = null;

  var TC_SHORT = { acute: 'A', subacute: 'S', chronic: 'C' };
  var STATUS_ICON = { match: '✓', different: '≠', none: '○' };
  var STATUS_LABEL = { match: 'Match', different: 'Different', none: 'Not asked' };

  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ---------- shared patient state (localStorage) ----------

  // Storage may be unavailable (e.g. blocked, or Firefox isolating file:// pages); the page still works alone.
  function storageGet(key) {
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  }

  function storageSet(key, value) {
    try {
      if (value === null) window.localStorage.removeItem(key);
      else window.localStorage.setItem(key, value);
    } catch (e) { /* ignore */ }
  }

  function saveState() {
    // Nothing stored while only the defaults are selected (a missing entry means "new patient").
    storageSet(Core.STATE_KEY, pristine() ? null : Core.serializeState(complaint.id, state));
  }

  function pristine() {
    return Core.isPristine(state, complaint, items);
  }

  // Loads the stored patient (switching complaint if needed); nothing stored or unknown complaint
  // -> the current complaint's defaults.
  function loadState(json) {
    var s = Core.parseStoredState(json, items);
    var c = s && DATA.complaints.filter(function (x) { return x.id === s.complaint; })[0];
    if (c && c !== complaint) {
      complaint = c;
      $('complaint-select').value = c.id;
      buildLayout();
    }
    state = c ? s.state : Core.defaultState(complaint, items);
  }

  // ---------- static layout (rebuilt when the complaint changes) ----------

  // Collapsible sub-items of an item (closed by default; see updateChips for auto-open).
  function detailsHtml(itemId, blockHtml) {
    var det = Core.itemDetails(complaint, itemId);
    if (!det) return '';
    var h = '<details class="details" data-details="' + esc(itemId) + '"><summary><span class="details-label">' +
      esc(det.label) + '</span><span class="details-summary"></span></summary>';
    if (det.note) h += '<p class="details-note">' + esc(det.note) + '</p>';
    det.items.forEach(function (id) { h += blockHtml(id); });
    return h + '</details>';
  }

  function itemBlockHtml(itemId) {
    var item = items[itemId];
    var kind = item.type === 'multi' ? 'multi' : (item.type === 'presence' ? '+ / −' : '');
    var h = '<div class="item" data-item-block="' + esc(item.id) + '">';
    h += '<div class="item-head"><span class="item-label">' + esc(Core.itemLabel(complaint, item)) + '</span>';
    if (kind) h += '<span class="item-kind">' + kind + '</span>';
    h += '<button type="button" class="item-clear" data-clear="' + esc(item.id) + '" title="Clear this item">clear</button></div>';
    var ask = Core.itemAsk(complaint, item);
    if (ask.length) {
      h += '<ul class="ask">';
      ask.forEach(function (q) { h += '<li>' + esc(q) + '</li>'; });
      h += '</ul>';
    }
    h += '<div class="chips ' + item.type + '">';
    Core.itemOptions(complaint, item).forEach(function (o) {
      h += '<button type="button" class="chip' + (o.red_flag ? ' rf' : '') + '" data-item="' + esc(item.id) +
        '" data-opt="' + esc(o.id) + '"' + (o.red_flag ? ' title="Red flag"' : '') + '>' + esc(o.label) + '</button>';
    });
    h += '</div>' + detailsHtml(itemId, itemBlockHtml) + '</div>';
    return h;
  }

  function sectionsHtml(sections) {
    var h = '';
    sections.forEach(function (sec) {
      h += '<div class="section"><h3>' + esc(sec.section) + '</h3>';
      sec.items.forEach(function (id) { h += itemBlockHtml(id); });
      h += '</div>';
    });
    return h;
  }

  function suggestHtml(list) {
    return list.map(function (x) {
      return '<li><span class="s-name">' + esc(x.name) + '</span>' +
        (x.note ? '<span class="s-note">' + esc(x.note) + '</span>' : '') + '</li>';
    }).join('');
  }

  function buildLayout() {
    $('history').innerHTML = sectionsHtml(complaint.history);
    $('pe').innerHTML = sectionsHtml(complaint.pe);
    $('labs').innerHTML = suggestHtml(complaint.labs);
    $('imaging').innerHTML = suggestHtml(complaint.imaging);
  }

  function buildComplaintSelect() {
    var sel = $('complaint-select');
    sel.innerHTML = DATA.complaints.map(function (c) {
      return '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>';
    }).join('');
    sel.value = complaint.id;
  }

  // ---------- dynamic rendering ----------

  function updateChips() {
    var chips = document.querySelectorAll('.chip');
    for (var i = 0; i < chips.length; i++) {
      var c = chips[i];
      var v = (state[c.getAttribute('data-item')] || {})[c.getAttribute('data-opt')];
      c.classList.toggle('on', v === true);
      c.classList.toggle('present', v === 'present');
      c.classList.toggle('absent', v === 'absent');
      c.setAttribute('aria-pressed', v ? 'true' : 'false');
    }
    var blocks = document.querySelectorAll('[data-item-block]');
    for (var j = 0; j < blocks.length; j++) {
      blocks[j].classList.toggle('answered', !!state[blocks[j].getAttribute('data-item-block')]);
    }
    var dets = document.querySelectorAll('[data-details]');
    for (var k = 0; k < dets.length; k++) {
      var det = Core.itemDetails(complaint, dets[k].getAttribute('data-details'));
      var sum = det ? Core.detailsSummary(det, state, items) : '';
      dets[k].querySelector('.details-summary').textContent = sum;
      // Open when something inside gets selected (on load, or synced from the other page).
      if (sum && !dets[k].getAttribute('data-had')) dets[k].open = true;
      dets[k].setAttribute('data-had', sum ? '1' : '');
    }
  }

  function dxHtml(id, n, tcSel, groups) {
    var d = diseases[id];
    var cls = 'dx' + (n ? ' hit' : '') + (openDiseaseId === id ? ' open' : '');
    var h = '<li><button type="button" class="' + cls + '" data-disease="' + esc(id) + '"' +
      (d.must_not_miss ? ' title="Must-not-miss"' : '') + '>';
    h += '<span class="dx-name">' + esc(d.name);
    if (groups) h += '<span class="dx-groups">' + esc(groups.join(' \u00B7 ')) + '</span>';
    h += '</span><span class="dx-meta">';
    d.timecourse.forEach(function (t) {
      h += '<span class="tc' + (tcSel.indexOf(t) >= 0 ? ' on' : '') + '" title="' + t + '">' + TC_SHORT[t] + '</span>';
    });
    if (n) h += '<b class="count" title="typical features selected">' + n + '</b>';
    return h + '</span></button></li>';
  }

  function renderDdx() {
    var tcSel = Core.selectedTimecourses(complaint, state, items);
    var h = '';
    if (ddxSort === 'matches') {
      h += '<div class="group"><ul>';
      Core.rankByMatches(complaint, diseases, state, items).forEach(function (x) {
        h += dxHtml(x.id, x.n, tcSel, x.groups);
      });
      h += '</ul></div>';
    } else {
      Core.orderGroups(complaint, state).forEach(function (entry) {
        var g = entry.group;
        h += '<div class="group' + (entry.promoted ? ' promoted' : '') + '"><h3>' + esc(g.group) + '</h3><ul>';
        g.diseases.forEach(function (id) {
          h += dxHtml(id, Core.matchCount(diseases[id], state, items, complaint), tcSel, null);
        });
        h += '</ul></div>';
      });
    }
    $('ddx').innerHTML = h;
    var segs = document.querySelectorAll('[data-sort]');
    for (var i = 0; i < segs.length; i++) {
      var on = segs[i].getAttribute('data-sort') === ddxSort;
      segs[i].classList.toggle('on', on);
      segs[i].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  }

  function featureListHtml(all) {
    var features = all.filter(function (f) { return Core.featureShown(f, complaint); });
    if (!features.length) return '<p class="muted">—</p>';
    var h = '<ul class="feats">';
    features.forEach(function (f) {
      var st = Core.featureStatus(f, state, items);
      h += '<li class="feat ' + st + '" title="' + STATUS_LABEL[st] + '"><span class="ic">' + STATUS_ICON[st] + '</span><span>' + esc(f.text);
      if (st === 'different') {
        h += '<span class="selected-now">selected: ' + esc(Core.describeSelection(f, state, items)) + '</span>';
      }
      h += '</span></li>';
    });
    return h + '</ul>';
  }

  function textListHtml(list) {
    if (!list.length) return '<p class="muted">—</p>';
    return '<ul class="plain">' + list.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>';
  }

  function renderCard() {
    var card = $('card');
    var d = openDiseaseId && diseases[openDiseaseId];
    if (!d) { card.hidden = true; card.innerHTML = ''; return; }
    var tcSel = Core.selectedTimecourses(complaint, state, items);
    var tcSt = Core.timecourseStatus(d, tcSel);
    var h = '<div class="card-head">';
    h += '<h2>' + esc(d.name) + '</h2>';
    h += '<button type="button" class="card-close" data-close-card title="Close (Esc)">×</button></div>';
    h += '<div class="card-badges">';
    if (d.must_not_miss) h += '<span class="badge mnm">Must-not-miss</span>';
    h += '<span class="badge status-' + esc(d.status) + '">' + esc(d.status) + '</span>';
    h += '<span class="badge tcb ' + tcSt + '" title="Typical time course vs. selected duration: ' + STATUS_LABEL[tcSt] + '">' +
      STATUS_ICON[tcSt] + ' ' + esc(d.timecourse.join(' / ')) + '</span></div>';
    h += '<p class="one-liner">' + esc(d.one_liner) + '</p>';
    h += '<p class="legend-feats"><span class="feat match"><span class="ic">' + STATUS_ICON.match + '</span>Match</span>' +
      '<span class="feat none"><span class="ic">' + STATUS_ICON.none + '</span>Not asked</span>' +
      '<span class="feat different"><span class="ic">' + STATUS_ICON.different + '</span>Different</span></p>';
    h += '<h3>Typical symptoms</h3>' + featureListHtml(d.symptoms);
    h += '<h3>Typical PE findings</h3>' + featureListHtml(d.pe);
    h += '<h3>Typical labs</h3>' + textListHtml(d.labs);
    h += '<h3>Recommended imaging / endoscopy</h3>' + textListHtml(d.imaging);
    h += '<h3>Pitfalls</h3>' + textListHtml(d.pitfalls);
    card.innerHTML = h;
    card.hidden = false;
  }

  function currentText() {
    return {
      hpi: pristine() ? '' : Core.composeText(complaint.hpi, state, items, Core.textVars(new Date())),
      pe: Core.composeText(complaint.pe_text, state, items)
    };
  }

  function renderOutput() {
    var t = currentText();
    var empty = pristine();
    $('out-hpi').textContent = empty ? '' : t.hpi;
    $('out-pe').textContent = t.pe;
    $('out-hpi').classList.toggle('placeholder', empty);
    $('out-pe').classList.toggle('placeholder', !t.pe);
  }

  function refresh() {
    updateChips();
    renderDdx();
    renderCard();
    renderOutput();
  }

  // ---------- actions ----------

  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      return Promise.resolve(ok);
    }
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, fallback);
    }
    return fallback();
  }

  function onCopy(which) {
    var t = currentText();
    var text = which === 'hpi' ? t.hpi : which === 'pe' ? t.pe : [t.hpi, t.pe].filter(Boolean).join('\n\n');
    var status = $('copy-status');
    if (!text) {
      status.textContent = 'Nothing to copy';
      return;
    }
    copyText(text).then(function (ok) {
      status.textContent = ok ? 'Copied ✓' : 'Copy failed — select the text and press Ctrl+C';
      status.className = ok ? 'ok' : 'fail';
      setTimeout(function () { status.textContent = ''; status.className = ''; }, 2500);
    });
  }

  function disarmClear() {
    var btn = $('btn-new');
    btn.classList.remove('armed');
    btn.textContent = 'New patient';
    clearTimeout(clearArmTimer);
    clearArmTimer = null;
  }

  // Opens the quick history page, or switches to it if it is already open in this window group.
  // Both pages share the patient through localStorage, so nothing needs to be passed.
  function openQuick() {
    var w = null;
    try { w = window.open('', 'pomd-quick'); } catch (e) { w = null; }
    var blank = true;
    try { blank = !w || w.location.href === 'about:blank'; } catch (e) { blank = true; }
    if (!w) {
      window.location.href = 'POMD-history.html';
    } else if (blank) {
      w.location.href = new URL('POMD-history.html', window.location.href).href;
    }
    if (w) w.focus();
  }

  // First click arms the button (only if something is selected); second click within 3 s clears.
  function onNewPatient() {
    var btn = $('btn-new');
    if (!pristine() && !clearArmTimer) {
      btn.classList.add('armed');
      btn.textContent = 'Click again to clear';
      clearArmTimer = setTimeout(disarmClear, 3000);
      return;
    }
    disarmClear();
    state = Core.defaultState(complaint, items);
    openDiseaseId = null;
    saveState();
    ['col-history', 'col-pe', 'col-ddx'].forEach(function (id) { $(id).scrollTop = 0; });
    refresh();
  }

  function setComplaint(id) {
    complaint = DATA.complaints.filter(function (c) { return c.id === id; })[0] || DATA.complaints[0];
    state = Core.defaultState(complaint, items);
    openDiseaseId = null;
    saveState();
    buildLayout();
    refresh();
  }

  function onClick(ev) {
    var t = ev.target.closest('button');
    if (!t) return;
    if (t.hasAttribute('data-opt')) {
      Core.toggle(state, items[t.getAttribute('data-item')], t.getAttribute('data-opt'));
      saveState();
      refresh();
    } else if (t.hasAttribute('data-clear')) {
      delete state[t.getAttribute('data-clear')];
      saveState();
      refresh();
    } else if (t.hasAttribute('data-disease')) {
      var id = t.getAttribute('data-disease');
      openDiseaseId = openDiseaseId === id ? null : id;
      renderDdx();
      renderCard();
      if (openDiseaseId) $('card').scrollTop = 0;
    } else if (t.hasAttribute('data-close-card')) {
      openDiseaseId = null;
      renderDdx();
      renderCard();
    } else if (t.hasAttribute('data-sort')) {
      ddxSort = t.getAttribute('data-sort');
      renderDdx();
    } else if (t.hasAttribute('data-copy')) {
      onCopy(t.getAttribute('data-copy'));
    } else if (t.id === 'btn-new') {
      onNewPatient();
    } else if (t.id === 'btn-quick') {
      openQuick();
    }
  }

  // The disease card is positioned below the (possibly wrapped) top bar.
  function syncTopHeight() {
    document.documentElement.style.setProperty('--top-h', $('topbar').offsetHeight + 'px');
  }

  function init() {
    syncTopHeight();
    window.addEventListener('resize', syncTopHeight);
    // The quick history page's Submit targets this window by name.
    window.name = 'pomd-main';
    buildComplaintSelect();
    buildLayout();
    loadState(storageGet(Core.STATE_KEY));
    window.addEventListener('storage', function (ev) {
      if (ev.key !== Core.STATE_KEY && ev.key !== null) return;
      loadState(ev.key === null ? null : ev.newValue);
      disarmClear();
      refresh();
    });
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && openDiseaseId) {
        openDiseaseId = null;
        renderDdx();
        renderCard();
      }
    });
    var ask = $('toggle-ask');
    ask.checked = false;
    ask.addEventListener('change', function () {
      document.body.classList.toggle('show-ask', this.checked);
    });
    $('complaint-select').addEventListener('change', function () { setComplaint(this.value); });
    refresh();
  }

  init();
})();

</script>
</body>
</html>
