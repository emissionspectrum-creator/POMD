<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POMD — Chief complaint work-up</title>
<style>
/* POMD styles — no external fonts or resources (must work offline from file://). */

:root {
  --bg: #f3f5f7;
  --panel: #ffffff;
  --line: #d8dde3;
  --text: #1f2933;
  --muted: #6b7785;
  --brand: #1f3a5f;
  --sel: #2563eb;
  --sel-bg: #dbe7ff;
  --present: #15803d;
  --present-bg: #dcfce7;
  --absent: #9f1239;
  --absent-bg: #fde7ec;
  --hit-bg: #fff3c4;
  --hit-line: #e0a800;
  --mnm: #c62828;
  --match: #2e7d32;
  --match-bg: #e8f5e9;
  --diff: #c2410c;
  --diff-bg: #fff1e6;
  --none: #8a94a0;
  --footer-h: 160px;
}

* { box-sizing: border-box; }

html, body { margin: 0; height: 100%; }

body {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) var(--footer-h);
  height: 100vh;
  font: 14px/1.4 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
  color: var(--text);
  background: var(--bg);
}

button { font: inherit; cursor: pointer; }

/* ---------- top bar ---------- */

#topbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
  padding: 6px 12px;
  background: var(--brand);
  color: #fff;
}
.brand { font-weight: 700; letter-spacing: 0.06em; }
.ctl { display: inline-flex; align-items: center; gap: 6px; }
.ctl select { font: inherit; padding: 2px 4px; }
.spacer { flex: 1; }
.version { font-size: 11px; opacity: 0.7; }

.btn {
  border: 1px solid #b8c2cc;
  background: #fff;
  color: var(--text);
  border-radius: 4px;
  padding: 3px 10px;
}
.btn:hover { background: #eef2f6; }
.btn.primary { background: var(--sel); border-color: var(--sel); color: #fff; font-weight: 600; }
.btn.primary:hover { background: #1d4fd8; }
.btn.small { padding: 0 6px; font-size: 12px; }
#btn-new.armed { background: #fee2e2; border-color: var(--mnm); color: var(--mnm); font-weight: 600; }

/* ---------- columns ---------- */

#cols {
  display: grid;
  grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 0.95fr);
  min-height: 0;
}
.col {
  overflow-y: auto;
  padding: 6px 12px 24px;
  background: var(--panel);
  border-right: 1px solid var(--line);
}
.col:last-child { border-right: 0; background: #fbfcfd; }

h2 {
  font-size: 15px;
  margin: 10px 0 4px;
  color: var(--brand);
  border-bottom: 2px solid var(--brand);
  padding-bottom: 2px;
}
h2 .seg { float: right; display: inline-flex; font-size: 11px; font-weight: 400; }
.seg button {
  border: 1px solid #b8c2cc;
  background: #fff;
  color: var(--text);
  padding: 0 7px;
  line-height: 1.6;
}
.seg button:first-child { border-radius: 4px 0 0 4px; }
.seg button:last-child { border-radius: 0 4px 4px 0; border-left: 0; }
.seg button.on { background: var(--brand); border-color: var(--brand); color: #fff; }
h2 .sub { font-size: 11px; font-weight: 400; color: var(--muted); }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 10px 0 2px; }

.hint { font-size: 11px; color: var(--muted); margin: 2px 0 4px; }

/* ---------- items & chips ---------- */

.item { padding: 3px 0 5px; border-bottom: 1px dotted #e3e7ec; }
.item-head { display: flex; align-items: baseline; gap: 6px; }
.item-label { font-weight: 600; font-size: 13px; }
.item.answered > .item-head .item-label { color: var(--sel); }
.item-kind { font-size: 10px; color: var(--muted); border: 1px solid #d0d6dd; border-radius: 3px; padding: 0 3px; }
.item-clear {
  margin-left: auto;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 11px;
  padding: 0 2px;
  visibility: hidden;
}
.item.answered > .item-head .item-clear { visibility: visible; }
.item-clear:hover { color: var(--mnm); text-decoration: underline; }

.ask { display: none; margin: 1px 0 3px; padding-left: 16px; font-size: 12px; font-style: italic; color: #36557a; }
.show-ask .ask { display: block; }

.chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
.details { margin: 4px 0 0 10px; border-left: 2px solid #d0d6dd; padding-left: 8px; }
.details > summary { cursor: pointer; font-size: 12px; color: var(--muted); list-style-position: inside; }
.details > summary:hover { color: var(--sel); }
.details-label { font-weight: 600; }
.details-summary { margin-left: 8px; color: var(--sel); }
.details-note { margin: 3px 0; font-size: 11.5px; color: var(--muted); }
.details .item:last-child { border-bottom: 0; }
.chip {
  border: 1px solid #c3ccd6;
  background: #fff;
  color: var(--text);
  border-radius: 12px;
  padding: 1px 9px;
  font-size: 12.5px;
  line-height: 1.5;
}
.chip:hover { border-color: var(--sel); }
.chip.rf::after { content: "!"; color: var(--mnm); font-weight: 700; margin-left: 3px; }
.chip.on { background: var(--sel); border-color: var(--sel); color: #fff; }
.chip.on.rf::after { color: #ffd6d6; }
.chip.present { background: var(--present-bg); border-color: var(--present); color: var(--present); font-weight: 600; }
.chip.present::before { content: "+ "; }
.chip.absent { background: var(--absent-bg); border-color: var(--absent); color: var(--absent); text-decoration: line-through; }
.chip.absent::before { content: "\2212  "; display: inline-block; text-decoration: none; }
.chips.single .chip { border-radius: 4px; }

/* ---------- suggestion lists ---------- */

.suggest { margin: 2px 0 8px; padding-left: 16px; font-size: 12.5px; }
.suggest li { margin: 1px 0; }
.s-note { color: var(--muted); font-size: 11.5px; }
.s-note::before { content: " — "; }

/* ---------- differential ---------- */

.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.lg.hit { background: var(--hit-bg); padding: 0 4px; border-radius: 3px; }

.group { margin-bottom: 4px; }
.group h3 { margin-top: 8px; }
.group.promoted h3 { color: var(--sel); }
.group.promoted h3::after { content: "  \2190 location"; font-size: 10px; text-transform: none; letter-spacing: 0; }
.group ul { list-style: none; margin: 0; padding: 0; }

.dx {
  display: flex;
  align-items: center;
  width: 100%;
  gap: 6px;
  text-align: left;
  border: 1px solid transparent;
  border-left: 3px solid transparent;
  background: none;
  padding: 2px 6px;
  border-radius: 3px;
  color: var(--text);
}
.dx:hover { background: #eef2f6; }
.dx-groups { display: block; font-size: 10.5px; font-weight: 400; color: var(--muted); }
.dx.hit { background: var(--hit-bg); border-left-color: var(--hit-line); }
.dx.open { border-color: var(--sel); border-left-color: var(--sel); }
.dx-name { flex: 1; }
.dx-meta { display: inline-flex; align-items: center; gap: 2px; }

.tc {
  display: inline-block;
  min-width: 15px;
  text-align: center;
  font-size: 10px;
  font-weight: 600;
  color: var(--none);
  border: 1px solid #cfd5dc;
  border-radius: 3px;
  padding: 0 2px;
  margin-left: 1px;
}
.tc.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.count {
  display: inline-block;
  min-width: 18px;
  text-align: center;
  background: var(--hit-line);
  color: #fff;
  border-radius: 9px;
  font-size: 11px;
  padding: 0 4px;
  margin-left: 3px;
}

/* ---------- disease card ---------- */

#card {
  position: fixed;
  top: var(--top-h, 40px);
  right: 0;
  bottom: var(--footer-h);
  width: min(480px, 40vw);
  min-width: 340px;
  overflow-y: auto;
  background: #fff;
  border-left: 3px solid var(--sel);
  box-shadow: -6px 0 18px rgba(0, 0, 0, 0.18);
  padding: 8px 14px 24px;
  z-index: 10;
}
#card[hidden] { display: none; }
.card-head { display: flex; align-items: flex-start; gap: 8px; }
.card-head h2 { flex: 1; border: 0; margin: 4px 0; font-size: 17px; }
.card-close { border: 0; background: none; font-size: 22px; line-height: 1; color: var(--muted); padding: 0 4px; }
.card-close:hover { color: var(--text); }
.card-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
.badge { font-size: 11px; border-radius: 3px; padding: 0 5px; border: 1px solid #cfd5dc; color: var(--muted); }
.badge.mnm { background: #e9edf2; border-color: #9aa5b1; color: var(--text); }
.badge.status-draft { background: #f1f3f5; }
.badge.status-reviewed { background: var(--match-bg); color: var(--match); border-color: var(--match); }
.badge.tcb.match { background: var(--match-bg); color: var(--match); border-color: var(--match); }
.badge.tcb.different { background: var(--diff-bg); color: var(--diff); border-color: var(--diff); }
.one-liner { margin: 4px 0 6px; font-size: 13.5px; }
#card h3 { margin-top: 12px; border-bottom: 1px solid var(--line); }

.legend-feats { display: flex; gap: 10px; font-size: 11px; margin: 0; }
.feats, .plain { margin: 3px 0; padding: 0; list-style: none; font-size: 13px; }
.plain { padding-left: 16px; list-style: disc; }
.plain li { margin: 2px 0; }
.feat { display: flex; gap: 6px; padding: 2px 4px; border-radius: 3px; margin: 1px 0; color: var(--none); }
.feat .ic { width: 14px; flex: none; text-align: center; font-weight: 700; }
.feat.match { background: var(--match-bg); color: var(--match); }
.feat.different { background: var(--diff-bg); color: var(--diff); }
.legend-feats .feat { padding: 0 4px; }
.selected-now { display: block; font-size: 11px; opacity: 0.9; }
.muted { color: var(--muted); }

/* ---------- output ---------- */

#output {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto;
  gap: 8px;
  padding: 6px 12px;
  background: #e9edf2;
  border-top: 1px solid #c3ccd6;
  min-height: 0;
}
.out-box { display: flex; flex-direction: column; min-height: 0; }
.out-head { font-size: 12px; font-weight: 700; color: var(--brand); display: flex; gap: 8px; align-items: center; margin-bottom: 2px; }
.out-text {
  flex: 1;
  overflow-y: auto;
  background: #fff;
  border: 1px solid #c3ccd6;
  border-radius: 3px;
  padding: 4px 8px;
  font-size: 13px;
  white-space: pre-wrap;
  user-select: text;
}
.out-text.placeholder::before { content: "Selections will appear here."; color: var(--muted); font-style: italic; }
.out-actions { display: flex; flex-direction: column; gap: 6px; justify-content: center; align-items: stretch; min-width: 140px; }
#copy-status { font-size: 12px; text-align: center; min-height: 1.4em; }
#copy-status.ok { color: var(--present); }
#copy-status.fail { color: var(--mnm); }

/* ---------- quick history page (dist/POMD-history.html) ---------- */

body.quick { --footer-h: 52px; }
.brand-sub { font-weight: 400; letter-spacing: 0; opacity: 0.8; }
.quick #cols { grid-template-columns: minmax(0, 1fr); }
.quick .col { border-right: 0; }
.quick-wrap { max-width: 900px; margin: 0 auto; }
/* hint | Submit (centered) | empty */
.quick #output { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; }
.quick #btn-submit { padding: 6px 18px; }
.quick-add { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.quick-add select { font: inherit; padding: 2px 4px; }
.item-edit { display: none; gap: 3px; }
.edit-only, .edit-hint { display: none; }
.editing .item-edit { display: inline-flex; }
.editing .edit-only { display: inline-block; }
.editing .edit-hint { display: block; }
.editing .item { background: #f7f9fb; }
.item-edit .btn:disabled { opacity: 0.35; cursor: default; }
.drag-handle { display: none; cursor: grab; color: var(--muted); padding: 0 2px; user-select: none; }
.editing .drag-handle { display: inline; }
.item.dragging { opacity: 0.4; }
.item.drop-before { box-shadow: inset 0 3px 0 var(--sel); }
.item.drop-after { box-shadow: inset 0 -3px 0 var(--sel); }

/* ---------- narrow screens (phone fallback) ---------- */

@media (max-width: 900px) {
  body { display: block; height: auto; }
  #cols { display: block; }
  .col { overflow: visible; border-right: 0; border-bottom: 1px solid var(--line); }
  #output { grid-template-columns: 1fr; position: sticky; bottom: 0; max-height: 45vh; overflow-y: auto; }
  .out-text { max-height: 18vh; }
  .chip { padding: 3px 10px; font-size: 13.5px; }
  #card { top: 0; bottom: 0; width: 100%; min-width: 0; z-index: 20; }
}

</style>
</head>
<body>
<header id="topbar">
  <span class="brand">POMD</span>
  <label class="ctl">Chief complaint
    <select id="complaint-select"></select>
  </label>
  <label class="ctl toggle"><input type="checkbox" id="toggle-ask"> Show English phrasing</label>
  <button type="button" id="btn-new" class="btn">New patient</button>
  <button type="button" id="btn-quick" class="btn" title="Open the quick history page (shares this patient)">Quick history</button>
  <span class="spacer"></span>
  <span class="version">v0.6.1 · built 2026-11-18</span>
</header>

<main id="cols">
  <section class="col" id="col-history">
    <h2>History</h2>
    <p class="hint">Click to select · click again to clear · <span class="hint-presence">symptoms: 1× present, 2× absent, 3× clear</span></p>
    <div id="history"></div>
  </section>
  <section class="col" id="col-pe">
    <h2>Physical exam</h2>
    <div id="pe"></div>
    <h2>Labs <span class="sub">suggested</span></h2>
    <ul id="labs" class="suggest"></ul>
    <h2>Imaging / Endoscopy <span class="sub">suggested</span></h2>
    <ul id="imaging" class="suggest"></ul>
  </section>
  <section class="col" id="col-ddx">
    <h2>Differential
      <span class="seg" role="group" aria-label="Sort differential">
        <button type="button" data-sort="group" class="on">By group</button><button type="button" data-sort="matches">By matches</button>
      </span>
    </h2>
    <p class="hint legend">
      <span class="lg hit">highlighted = typical feature selected <b class="count">n</b></span>
      <span class="lg">time course <span class="tc">A</span><span class="tc">S</span><span class="tc">C</span></span>
    </p>
    <div id="ddx"></div>
  </section>
</main>

<footer id="output">
  <div class="out-box">
    <div class="out-head">HPI <button type="button" class="btn small" data-copy="hpi">Copy HPI</button></div>
    <div id="out-hpi" class="out-text"></div>
  </div>
  <div class="out-box">
    <div class="out-head">PE <button type="button" class="btn small" data-copy="pe">Copy PE</button></div>
    <div id="out-pe" class="out-text"></div>
  </div>
  <div class="out-actions">
    <button type="button" class="btn primary" data-copy="all">Copy HPI + PE</button>
    <span id="copy-status" role="status"></span>
  </div>
</footer>

<aside id="card" hidden aria-label="Disease card"></aside>

","frag_neg":"no leg edema"},{"id":"crackles","label":"Bibasal crackles","frag":"bibasal crackles"}],"join":","},"infection_pe":{"id":"infection_pe","label":"Throat, nodes & skin","type":"presence","ask":[],"options":[{"id":"lymphadenopathy","label":"Cervical lymphadenopathy","frag":"cervical lymphadenopathy","frag_neg":"no cervical lymphadenopathy"},{"id":"tonsillar_exudate","label":"Tonsillar exudate","frag":"tonsillar exudate"},{"id":"rash","label":"Rash","frag":"a rash"}],"join":","}},"diseases":{"acetaminophen_toxicity":{"id":"acetaminophen_toxicity","name":"Acetaminophen (paracetamol) toxicity","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Very high ALT/AST (often > 1000) 1–3 days after a single overdose or repeated supratherapeutic doses, with nausea and RUQ pain; risk is higher with alcohol use, fasting, or malnutrition. N-acetylcysteine is the antidote.","symptoms":[{"item":"liver_drugs","options":["apap"],"state":"present","text":"Acetaminophen — overdose or > 4 g/day (lower threshold with alcohol or fasting)"},{"item":"alcohol_use","options":["heavy","regular"],"text":"Chronic alcohol use (lowers the toxic threshold)"},{"item":"assoc_gi","options":["nausea","vomiting","anorexia"],"state":"present","text":"Nausea, vomiting, anorexia"},{"item":"pain_location","options":["ruq"],"text":"RUQ pain (day 2–3)"},{"item":"lft_duration","options":["lt1m","first_found"],"text":"Acute"},{"item":"assoc_other","options":["confusion"],"state":"present","text":"Confusion — acute liver failure"},{"item":"liver_warning","options":["bruising"],"state":"present","text":"Bleeding — coagulopathy"}],"pe":[{"item":"palpable","options":["liver_tender"],"state":"present","text":"Liver tenderness"},{"item":"skin","options":["icterus"],"state":"present","text":"Jaundice (later)"},{"item":"liver_pe","options":["asterixis"],"state":"present","text":"Asterixis — encephalopathy"}],"labs":["Acetaminophen level (timed; Rumack–Matthew nomogram for a single acute ingestion)","ALT/AST, INR, creatinine, lactate, glucose, phosphate, blood gas","King's College criteria: arterial pH < 7.3, or INR > 6.5 + creatinine > 3.4 mg/dL + grade III–IV encephalopathy"],"imaging":["Usually not needed for diagnosis"],"pitfalls":["Start N-acetylcysteine without waiting for the level if ingestion > 8 h ago or timing is unclear.","Repeated supratherapeutic ingestion (e.g., several cold remedies) is easy to miss — ask about all combination products.","Any intentional overdose needs a psychiatric assessment."]},"acute_appendicitis":{"id":"acute_appendicitis","name":"Acute appendicitis","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Vague periumbilical pain that migrates to the RLQ over 12–24 hours, followed by anorexia, nausea and low-grade fever, with localized RLQ tenderness. Early in the course the pain is periumbilical only.","symptoms":[{"item":"pain_migration","options":["peri_to_rlq"],"text":"Periumbilical pain migrating to the RLQ (the most useful historical clue)"},{"item":"pain_location","options":["rlq","periumbilical"],"text":"RLQ pain, or periumbilical in the early phase"},{"item":"onset","options":["hours"],"text":"Develops over hours"},{"item":"duration","options":["h6_24","d1_3"],"text":"Usually presents within 1–2 days"},{"item":"pain_pattern","options":["constant"],"text":"Constant pain"},{"item":"aggravating","options":["movement"],"text":"Worse with movement, coughing, or bumps in the road"},{"item":"assoc_gi","options":["anorexia"],"state":"present","text":"Anorexia (its absence makes appendicitis less likely)"},{"item":"assoc_gi","options":["nausea","vomiting"],"state":"present","text":"Nausea or vomiting, usually after the pain begins"},{"item":"assoc_sys","options":["fever"],"state":"present","text":"Low-grade fever; high fever suggests perforation"},{"item":"episodes","options":["first"],"text":"First episode"}],"pe":[{"item":"tenderness","options":["rlq"],"text":"RLQ tenderness"},{"item":"abd_signs","options":["mcburney"],"state":"present","text":"McBurney's point tenderness"},{"item":"abd_signs","options":["rovsing"],"state":"present","text":"Rovsing's sign"},{"item":"abd_signs","options":["psoas","obturator"],"state":"present","text":"Psoas sign (retrocecal) or obturator sign (pelvic appendix)"},{"item":"rebound","options":["present"],"text":"Rebound tenderness"},{"item":"guarding","options":["voluntary","involuntary"],"text":"Guarding in the RLQ"},{"item":"vitals","options":["fever"],"state":"present","text":"Low-grade fever"}],"labs":["Leukocytosis with neutrophilia; CRP rises after 12–24 h","Normal WBC and CRP together make appendicitis much less likely but do not exclude it","Urinalysis may show a few WBC / RBC from bladder or ureter irritation","hCG in every woman of reproductive age"],"imaging":["CT abdomen / pelvis with IV contrast in most adults","Ultrasound first in children, pregnant women, and young women; MRI in pregnancy if ultrasound is non-diagnostic"],"pitfalls":["Retrocecal appendix causes flank or back pain with little anterior tenderness; pelvic appendix causes suprapubic pain, diarrhea, or urinary symptoms.","Elderly and immunocompromised patients present late and atypically, with high perforation rates.","In pregnancy the pain may sit higher in the right flank or RUQ.","A sudden improvement in pain may mean perforation, not resolution.","In young women consider ectopic pregnancy, ovarian torsion, and PID; scores such as Alvarado or AIR help stratify but do not replace reassessment."]},"acute_cholangitis":{"id":"acute_cholangitis","name":"Acute cholangitis","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Fever with rigors, jaundice and RUQ pain (Charcot triad) from infection above an obstructed bile duct, usually a stone; hypotension and confusion signal severe disease needing urgent drainage.","symptoms":[{"item":"assoc_sys","options":["fever","chills"],"state":"present","text":"Fever, often with rigors"},{"item":"assoc_sys","options":["jaundice"],"state":"present","text":"Jaundice"},{"item":"pain_location","options":["ruq","epigastric"],"text":"RUQ or epigastric pain"},{"item":"assoc_sys","options":["dark_urine","pale_stool"],"state":"present","text":"Dark urine, pale stools"},{"item":"assoc_other","options":["confusion"],"state":"present","text":"Confusion (Reynolds pentad — severe)"},{"item":"duration","options":["lt6h","h6_24","d1_3"],"text":"Acute presentation over hours to days"},{"item":"risk","options":["gallstones","biliary_procedure"],"state":"present","text":"Gallstones, biliary stent, prior ERCP or biliary surgery"},{"item":"lft_duration","options":["lt1m","first_found"],"text":"Acute"}],"pe":[{"item":"vitals","options":["fever"],"state":"present","text":"Fever"},{"item":"skin","options":["icterus"],"state":"present","text":"Scleral icterus"},{"item":"tenderness","options":["ruq"],"text":"RUQ tenderness"},{"item":"vitals","options":["tachycardia"],"state":"present","text":"Tachycardia"},{"item":"vitals","options":["hypotension"],"state":"present","text":"Hypotension (severe / septic)"},{"item":"general","options":["confused","ill"],"text":"Ill-appearing or confused"}],"labs":["Leukocytosis (or leukopenia), raised CRP","Cholestatic liver tests (bilirubin, ALP, GGT)","Blood cultures before antibiotics; lactate, creatinine, platelets, INR for severity grading"],"imaging":["RUQ ultrasound — duct dilatation, stones","CT if the cause is unclear (tumor, stent occlusion); MRCP when stable","ERCP (or percutaneous drainage) — timing by severity"],"pitfalls":["The full Charcot triad is present in only about half of patients; the elderly may present with confusion or hypotension alone.","Do not wait for imaging to start antibiotics and fluids.","Blocked biliary stents cause cholangitis without stones.","Grade severity (e.g. Tokyo Guidelines) — organ dysfunction means urgent drainage."]},"acute_cholecystitis":{"id":"acute_cholecystitis","name":"Acute cholecystitis","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Constant RUQ pain lasting more than several hours with fever, RUQ tenderness and a positive Murphy's sign, usually from persistent cystic duct obstruction by a gallstone.","symptoms":[{"item":"pain_location","options":["ruq","epigastric"],"text":"RUQ (sometimes epigastric) pain"},{"item":"pain_pattern","options":["constant"],"text":"Constant pain, unlike the self-limited attacks of biliary colic"},{"item":"duration","options":["h6_24","d1_3","d4_7"],"text":"Lasting more than ~6 hours, typically 1 day or longer at presentation"},{"item":"radiation","options":["r_shoulder"],"text":"May radiate to the right shoulder or scapula"},{"item":"aggravating","options":["deep_breath","movement"],"text":"Worse with deep breathing or movement"},{"item":"assoc_sys","options":["fever"],"state":"present","text":"Fever"},{"item":"assoc_gi","options":["nausea","vomiting"],"state":"present","text":"Nausea and vomiting"},{"item":"assoc_gi","options":["anorexia"],"state":"present","text":"Anorexia"},{"item":"episodes","options":["recurrent"],"text":"Often preceded by episodes of biliary colic"},{"item":"risk","options":["gallstones"],"state":"present","text":"Known gallstones"}],"pe":[{"item":"vitals","options":["fever"],"state":"present","text":"Fever (may be absent in the elderly)"},{"item":"vitals","options":["tachycardia"],"state":"present","text":"Tachycardia"},{"item":"tenderness","options":["ruq"],"text":"RUQ tenderness"},{"item":"abd_signs","options":["murphy"],"state":"present","text":"Positive Murphy's sign"},{"item":"guarding","options":["voluntary","involuntary"],"text":"Guarding in the RUQ"},{"item":"palpable","options":["gallbladder"],"state":"present","text":"Palpable, tender gallbladder in some patients"},{"item":"skin","options":["icterus"],"state":"absent","text":"Usually anicteric; marked jaundice suggests a CBD stone, Mirizzi syndrome, or cholangitis"}],"labs":["Leukocytosis and raised CRP","Mild rises in bilirubin, ALP, or transaminases are common","Bilirubin > ~4 mg/dL or a high ALP / GGT → look for a CBD stone"],"imaging":["RUQ ultrasound — stones, wall thickening > 4 mm, pericholecystic fluid, sonographic Murphy's sign","Cholescintigraphy (HIDA) if ultrasound is equivocal","CT for suspected complications (gangrene, emphysematous cholecystitis, perforation, abscess)"],"pitfalls":["Elderly and diabetic patients may have little fever, minimal tenderness, and a negative Murphy's sign.","Acalculous cholecystitis occurs in critically ill, post-operative, or prolonged-fasting patients.","Fever with jaundice and hypotension or confusion is cholangitis, not simple cholecystitis.","Right lower lobe pneumonia and inferior MI can mimic RUQ pain.","Grade severity (e.g. Tokyo Guidelines) to decide on early cholecystectomy vs drainage."]},"acute_coronary_syndrome":{"id":"acute_coronary_syndrome","name":"Acute coronary syndrome","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Epigastric pain or pressure, sometimes the only symptom of myocardial ischemia (especially inferior MI), in an older, diabetic, or atherosclerotic patient — with exertional trigger, diaphoresis, dyspnea, or radiation to chest, arm, or jaw.","symptoms":[{"item":"pain_location","options":["epigastric"],"text":"Epigastric pain or \"indigestion\""},{"item":"pain_quality","options":["pressure","dull","burning"],"text":"Pressure, heaviness, or burning"},{"item":"precipitant","options":["exertion"],"text":"Triggered by exertion or emotional stress"},{"item":"radiation","options":["chest_arm_jaw"],"text":"Radiates to the chest, arm, neck, or jaw"},{"item":"assoc_other","options":["chest_pain","dyspnea"],"state":"present","text":"Chest discomfort or dyspnea"},{"item":"assoc_other","options":["diaphoresis"],"state":"present","text":"Diaphoresis"},{"item":"assoc_gi","options":["nausea","vomiting"],"state":"present","text":"Nausea and vomiting (common with inferior MI)"},{"item":"risk","options":["atherosclerosis","diabetes","smoking"],"state":"present","text":"Coronary risk factors — known vascular disease, diabetes, smoking"},{"item":"age_group","options":["age_40_59","age_60_plus"],"text":"Older age"}],"pe":[{"item":"general","options":["pale_diaphoretic"],"text":"Pale, diaphoretic"},{"item":"tenderness","options":["none"],"text":"Abdomen non-tender — pain without tenderness"},{"item":"guarding","options":["soft"],"text":"Soft abdomen"},{"item":"vitals","options":["tachycardia","hypotension"],"state":"present","text":"Tachycardia, bradycardia (inferior MI), or hypotension"}],"labs":["High-sensitivity troponin at presentation and repeated per protocol","Electrolytes, glucose; lipase and liver tests to look for an abdominal mimic"],"imaging":["12-lead ECG within 10 minutes; repeat if symptoms persist (include right-sided leads for inferior MI)","Chest X-ray; echocardiography as indicated"],"pitfalls":["Women, diabetics, and the elderly often present without chest pain.","A \"GI cocktail\" response does not exclude cardiac ischemia.","Epigastric pain with normal abdominal exam in a patient with risk factors — get an ECG before calling it gastritis.","Aortic dissection can also present with epigastric or back pain; check pulses and blood pressure in both arms."]},"acute_gastroenteritis":{"id":"acute_gastroenteritis","name":"Acute gastroenteritis","must_not_miss":false,"timecourse":["acute"],"status":"draft","one_liner":"Diffuse crampy abdominal pain with vomiting and watery diarrhea of short duration, often with sick contacts or a suspicious meal; the abdomen is soft without localized peritonism.","symptoms":[{"item":"pain_location","options":["diffuse","periumbilical"],"text":"Diffuse or periumbilical crampy pain"},{"item":"pain_quality","options":["cramping","colicky"],"text":"Crampy"},{"item":"pain_pattern","options":["waves"],"text":"Comes in waves, often before bowel movements"},{"item":"assoc_gi","options":["diarrhea"],"state":"present","text":"Watery diarrhea"},{"item":"assoc_gi","options":["vomiting","nausea"],"state":"present","text":"Vomiting and nausea"},{"item":"assoc_sys","options":["fever"],"state":"present","text":"Low-grade fever"},{"item":"relieving","options":["defecation"],"text":"Briefly relieved by passing stool"},{"item":"duration","options":["lt6h","h6_24","d1_3"],"text":"Short history — hours to a few days"},{"item":"risk","options":["sick_contacts","travel"],"state":"present","text":"Sick contacts, suspicious food, travel"},{"item":"stool_character","options":["watery","loose"],"text":"Watery, non-bloody diarrhea"},{"item":"diarrhea_duration","options":["lt3d","d3_7"],"text":"Acute, settling within a few days"}],"pe":[{"item":"guarding","options":["soft"],"text":"Soft abdomen"},{"item":"tenderness","options":["diffuse","none","periumbilical"],"text":"Mild diffuse tenderness or none"},{"item":"bowel_sounds","options":["hyper"],"text":"Hyperactive bowel sounds"},{"item":"general","options":["dehydrated"],"text":"Dry mucous membranes if dehydrated"},{"item":"rebound","options":["absent"],"text":"No rebound tenderness"}],"labs":["Often none needed; electrolytes and creatinine if dehydrated","Stool studies for bloody diarrhea, high fever, severe illness, immunocompromise, recent antibiotics (C. difficile), or prolonged symptoms"],"imaging":["Not routinely needed — image if there are focal signs or peritonism"],"pitfalls":["Vomiting without diarrhea is not gastroenteritis until proven otherwise (obstruction, appendicitis, DKA, MI, raised intracranial pressure).","Early appendicitis, especially pelvic, can cause diarrhea.","Severe pain with minimal diarrhea in an older patient — think mesenteric ischemia.","Recheck if pain becomes localized or persists beyond 48–72 h."]},"acute_hepatitis":{"id":"acute_hepatitis","name":"Acute hepatitis","must_not_miss":false,"timecourse":["acute","subacute"],"status":"draft","one_liner":"Dull RUQ ache with malaise, anorexia and nausea, followed by dark urine and jaundice, with tender hepatomegaly and markedly raised transaminases — viral, drug / herbal, alcoholic, or a flare of chronic hepatitis B.","symptoms":[{"item":"pain_location","options":["ruq","epigastric"],"text":"Dull RUQ discomfort"},{"item":"pain_quality","options":["dull"],"text":"Dull, aching quality"},{"item":"onset","options":["gradual","hours"],"text":"Gradual onset after a prodrome"},{"item":"assoc_sys","options":["malaise"],"state":"present","text":"Malaise and fatigue"},{"item":"assoc_gi","options":["anorexia","nausea"],"state":"present","text":"Anorexia and nausea"},{"item":"assoc_sys","options":["jaundice","dark_urine"],"state":"present","text":"Jaundice and dark urine"},{"item":"assoc_sys","options":["fever"],"state":"present","text":"Low-grade fever in the prodrome"},{"item":"risk","options":["alcohol","liver_disease","new_meds","travel"],"state":"present","text":"Alcohol, known HBV / HCV, new drug or herbal supplement, travel"}],"pe":[{"item":"skin","options":["icterus"],"state":"present","text":"Scleral icterus"},{"item":"palpable","options":["hepatomegaly","liver_tender"],"state":"present","text":"Tender hepatomegaly / pain on fist percussion"},{"item":"tenderness","options":["ruq"],"text":"RUQ tenderness"},{"item":"general","options":["confused"],"text":"Confusion signals acute liver failure"}],"labs":["AST/ALT often > 10× ULN in viral, drug, or ischemic hepatitis; AST:ALT > 2 with AST < 300 suggests alcohol","Bilirubin and INR (INR ≥ 1.5 = severe; with encephalopathy = acute liver failure)","IgM anti-HAV, HBsAg + IgM anti-HBc, HBV DNA, anti-HCV / HCV RNA, IgM anti-HEV","Acetaminophen level when relevant; autoimmune markers if no other cause"],"imaging":["Ultrasound — exclude biliary obstruction, assess liver and hepatic veins"],"pitfalls":["In chronic HBV carriers, a flare (e.g. after stopping antivirals or during chemotherapy / immunosuppression) can be severe.","Ask specifically about herbal products, supplements, and recently started drugs.","Rising INR or new confusion means acute liver failure — refer urgently.","Biliary obstruction from a passing stone can briefly produce very high transaminases."]},"acute_hepatitis_a_e":{"id":"acute_hepatitis_a_e","name":"Acute viral hepatitis A / E","must_not_miss":false,"timecourse":["acute"],"status":"draft","one_liner":"A few days of fever, malaise, anorexia and nausea followed by jaundice and dark urine, with ALT often > 1000, after raw shellfish, undercooked pork (HEV), travel, or a household contact; usually self-limiting.","symptoms":[{"item":"assoc_sys","options":["fever","malaise"],"state":"present","text":"Prodrome of fever and malaise"},{"item":"assoc_gi","options":["anorexia","nausea","vomiting"],"state":"present","text":"Anorexia, nausea"},{"item":"assoc_sys","options":["jaundice","dark_urine"],"state":"present","text":"Jaundice and dark urine after the prodrome"},{"item":"pain_location","options":["ruq"],"text":"RUQ discomfort"},{"item":"viral_exposure","options":["shellfish","household"],"state":"present","text":"Raw shellfish, undercooked pork / game (HEV), or household contact"},{"item":"risk","options":["travel","sti_risk"],"state":"present","text":"Travel or sexual exposure (HAV among MSM)"},{"item":"lft_duration","options":["lt1m","first_found"],"text":"Acute"},{"item":"age_group","options":["under_40","age_40_59"],"text":"Adults in Taiwan are now largely non-immune to HAV"}],"pe":[{"item":"skin","options":["icterus"],"state":"present","text":"Jaundice"},{"item":"palpable","options":["liver_tender","hepatomegaly"],"state":"present","text":"Tender hepatomegaly"},{"item":"vitals","options":["fever"],"state":"present","text":"Low-grade fever"}],"labs":["Anti-HAV IgM, anti-HEV IgM (and HEV RNA if immunocompromised)","ALT often 1000–3000; INR to assess severity","HBsAg, anti-HBc IgM, anti-HCV to exclude other viruses"],"imaging":["Ultrasound to exclude biliary obstruction"],"pitfalls":["Hepatitis E in pregnancy can cause fulminant hepatitis.","Older adults and those with chronic liver disease (including HBV carriers) do worse.","HAV is notifiable; offer vaccination to household contacts."]},"acute_hiv":{"id":"acute_hiv","name":"Acute HIV infection","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"A mononucleosis-like illness — fever, sore throat, rash, lymphadenopathy, myalgia, sometimes oral ulcers or diarrhea — 2–4 weeks after sexual or blood exposure, often with a mild ALT rise; highly infectious and treatable.","symptoms":[{"item":"risk","options":["sti_risk"],"state":"present","text":"Recent condomless sex, new or multiple partners, MSM"},{"item":"viral_exposure","options":["idu"],"state":"present","text":"Injection drug use"},{"item":"assoc_sys","options":["fever","malaise"],"state":"present","text":"Fever, fatigue"},{"item":"viral_sx","options":["rash"],"state":"present","text":"Maculopapular rash on the trunk"},{"item":"viral_sx","options":["sore_throat","lymph_nodes"],"state":"present","text":"Sore throat, swollen glands"},{"item":"viral_sx","options":["myalgia"],"state":"present","text":"Myalgia, headache"},{"item":"lft_duration","options":["lt1m","first_found"],"text":"Acute"},{"item":"age_group","options":["under_40","age_40_59"],"text":"Usually younger adults"}],"pe":[{"item":"infection_pe","options":["lymphadenopathy","rash"],"state":"present","text":"Generalized lymphadenopathy, rash"},{"item":"vitals","options":["fever"],"state":"present","text":"Fever"},{"item":"palpable","options":["splenomegaly","hepatomegaly"],"state":"present","text":"Hepatosplenomegaly (sometimes)"}],"labs":["4th-generation HIV Ag/Ab test; HIV RNA if early infection is suspected (antibody may still be negative)","Syphilis, HBV, HCV, HAV screening (shared risks)","CBC — lymphopenia, thrombocytopenia"],"imaging":["None needed"],"pitfalls":["The antibody test can be negative in the first weeks — add HIV RNA or repeat testing.","Ask directly and non-judgementally about sexual exposures; offer testing to all with mononucleosis-like illness and risk.","Early antiretroviral therapy benefits the patient and prevents transmission; refer the same week."]},"acute_mesenteric_ischemia":{"id":"acute_mesenteric_ischemia","name":"Acute mesenteric ischemia","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Sudden, severe periumbilical or diffuse pain out of proportion to a soft, minimally tender abdomen in an older patient with atrial fibrillation or atherosclerotic disease; peritonitis and bloody stool appear late.","symptoms":[{"item":"onset","options":["sudden"],"text":"Sudden onset (embolic); thrombotic and venous forms may develop over hours to days"},{"item":"pain_location","options":["periumbilical","diffuse"],"text":"Periumbilical or diffuse, poorly localized pain"},{"item":"severity","options":["s8","s9","s10"],"text":"Severe pain"},{"item":"age_group","options":["age_60_plus"],"text":"Usually over 60"},{"item":"risk","options":["af","atherosclerosis","hypercoagulable"],"state":"present","text":"Atrial fibrillation, atherosclerotic disease, or a hypercoagulable state"},{"item":"assoc_gi","options":["vomiting","diarrhea"],"state":"present","text":"Vomiting and urge to defecate / diarrhea early"},{"item":"assoc_gi","options":["hematochezia","bloody_diarrhea"],"state":"present","text":"Bloody stool is a late sign of mucosal infarction"},{"item":"assoc_other","options":["food_fear"],"state":"present","text":"Prior postprandial pain and fear of eating (chronic mesenteric ischemia preceding thrombosis)"},{"item":"assoc_sys","options":["weight_loss"],"state":"present","text":"Weight loss from food avoidance (chronic mesenteric ischemia)"}],"pe":[{"item":"abd_signs","options":["out_of_proportion"],"state":"present","text":"Pain out of proportion to the examination — the hallmark early finding"},{"item":"guarding","options":["soft"],"text":"Abdomen soft early on"},{"item":"tenderness","options":["none","periumbilical","diffuse"],"text":"Minimal or diffuse mild tenderness early"},{"item":"chest","options":["irregular"],"state":"present","text":"Irregularly irregular rhythm (atrial fibrillation)"},{"item":"vitals","options":["tachycardia"],"state":"present","text":"Tachycardia"},{"item":"rebound","options":["present"],"text":"Rebound and rigidity appear only after transmural infarction (late)"},{"item":"rectal","options":["fresh_blood"],"text":"Blood on rectal exam (late)"}],"labs":["Leukocytosis, metabolic acidosis, raised lactate — but all may be normal early","D-dimer is sensitive but non-specific","Amylase / lipase and LDH may be mildly elevated"],"imaging":["CT angiography (arterial and portal venous phase) immediately when suspected — do not wait for lactate","Plain films are often normal early; \"thumbprinting\" or pneumatosis are late findings"],"pitfalls":["A benign abdominal exam early on is the classic trap; the pain is real.","A normal lactate does not exclude ischemia; by the time lactate rises, bowel is often necrotic.","Non-occlusive mesenteric ischemia occurs in shock, heart failure, dialysis, vasopressor or digoxin use.","Mesenteric venous thrombosis is more gradual and affects younger patients with hypercoagulable states, cirrhosis, or malignancy.","Older patient with AF and severe abdominal pain → CT angiography first, not \"observe and recheck\"."]},"acute_pancreatitis":{"id":"acute_pancreatitis","name":"Acute pancreatitis","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Acute, constant, severe epigastric pain radiating to the back with nausea and vomiting, typically after gallstone passage or heavy drinking; diagnosis requires two of pain, lipase ≥3× ULN, and imaging findings.","symptoms":[{"item":"pain_location","options":["epigastric","luq","ruq"],"text":"Epigastric pain, sometimes LUQ or band-like across the upper abdomen"},{"item":"onset","options":["sudden","hours"],"text":"Onset over minutes to hours"},{"item":"pain_pattern","options":["constant"],"text":"Constant, boring pain"},{"item":"severity","options":["s7","s8","s9","s10"],"text":"Usually severe"},{"item":"radiation","options":["back"],"text":"Radiates straight through to the back"},{"item":"relieving","options":["leaning_forward"],"text":"Eased by sitting up and leaning forward"},{"item":"aggravating","options":["lying_flat"],"text":"Worse lying supine"},{"item":"meal_relation","options":["worse_eating"],"text":"Worse after eating"},{"item":"precipitant","options":["alcohol","fatty_meal"],"text":"After an alcohol binge or a heavy meal"},{"item":"assoc_gi","options":["nausea","vomiting"],"state":"present","text":"Nausea and vomiting are prominent"},{"item":"risk","options":["gallstones","alcohol","hypertriglyceridemia"],"state":"present","text":"Gallstones, heavy alcohol use, or hypertriglyceridemia"}],"pe":[{"item":"tenderness","options":["epigastric"],"text":"Epigastric tenderness, often with less rigidity than the pain would suggest"},{"item":"guarding","options":["voluntary","soft"],"text":"Voluntary guarding; true board-like rigidity is unusual"},{"item":"vitals","options":["tachycardia"],"state":"present","text":"Tachycardia"},{"item":"vitals","options":["fever"],"state":"present","text":"Low-grade fever"},{"item":"bowel_sounds","options":["hypo"],"text":"Hypoactive bowel sounds (ileus)"},{"item":"abd_contour","options":["mild"],"text":"Mild distension"},{"item":"skin","options":["icterus"],"state":"present","text":"Icterus suggests a biliary cause or CBD obstruction"},{"item":"skin","options":["ecchymosis"],"state":"present","text":"Grey Turner / Cullen sign — uncommon and late, indicates severe disease"}],"labs":["Lipase ≥ 3× ULN (more specific than amylase); the level does not reflect severity","ALT > 3× ULN early suggests a gallstone cause","Triglycerides and calcium to identify the cause","BUN, hematocrit, creatinine, and CRP to assess severity; rising BUN in the first 24–48 h is a bad sign"],"imaging":["Abdominal ultrasound in every patient to look for gallstones","Contrast CT only if the diagnosis is uncertain or the patient fails to improve after 48–72 h","MRCP or EUS for persistent bile duct stone suspicion or recurrent \"idiopathic\" pancreatitis"],"pitfalls":["Early CT underestimates necrosis; do not image routinely on day 1 if the diagnosis is clear.","A raised lipase also occurs with perforated ulcer, mesenteric ischemia, bowel obstruction, and renal failure.","Amylase can be falsely normal in hypertriglyceridemia-induced pancreatitis.","Unexplained pancreatitis in a patient over 40–50 should prompt a search for a pancreatic tumor.","Watch for organ failure (persistent > 48 h defines severe disease); aggressive early fluid support, avoid overload."]},"acute_pyelonephritis":{"id":"acute_pyelonephritis","name":"Acute pyelonephritis","must_not_miss":false,"timecourse":["acute"],"status":"draft","one_liner":"Fever, chills and flank pain with CVA tenderness, often preceded by dysuria and frequency, with nausea and vomiting; mostly young women.","symptoms":[{"item":"pain_location","options":["flank_r","flank_l"],"text":"Flank pain"},{"item":"pain_quality","options":["dull"],"text":"Dull, constant ache"},{"item":"assoc_sys","options":["fever","chills"],"state":"present","text":"Fever and chills"},{"item":"assoc_gu","options":["dysuria","frequency"],"state":"present","text":"Dysuria and frequency"},{"item":"assoc_gi","options":["nausea","vomiting"],"state":"present","text":"Nausea and vomiting"},{"item":"duration","options":["h6_24","d1_3","d4_7"],"text":"Over 1–3 days"},{"item":"sex","options":["female"],"text":"More common in women"}],"pe":[{"item":"vitals","options":["fever"],"state":"present","text":"Fever"},{"item":"cva_tenderness","options":["right","left"],"text":"CVA tenderness"},{"item":"vitals","options":["tachycardia","hypotension"],"state":"present","text":"Tachycardia; hypotension if urosepsis"},{"item":"guarding","options":["soft"],"text":"Abdomen soft"}],"labs":["Urinalysis and urine culture (before antibiotics)","CBC, CRP, creatinine; blood cultures if septic"],"imaging":["Ultrasound or CT if no improvement after 48–72 h, sepsis, suspected obstruction or abscess","Imaging early in men, diabetics, and recurrent cases"],"pitfalls":["Obstruction with infection needs urgent drainage.","Emphysematous pyelonephritis in poorly controlled diabetes — CT.","Pregnant women need admission and close monitoring."]},"acute_urinary_retention":{"id":"acute_urinary_retention","name":"Acute urinary retention","must_not_miss":false,"timecourse":["acute"],"status":"draft","one_liner":"Painful inability to void with suprapubic fullness and a palpable bladder, usually in an older man with BPH, often precipitated by anticholinergic or opioid drugs, constipation, or infection.","symptoms":[{"item":"assoc_gu","options":["cannot_void"],"state":"present","text":"Unable to pass urine"},{"item":"pain_location","options":["suprapubic"],"text":"Suprapubic pain and fullness"},{"item":"sex","options":["male"],"text":"Mostly men"},{"item":"age_group","options":["age_60_plus"],"text":"Older age"},{"item":"risk","options":["bph","retention_drugs"],"state":"present","text":"BPH; anticholinergics, opioids, decongestants"},{"item":"assoc_gi","options":["constipation"],"state":"present","text":"Constipation (precipitant)"},{"item":"onset","options":["hours","sudden"],"text":"Develops over hours"}],"pe":[{"item":"palpable","options":["bladder"],"state":"present","text":"Distended, palpable bladder, dull to percussion"},{"item":"tenderness","options":["suprapubic"],"text":"Suprapubic tenderness"},{"item":"rectal","options":["hard_stool","normal"],"text":"Rectal exam — prostate size, fecal impaction"},{"item":"general","options":["restless"],"text":"Restless and uncomfortable"}],"labs":["Creatinine and electrolytes; urinalysis and culture"],"imaging":["Bladder scan / ultrasound — post-void residual","Catheterization is diagnostic and therapeutic"],"pitfalls":["Painless retention may present with overflow incontinence.","Consider spinal cord compression or cauda equina when there are neurologic symptoms.","Check renal function — chronic retention can cause obstructive uropathy."]},"alcohol_related_liver_disease":{"id":"alcohol_related_liver_disease","name":"Alcohol-related liver disease (steatosis → cirrhosis)","must_not_miss":false,"timecourse":["chronic"],"status":"draft","one_liner":"Mildly raised AST > ALT with high GGT and MCV in a long-term heavy drinker, from steatosis that can progress silently to fibrosis and cirrhosis; abstinence is the key treatment.","symptoms":[{"item":"alcohol_use","options":["heavy","regular","former"],"text":"Long-term regular or heavy drinking"},{"item":"alcohol_amount","options":["g40_60","g60_100","gt100"],"text":"Usually > 40 g/day (women lower)"},{"item":"alcohol_years","options":["y5_10","y10_20","gt20"],"text":"For years"},{"item":"alcohol_type","options":["kaoliang","rice_wine","tonic","whiskey"],"text":"Spirits, rice wine, or tonic wine (high grams per drink)"},{"item":"lft_duration","options":["gt6m","first_found"],"text":"Chronic or found on routine testing"},{"item":"assoc_sys","options":["jaundice"],"state":"absent","text":"Usually no jaundice (unless decompensated)"},{"item":"metabolic","options":["obesity"],"state":"present","text":"Obesity accelerates fibrosis"}],"pe":[{"item":"palpable","options":["hepatomegaly"],"state":"present","text":"Hepatomegaly (steatosis)"},{"item":"liver_pe","options":["spider","palmar","gynecomastia"],"state":"present","text":"Stigmata of chronic liver disease"},{"item":"palpable","options":["splenomegaly","ascites"],"state":"present","text":"Splenomegaly, ascites (cirrhosis)"}],"labs":["AST/ALT > 2, GGT raised, MCV raised; AST usually < 300","Platelets, albumin, INR, bilirubin — cirrhosis","Phosphatidylethanol (PEth) or CDT to support history where available"],"imaging":["Ultrasound — fatty or coarse liver, splenomegaly, ascites","Transient elastography (interpret after a period of abstinence)","EGD for varices if cirrhotic; HCC surveillance every 6 months in cirrhosis"],"pitfalls":["Patients under-report intake — ask about type, bottle size, and days per week, and ask family.","Coexisting HBV, HCV, or MASLD multiplies risk; test for them.","Normal liver tests do not exclude cirrhosis."]},"alcoholic_hepatitis":{"id":"alcoholic_hepatitis","name":"Alcohol-associated hepatitis","must_not_miss":true,"timecourse":["acute","subacute"],"status":"draft","one_liner":"Rapid onset of jaundice, often with fever, tender hepatomegaly and malaise, in a heavy drinker (usually > 60 g/day for years) whose last drink was within the past 8 weeks; severe cases carry high short-term mortality.","symptoms":[{"item":"alcohol_use","options":["heavy","regular"],"text":"Heavy drinking"},{"item":"alcohol_amount","options":["g60_100","gt100"],"text":"Usually > 60 g/day"},{"item":"alcohol_years","options":["y5_10","y10_20","gt20"],"text":"Years of heavy use"},{"item":"alcohol_last","options":["still","lt1m","m1_6"],"text":"Last drink within the past 8 weeks"},{"item":"alcohol_pattern","options":["binge","daily"],"state":"present","text":"Recent binge or daily drinking"},{"item":"assoc_sys","options":["jaundice"],"state":"present","text":"New jaundice (the hallmark)"},{"item":"assoc_sys","options":["fever"],"state":"present","text":"Low-grade fever (also look for infection)"},{"item":"assoc_sys","options":["malaise","weight_loss"],"state":"present","text":"Malaise, anorexia, weight loss"},{"item":"pain_location","options":["ruq"],"text":"RUQ discomfort"},{"item":"liver_warning","options":["distension"],"state":"present","text":"Abdominal swelling (ascites)"},{"item":"lft_duration","options":["lt1m","m1_6"],"text":"Weeks"},{"item":"assoc_other","options":["confusion"],"state":"present","text":"Confusion — encephalopathy or withdrawal"}],"pe":[{"item":"skin","options":["icterus"],"state":"present","text":"Jaundice"},{"item":"palpable","options":["hepatomegaly","liver_tender"],"state":"present","text":"Tender hepatomegaly"},{"item":"vitals","options":["fever","tachycardia"],"state":"present","text":"Fever, tachycardia"},{"item":"liver_pe","options":["spider","palmar","asterixis"],"state":"present","text":"Stigmata of chronic liver disease; asterixis in severe disease"},{"item":"palpable","options":["ascites"],"state":"present","text":"Ascites"}],"labs":["AST 2–6 × ULN (rarely > 400), AST/ALT > 1.5–2; bilirubin > 3 mg/dL","Raised neutrophils, INR, MCV, GGT","Severity — MELD, Maddrey discriminant function; Lille score at day 7 of steroids","Exclude infection (blood / urine culture, ascitic tap, chest X-ray), HBV, HCV, DILI"],"imaging":["Ultrasound with Doppler — exclude biliary obstruction, HCC, portal vein thrombosis","Liver biopsy only if the diagnosis is uncertain"],"pitfalls":["AST > 400 or ALT > 300 points to another cause (ischemia, acetaminophen, viral).","Combined acetaminophen use in heavy drinkers causes severe injury at modest doses.","Severe disease (MELD > 20) needs admission and consideration of steroids after excluding infection.","Thiamine and alcohol withdrawal management are part of the first day."]},"amoebic_colitis":{"id":"amoebic_colitis","name":"Amoebic colitis","must_not_miss":false,"timecourse":["subacute","chronic"],"status":"draft","one_liner":"Gradual-onset bloody, mucoid diarrhea with crampy abdominal pain over 1–3 weeks, often without high fever, in a patient with HIV, men who have sex with men, institution residents, or travelers to endemic areas.","symptoms":[{"item":"stool_character","options":["bloody","mucus"],"text":"Bloody, mucoid stools"},{"item":"diarrhea_duration","options":["w1_2","w2_4","m1_3"],"text":"Gradual onset over 1–3 weeks (longer than bacterial dysentery)"},{"item":"pain_location","options":["rlq","diffuse","llq"],"text":"Crampy abdominal pain, often right-sided (cecum)"},{"item":"assoc_sys","options":["fever"],"state":"absent","text":"Fever often absent or low-grade"},{"item":"assoc_sys","options":["weight_loss"],"state":"present","text":"Weight loss"},{"item":"risk","options":["immunocompromised","travel"],"state":"present","text":"HIV, MSM, travel, or institutional living"},{"item":"exposure","options":["institution"],"state":"present","text":"Institution resident"}],"pe":[{"item":"tenderness","options":["rlq","diffuse"],"text":"Right-sided or diffuse tenderness"},{"item":"palpable","options":["hepatomegaly"],"state":"present","text":"Tender hepatomegaly (concurrent liver abscess)"}],"labs":["Stool Entamoeba histolytica antigen or PCR (microscopy cannot distinguish E. dispar)","Serum amoebic serology; HIV and syphilis testing","CBC, CRP, liver panel"],"imaging":["Colonoscopy — discrete flask-shaped ulcers, cecum and ascending colon; biopsy the ulcer edge","Liver ultrasound if RUQ pain or abnormal liver tests"],"pitfalls":["Easily mistaken for IBD — steroids can precipitate fulminant amoebic colitis; exclude amoeba first.","In Taiwan, amoebiasis is now mostly sexually transmitted (MSM, HIV) rather than travel-related.","Treat with a tissue agent (metronidazole) followed by a luminal agent (paromomycin)."]},"autoimmune_hepatitis":{"id":"autoimmune_hepatitis","name":"Autoimmune hepatitis","must_not_miss":false,"timecourse":["acute","subacute","chronic"],"status":"draft","one_liner":"Fluctuating hepatocellular injury, sometimes acute with jaundice, in a woman with other autoimmune disease, raised IgG and positive ANA or anti-smooth muscle antibody; responds to steroids.","symptoms":[{"item":"sex","options":["female"],"text":"Women more often (about 4:1)"},{"item":"other_liver","options":["autoimmune"],"state":"present","text":"Other autoimmune disease (thyroid, RA, Sjögren, celiac)"},{"item":"extraintestinal","options":["arthralgia"],"state":"present","text":"Arthralgia"},{"item":"assoc_sys","options":["malaise","jaundice"],"state":"present","text":"Fatigue; jaundice when acute"},{"item":"alcohol_use","options":["never","social"],"text":"Little alcohol"}],"pe":[{"item":"skin","options":["icterus"],"state":"present","text":"Jaundice when acute"},{"item":"palpable","options":["hepatomegaly","splenomegaly"],"state":"present","text":"Hepatosplenomegaly"},{"item":"liver_pe","options":["spider","palmar"],"state":"present","text":"Stigmata (cirrhosis at presentation in a third)"}],"labs":["ANA, anti-smooth muscle antibody, IgG (anti-LKM1 in children)","Exclude viral hepatitis and drugs (nitrofurantoin, minocycline cause AIH-like injury)","Liver biopsy — interface hepatitis, plasma cells"],"imaging":["Ultrasound; elastography"],"pitfalls":["Autoantibodies can be negative in acute presentations; IgG may be normal.","Treat early — untreated disease progresses to cirrhosis.","Can overlap with PBC."]},"bacterial_food_poisoning":{"id":"bacterial_food_poisoning","name":"Bacterial food poisoning (S. aureus, B. cereus, V. parahaemolyticus)","must_not_miss":false,"timecourse":["acute"],"status":"draft","one_liner":"Abrupt vomiting and/or watery diarrhea within hours of a shared meal, with several people affected; preformed toxins (S. aureus, B. cereus) act in 1–6 hours, while V. parahaemolyticus from raw seafood causes watery diarrhea and cramps within a day, especially in summer in Taiwan.","symptoms":[{"item":"risk","options":["sick_contacts"],"state":"present","text":"Others who ate the same food are ill"},{"item":"exposure","options":["banquet","raw_seafood"],"state":"present","text":"Banquet, buffet, takeaway, or raw seafood (sashimi, shellfish)"},{"item":"assoc_gi","options":["vomiting","nausea"],"state":"present","text":"Prominent nausea and vomiting (toxin-mediated)"},{"item":"stool_character","options":["watery"],"text":"Watery, non-bloody diarrhea"},{"item":"pain_quality","options":["cramping"],"text":"Crampy abdominal pain"},{"item":"assoc_sys","options":["fever"],"state":"absent","text":"Little or no fever"},{"item":"diarrhea_duration","options":["lt3d"],"text":"Starts within hours, resolves within 1–2 days"}],"pe":[{"item":"general","options":["dehydrated"],"text":"Dry mucous membranes"},{"item":"tenderness","options":["none","periumbilical","diffuse"],"text":"Mild diffuse tenderness or none"},{"item":"bowel_sounds","options":["hyper"],"text":"Hyperactive bowel sounds"},{"item":"rebound","options":["absent"],"text":"No peritonism"}],"labs":["Usually none; electrolytes and creatinine if dehydrated","Stool culture only if severe, bloody, or prolonged, or for an outbreak investigation"],"imaging":["None needed"],"pitfalls":["Report suspected outbreaks (several people after one meal) to public health.","Vibrio vulnificus after raw seafood or seawater exposure in liver disease causes sepsis with bullous skin lesions — a different, lethal illness.","Vomiting-predominant illness in an elderly patient may be something else (MI, DKA, bowel obstruction)."]},"bile_acid_diarrhea":{"id":"bile_acid_diarrhea","name":"Bile acid diarrhea","must_not_miss":false,"timecourse":["chronic"],"status":"draft","one_liner":"Chronic watery diarrhea with urgency, often after meals, following cholecystectomy or terminal ileal resection or disease — or idiopathic and misdiagnosed as diarrhea-predominant IBS.","symptoms":[{"item":"diarrhea_history","options":["cholecystectomy","bowel_resection"],"state":"present","text":"Previous cholecystectomy or ileal resection"},{"item":"risk","options":["ibd"],"state":"present","text":"Ileal Crohn's disease"},{"item":"stool_character","options":["watery","loose"],"text":"Watery or loose stools"},{"item":"assoc_gi","options":["tenesmus"],"state":"present","text":"Urgency, often soon after eating"},{"item":"diarrhea_duration","options":["m1_3","gt3m"],"text":"Chronic"},{"item":"food_trigger","options":["fatty_food"],"state":"present","text":"Worse after fatty meals"}],"pe":[{"item":"tenderness","options":["none","diffuse"],"text":"Usually unremarkable abdomen"}],"labs":["SeHCAT or serum C4 where available (usually not in Taiwan)","Exclude infection, celiac, thyroid disease"],"imaging":["Colonoscopy normal; done to exclude other causes"],"pitfalls":["In practice, a therapeutic trial of a bile acid sequestrant (cholestyramine) is the test.","Up to a quarter of patients labelled IBS-D may have bile acid diarrhea.","Bile acid sequestrants bind other drugs — space doses."]},"biliary_colic":{"id":"biliary_colic","name":"Biliary colic","must_not_miss":false,"timecourse":["acute","chronic"],"status":"draft","one_liner":"Steady, intense RUQ or epigastric pain lasting 30 minutes to a few hours, often after a fatty meal or at night, from transient gallstone impaction in the cystic duct; the patient is well between attacks.","symptoms":[{"item":"pain_location","options":["ruq","epigastric"],"text":"RUQ or epigastric pain"},{"item":"pain_pattern","options":["attacks"],"text":"Discrete attacks lasting 30 min to a few hours, pain-free in between"},{"item":"pain_quality","options":["dull","pressure"],"text":"Steady, intense ache — not truly \"colicky\" despite the name"},{"item":"precipitant","options":["fatty_meal"],"text":"Often after a fatty or heavy meal, or at night"},{"item":"radiation","options":["r_shoulder","back"],"text":"May radiate to the right shoulder / scapula or to the back"},{"item":"assoc_gi","options":["nausea","vomiting"],"state":"present","text":"Nausea, sometimes vomiting"},{"item":"episodes","options":["recurrent"],"text":"Recurrent similar attacks"},{"item":"assoc_sys","options":["fever"],"state":"absent","text":"No fever"},{"item":"assoc_sys","options":["jaundice"],"state":"absent","text":"No jaundice"},{"item":"risk","options":["gallstones"],"state":"present","text":"Known gallstones"}],"pe":[{"item":"vitals","options":["fever"],"state":"absent","text":"Afebrile"},{"item":"tenderness","options":["ruq","epigastric"],"text":"Mild RUQ / epigastric tenderness during an attack; may be non-tender between attacks"},{"item":"abd_signs","options":["murphy"],"state":"absent","text":"Murphy's sign negative or equivocal"},{"item":"guarding","options":["soft"],"text":"Soft abdomen, no peritoneal signs"},{"item":"skin","options":["icterus"],"state":"absent","text":"Anicteric"}],"labs":["Usually normal — WBC, liver panel, and lipase within normal limits","A transient AST/ALT rise can follow passage of a small stone"],"imaging":["RUQ ultrasound — gallstones without wall thickening or pericholecystic fluid"],"pitfalls":["Pain persisting beyond about 6 hours, fever, or leukocytosis suggests acute cholecystitis rather than colic.","Jaundice, dark urine, or a cholestatic liver panel points to a common bile duct stone.","Gallstones are common and often incidental; bloating or vague postprandial discomfort alone is usually not biliary.","In older or diabetic patients with upper abdominal pain, exclude ACS before blaming the gallbladder."]},"c_difficile_infection":{"id":"c_difficile_infection","name":"Clostridioides difficile infection","must_not_miss":true,"timecourse":["acute","subacute"],"status":"draft","one_liner":"Watery diarrhea (≥ 3 loose stools a day) with crampy lower abdominal pain, starting during or within weeks of antibiotics or a hospital stay, often in an older or frail patient; severe cases cause fulminant colitis.","symptoms":[{"item":"diarrhea_drugs","options":["antibiotics"],"state":"present","text":"Antibiotics in the past 3 months (the key clue)"},{"item":"diarrhea_history","options":["recent_hospital"],"state":"present","text":"Recent hospitalization"},{"item":"exposure","options":["institution"],"state":"present","text":"Care home resident"},{"item":"stool_character","options":["watery","loose"],"text":"Watery, foul-smelling diarrhea; frank blood is uncommon"},{"item":"stool_frequency","options":["f3_5","f6_10","gt10"],"text":"Three or more stools a day"},{"item":"pain_location","options":["llq","suprapubic","diffuse"],"text":"Crampy lower abdominal pain"},{"item":"assoc_sys","options":["fever"],"state":"present","text":"Fever (more common in severe disease)"},{"item":"diarrhea_drugs","options":["ppi"],"state":"present","text":"PPI use (risk factor)"},{"item":"age_group","options":["age_60_plus"],"text":"Age ≥ 65 (risk of severe disease)"}],"pe":[{"item":"tenderness","options":["llq","suprapubic","diffuse"],"text":"Lower or diffuse abdominal tenderness"},{"item":"vitals","options":["fever","tachycardia"],"state":"present","text":"Fever, tachycardia"},{"item":"abd_contour","options":["mild","marked"],"text":"Distension — consider ileus or toxic megacolon"},{"item":"vitals","options":["hypotension"],"state":"present","text":"Hypotension (fulminant colitis)"}],"labs":["C. difficile testing (GDH + toxin, or PCR with toxin confirmation) on unformed stool only","Severity markers: WBC ≥ 15 × 10⁹/L or creatinine > 1.5 mg/dL = severe","Lactate in suspected fulminant disease"],"imaging":["Plain X-ray or CT if distension, ileus, or peritonism — colonic wall thickening, toxic megacolon","Avoid colonoscopy in severe colitis; flexible sigmoidoscopy only if the diagnosis is unclear"],"pitfalls":["Ileus can cause little or no diarrhea despite severe colitis.","Do not test formed stool or test for cure; colonization is common.","Stop the inciting antibiotic and PPI where possible; avoid antimotility drugs.","Recurrence is common (about 20%) within 8 weeks."]},"choledocholithiasis":{"id":"choledocholithiasis","name":"Choledocholithiasis","must_not_miss":false,"timecourse":["acute","subacute"],"status":"draft","one_liner":"Biliary-type RUQ or epigastric pain with jaundice, dark urine and pale stools from a stone in the common bile duct; liver tests show a cholestatic pattern, often fluctuating as the stone moves.","symptoms":[{"item":"pain_location","options":["ruq","epigastric"],"text":"RUQ or epigastric pain (may be painless)"},{"item":"pain_pattern","options":["attacks","constant"],"text":"Biliary-type attacks, sometimes more persistent"},{"item":"assoc_sys","options":["jaundice"],"state":"present","text":"Jaundice, often fluctuating"},{"item":"assoc_sys","options":["dark_urine","pale_stool"],"state":"present","text":"Dark urine and pale stools"},{"item":"assoc_sys","options":["pruritus"],"state":"present","text":"Pruritus"},{"item":"assoc_gi","options":["nausea","vomiting"],"state":"present","text":"Nausea or vomiting"},{"item":"assoc_sys","options":["fever"],"state":"absent","text":"No fever (fever + jaundice = think cholangitis)"},{"item":"risk","options":["gallstones","biliary_procedure"],"state":"present","text":"Known gallstones or prior cholecystectomy / biliary procedure"},{"item":"lft_duration","options":["lt1m","first_found"],"text":"Recent cholestatic rise"},{"item":"meal_relation","options":["worse_eating"],"text":"Pain after (fatty) meals"},{"item":"radiation","options":["r_shoulder","back"],"text":"Radiating to the right shoulder or back"}],"pe":[{"item":"skin","options":["icterus"],"state":"present","text":"Scleral icterus"},{"item":"tenderness","options":["ruq","epigastric"],"text":"Mild RUQ / epigastric tenderness"},{"item":"vitals","options":["fever"],"state":"absent","text":"Afebrile"},{"item":"abd_signs","options":["murphy"],"state":"absent","text":"Murphy's sign usually negative"}],"labs":["Raised bilirubin (direct), ALP and GGT; AST/ALT may spike early (even > 500) then fall quickly","Lipase to exclude associated gallstone pancreatitis"],"imaging":["RUQ ultrasound — dilated CBD (stone itself is often not seen)","MRCP or EUS when the probability is intermediate","ERCP for high probability (stone seen on imaging, cholangitis, or bilirubin > 4 mg/dL with a dilated duct)"],"pitfalls":["A normal ultrasound does not exclude CBD stones; ultrasound misses many distal stones.","Early in obstruction transaminases may dominate and mimic acute hepatitis.","Painless jaundice with weight loss suggests malignant obstruction (pancreatic head, cholangiocarcinoma), not a stone.","Stones can form or remain after cholecystectomy."]},"chronic_hepatitis_b":{"id":"chronic_hepatitis_b","name":"Chronic hepatitis B","must_not_miss":false,"timecourse":["chronic"],"status":"draft","one_liner":"Persistently or intermittently raised ALT in an HBsAg-positive patient, often from mother-to-child transmission and with a family history of HBV or liver cancer; common in Taiwan and the main cause of cirrhosis and HCC.","symptoms":[{"item":"viral_history","options":["hbv","hbv_tx"],"state":"present","text":"Known HBV carrier"},{"item":"other_liver","options":["fhx_liver"],"state":"present","text":"Family history of HBV, cirrhosis, or HCC"},{"item":"lft_duration","options":["gt6m","first_found"],"text":"Chronic, or found on routine testing"},{"item":"assoc_sys","options":["jaundice"],"state":"absent","text":"Usually asymptomatic"},{"item":"age_group","options":["age_40_59","age_60_plus"],"text":"Middle-aged or older (HCC risk rises)"}],"pe":[{"item":"liver_pe","options":["spider","palmar"],"state":"present","text":"Stigmata if cirrhotic"},{"item":"palpable","options":["splenomegaly","ascites"],"state":"present","text":"Splenomegaly or ascites (cirrhosis)"}],"labs":["HBsAg, HBeAg / anti-HBe, HBV DNA, ALT — phase of infection and treatment criteria","Anti-HDV once; AFP; platelets, albumin, INR"],"imaging":["Ultrasound every 6 months (HCC surveillance) with AFP","Transient elastography for fibrosis"],"pitfalls":["Normal ALT does not exclude significant fibrosis — stage the liver.","HCC can occur without cirrhosis in HBV.","Taiwan NHI reimbursement criteria change over time — check the current rules before starting therapy."]},"chronic_hepatitis_c":{"id":"chronic_hepatitis_c","name":"Chronic hepatitis C","must_not_miss":false,"timecourse":["chronic"],"status":"draft","one_liner":"Mild, fluctuating ALT elevation in an anti-HCV-positive patient with past transfusion, injection drug use, dialysis, or unsafe injections; curable with direct-acting antivirals in almost all patients.","symptoms":[{"item":"viral_history","options":["hcv"],"state":"present","text":"Known HCV"},{"item":"viral_exposure","options":["transfusion","idu","tattoo"],"state":"present","text":"Transfusion, dialysis, injection drug use, tattoos"},{"item":"lft_duration","options":["gt6m","first_found"],"text":"Chronic, or found on routine testing"},{"item":"assoc_sys","options":["jaundice"],"state":"absent","text":"Usually asymptomatic"},{"item":"risk","options":["sti_risk"],"state":"present","text":"Sexual risk (especially MSM with HIV)"}],"pe":[{"item":"liver_pe","options":["spider","palmar"],"state":"present","text":"Stigmata if cirrhotic"},{"item":"palpable","options":["splenomegaly"],"state":"present","text":"Splenomegaly (cirrhosis)"}],"labs":["Anti-HCV, then HCV RNA to confirm active infection","HBsAg, HIV; platelets, albumin, INR"],"imaging":["Transient elastography or FIB-4 to stage fibrosis","HCC surveillance continues after cure if cirrhotic"],"pitfalls":["Anti-HCV stays positive after cure — use HCV RNA.","Check HBsAg before DAA therapy (HBV reactivation risk).","Southern Taiwan has historically higher prevalence; Taiwan aims to eliminate HCV."]},"chronic_pancreatitis":{"id":"chronic_pancreatitis","name":"Chronic pancreatitis","must_not_miss":false,"timecourse":["chronic"],"status":"draft","one_liner":"Recurrent or constant epigastric pain radiating to the back, worse after meals, in a heavy drinker or smoker, eventually with weight loss, steatorrhea and diabetes.","symptoms":[{"item":"pain_location","options":["epigastric","luq"],"text":"Epigastric (or LUQ) pain"},{"item":"radiation","options":["back"],"text":"Radiates to the back"},{"item":"meal_relation","options":["worse_eating"],"text":"Worse after meals"},{"item":"relieving","options":["leaning_forward"],"text":"Eased by leaning forward"},{"item":"episodes","options":["recurrent"],"text":"Recurrent attacks or continuous pain"},{"item":"duration","options":["m1_3","gt3m"],"text":"Chronic course"},{"item":"assoc_gi","options":["steatorrhea"],"state":"present","text":"Steatorrhea (late — exocrine insufficiency)"},{"item":"assoc_sys","options":["weight_loss"],"state":"present","text":"Weight loss"},{"item":"assoc_other","options":["food_fear"],"state":"present","text":"Avoids eating because of pain"},{"item":"risk","options":["alcohol","smoking","diabetes"],"state":"present","text":"Heavy alcohol use, smoking; diabetes develops later"},{"item":"stool_character","options":["greasy"],"text":"Greasy, foul-smelling stools that are hard to flush"},{"item":"food_trigger","options":["fatty_food"],"state":"present","text":"Worse after fatty meals"},{"item":"diarrhea_history","options":["chronic_pancreatitis"],"state":"present","text":"Known chronic pancreatitis"}],"pe":[{"item":"tenderness","options":["epigastric"],"text":"Epigastric tenderness"},{"item":"guarding","options":["soft"],"text":"Usually soft, no peritonism"},{"item":"palpable","options":["mass"],"state":"present","text":"Mass if a pseudocyst is present"},{"item":"skin","options":["icterus"],"state":"present","text":"Jaundice if the distal CBD is compressed"}],"labs":["Lipase is often normal or only mildly raised","Fecal elastase (exocrine function), glucose / HbA1c, fat-soluble vitamins","Liver tests (biliary stricture)"],"imaging":["CT — calcifications, duct dilatation, atrophy, pseudocysts","MRCP and EUS for early disease; EUS to exclude a mass"],"pitfalls":["Pancreatic cancer can mimic or complicate chronic pancreatitis — new weight loss, jaundice, or diabetes needs imaging.","Ongoing pain may come from a pseudocyst, duct obstruction, or opioid-induced hyperalgesia.","Lipase does not track disease activity."]},"cmv_hepatitis":{"id":"cmv_hepatitis","name":"CMV hepatitis","must_not_miss":false,"timecourse":["acute","subacute"],"status":"draft","one_liner":"Prolonged fever, fatigue and mild hepatitis with atypical lymphocytes but little sore throat in an immunocompetent adult (heterophile-negative mononucleosis), or more severe hepatitis in transplant recipients and immunosuppressed patients.","symptoms":[{"item":"assoc_sys","options":["fever","malaise"],"state":"present","text":"Prolonged fever and fatigue"},{"item":"viral_history","options":["immunosupp"],"state":"present","text":"Transplant, chemotherapy, or immunosuppression (severe disease)"},{"item":"risk","options":["immunocompromised"],"state":"present","text":"Immunocompromised (HIV, transplant)"},{"item":"viral_sx","options":["sore_throat"],"state":"absent","text":"Sore throat usually mild or absent (unlike EBV)"},{"item":"viral_sx","options":["myalgia"],"state":"present","text":"Myalgia"},{"item":"lft_duration","options":["lt1m","m1_6"],"text":"Weeks"},{"item":"age_group","options":["under_40","age_40_59"],"text":"Usually adults"}],"pe":[{"item":"vitals","options":["fever"],"state":"present","text":"Fever"},{"item":"palpable","options":["hepatomegaly","splenomegaly"],"state":"present","text":"Mild hepatosplenomegaly"},{"item":"infection_pe","options":["tonsillar_exudate"],"state":"absent","text":"No tonsillar exudate"}],"labs":["CBC — atypical lymphocytosis; heterophile negative","CMV IgM (and IgG avidity) in the immunocompetent; CMV PCR (blood) in the immunocompromised","ALT usually < 5 × ULN"],"imaging":["Usually not needed; ultrasound for hepatosplenomegaly"],"pitfalls":["In transplant or immunosuppressed patients, check blood CMV PCR early and look for end-organ disease (colitis, retinitis, pneumonitis).","In pregnancy, primary CMV matters for the fetus."]},"colorectal_cancer":{"id":"colorectal_cancer","name":"Colorectal cancer","must_not_miss":false,"timecourse":["subacute","chronic"],"status":"draft","one_liner":"Change in bowel habit, rectal bleeding or iron-deficiency anemia with weight loss in a patient over 50 (or with a family history); left-sided tumors obstruct and bleed, right-sided tumors present with anemia.","symptoms":[{"item":"assoc_gi","options":["bowel_change","constipation","diarrhea"],"state":"present","text":"Change in bowel habit"},{"item":"assoc_gi","options":["hematochezia","melena"],"state":"present","text":"Rectal bleeding or melena (right-sided)"},{"item":"assoc_sys","options":["weight_loss"],"state":"present","text":"Weight loss"},{"item":"assoc_sys","options":["malaise"],"state":"present","text":"Fatigue (anemia)"},{"item":"assoc_gi","options":["tenesmus"],"state":"present","text":"Tenesmus (rectal cancer)"},{"item":"assoc_gi","options":["obstipation","bloating"],"state":"present","text":"Obstructive symptoms"},{"item":"onset","options":["gradual"],"text":"Insidious"},{"item":"duration","options":["w1_4","m1_3","gt3m"],"text":"Weeks to months"},{"item":"age_group","options":["age_40_59","age_60_plus"],"text":"Mostly over 50 (rising incidence in younger adults)"},{"item":"risk","options":["gi_cancer_fhx","ibd"],"state":"present","text":"Family history, long-standing IBD"},{"item":"stool_character","options":["bloody","loose"],"text":"Loose stools, sometimes with blood"},{"item":"diarrhea_pattern","options":["alternating"],"text":"Alternating diarrhea and constipation"},{"item":"diarrhea_duration","options":["w2_4","m1_3","gt3m"],"text":"Weeks to months; new onset after 50 is an alarm feature"}],"pe":[{"item":"skin","options":["pallor"],"state":"present","text":"Pallor"},{"item":"palpable","options":["mass","hepatomegaly"],"state":"present","text":"Abdominal mass; hepatomegaly (metastases)"},{"item":"rectal","options":["mass","fresh_blood","melena"],"text":"Rectal mass or blood on rectal exam"},{"item":"abd_contour","options":["mild","marked"],"text":"Distension if obstructing"}],"labs":["CBC, ferritin (iron-deficiency anemia), liver tests","Fecal immunochemical test (FIT) is for screening, not for symptomatic patients","CEA for staging / follow-up, not diagnosis"],"imaging":["Colonoscopy with biopsy","CT chest / abdomen / pelvis for staging; pelvic MRI for rectal cancer"],"pitfalls":["Iron-deficiency anemia in a man or post-menopausal woman needs both upper and lower endoscopy.","Do not attribute rectal bleeding to hemorrhoids without examining the colon in at-risk patients.","Obstructing cancer can present as large bowel obstruction or perforation."]},"congestive_hepatopathy":{"id":"congestive_hepatopathy","name":"Congestive hepatopathy","must_not_miss":false,"timecourse":["subacute","chronic"],"status":"draft","one_liner":"Mild cholestatic or mixed liver test abnormalities with raised bilirubin and a tender, enlarged liver in a patient with right-sided heart failure, tricuspid regurgitation, or constrictive pericarditis.","symptoms":[{"item":"congestion_sx","options":["heart_failure"],"state":"present","text":"Known heart failure or valve disease"},{"item":"congestion_sx","options":["orthopnea","leg_swelling"],"state":"present","text":"Orthopnea, leg swelling"},{"item":"assoc_other","options":["dyspnea"],"state":"present","text":"Exertional dyspnea"},{"item":"liver_warning","options":["distension"],"state":"present","text":"Abdominal swelling (ascites)"},{"item":"pain_location","options":["ruq"],"text":"RUQ fullness or ache"},{"item":"assoc_sys","options":["jaundice"],"state":"present","text":"Mild jaundice"}],"pe":[{"item":"congestion_pe","options":["jvp","hjr"],"state":"present","text":"Raised JVP, hepatojugular reflux"},{"item":"congestion_pe","options":["edema","crackles"],"state":"present","text":"Leg edema, crackles"},{"item":"palpable","options":["hepatomegaly","liver_tender"],"state":"present","text":"Tender hepatomegaly (pulsatile in TR)"},{"item":"palpable","options":["ascites"],"state":"present","text":"Ascites"}],"labs":["Mild rise in bilirubin, GGT, ALP; ALT modest","BNP / NT-proBNP","Ascitic fluid: high protein (> 2.5 g/dL) with SAAG ≥ 1.1"],"imaging":["Echocardiography","Ultrasound with Doppler — dilated hepatic veins and IVC"],"pitfalls":["Long-standing congestion can cause cardiac cirrhosis (e.g., after Fontan surgery).","Treat the heart; liver tests follow."]},"constipation":{"id":"constipation","name":"Constipation","must_not_miss":false,"timecourse":["subacute","chronic"],"status":"draft","one_liner":"Crampy lower
