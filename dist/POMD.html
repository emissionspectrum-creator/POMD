ns":["wakes"],"text":"Wakes the patient at night (typical of duodenal ulcer)"},{"item":"relieving","options":["antacid"],"text":"Relieved by antacids or acid suppression"},{"item":"episodes","options":["recurrent"],"text":"Episodic, recurring over weeks to months"},{"item":"assoc_gi","options":["nausea","bloating","early_satiety"],"state":"present","text":"Nausea, bloating, or early satiety"},{"item":"risk","options":["nsaid","hpylori","pud"],"state":"present","text":"NSAID / aspirin use, H. pylori, or a prior ulcer"},{"item":"assoc_gi","options":["melena","hematemesis"],"state":"present","text":"Melena or hematemesis signal a bleeding ulcer"},{"item":"assoc_sys","options":["weight_loss"],"state":"absent","text":"No weight loss (weight loss raises concern for malignancy)"}],"pe":[{"item":"tenderness","options":["epigastric"],"text":"Mild epigastric tenderness"},{"item":"guarding","options":["soft"],"text":"Soft abdomen without peritoneal signs (rigidity suggests perforation)"},{"item":"skin","options":["pallor"],"state":"present","text":"Pallor if there is chronic blood loss"},{"item":"rectal","options":["melena"],"text":"Melena on rectal exam if bleeding"}],"labs":["CBC — iron-deficiency anemia from occult bleeding","H. pylori test (urea breath test or stool antigen; hold PPI for 2 weeks beforehand)","Otherwise usually normal"],"imaging":["EGD for alarm features (bleeding, anemia, weight loss, dysphagia, persistent vomiting) or age ≥ 60","Biopsy every gastric ulcer and confirm healing by repeat EGD"],"pitfalls":["Symptoms alone cannot reliably separate PUD, functional dyspepsia, and gastric cancer.","NSAID-related ulcers are often painless and first present with bleeding or perforation.","Sudden severe pain with rigidity means perforation; persistent vomiting suggests gastric outlet obstruction.","PPI use, antibiotics, and bismuth cause false-negative H. pylori tests.","Exclude ACS in older patients with new \"epigastric\" pain, especially on exertion."]},"perforated_peptic_ulcer":{"id":"perforated_peptic_ulcer","name":"Perforated peptic ulcer","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Sudden, severe epigastric pain that rapidly becomes generalized, with a rigid, silent abdomen, in a patient with ulcer history, NSAID use or smoking; free air on upright X-ray or CT.","symptoms":[{"item":"onset","options":["sudden"],"text":"Abrupt onset — patients often recall the exact moment"},{"item":"pain_location","options":["epigastric","diffuse"],"text":"Epigastric pain becoming diffuse"},{"item":"pain_migration","options":["local_to_diffuse"],"text":"Spreads from the epigastrium over the whole abdomen"},{"item":"severity","options":["s8","s9","s10"],"text":"Severe pain"},{"item":"aggravating","options":["movement"],"text":"Worse with any movement or breathing"},{"item":"relieving","options":["lying_still"],"text":"Lies still to avoid pain"},{"item":"radiation","options":["r_shoulder"],"text":"Shoulder-tip pain from diaphragmatic irritation"},{"item":"risk","options":["nsaid","pud","smoking","hpylori"],"state":"present","text":"NSAID / aspirin use, prior ulcer, smoking, H. pylori"},{"item":"precipitant","options":["nsaid"],"text":"Recent NSAID or steroid use"}],"pe":[{"item":"guarding","options":["rigid","involuntary"],"text":"Board-like rigidity / involuntary guarding"},{"item":"rebound","options":["present"],"text":"Rebound tenderness"},{"item":"tenderness","options":["epigastric","diffuse"],"text":"Epigastric then diffuse tenderness"},{"item":"bowel_sounds","options":["hypo","absent"],"text":"Reduced or absent bowel sounds"},{"item":"general","options":["lying_still"],"text":"Lying still, reluctant to move"},{"item":"vitals","options":["tachycardia","fever"],"state":"present","text":"Tachycardia; fever develops later"}],"labs":["Leukocytosis; lipase can be mildly raised","Lactate, creatinine, and electrolytes for resuscitation"],"imaging":["Erect chest X-ray — free subdiaphragmatic air (absent in a sizable minority)","CT abdomen — more sensitive for small amounts of free air and locating the perforation"],"pitfalls":["Elderly patients, those on steroids, and the immunosuppressed may have few peritoneal signs.","Absence of free air on X-ray does not exclude perforation.","A raised lipase can mislead toward pancreatitis.","Initial chemical peritonitis may briefly \"improve\" before bacterial peritonitis sets in."]},"perforation_peritonitis":{"id":"perforation_peritonitis","name":"Hollow viscus perforation / peritonitis","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Severe, constant, diffuse abdominal pain worsened by any movement, with the patient lying still, a rigid abdomen, rebound tenderness, fever and tachycardia — from perforation of the stomach, bowel, or appendix.","symptoms":[{"item":"pain_location","options":["diffuse"],"text":"Diffuse pain (may start localized)"},{"item":"pain_migration","options":["local_to_diffuse"],"text":"Localized pain spreading over the whole abdomen"},{"item":"onset","options":["sudden","hours"],"text":"Sudden (perforation) or progressive onset"},{"item":"pain_pattern","options":["constant"],"text":"Constant pain"},{"item":"severity","options":["s8","s9","s10"],"text":"Severe"},{"item":"aggravating","options":["movement"],"text":"Worse with movement, coughing, bumps in the road"},{"item":"relieving","options":["lying_still"],"text":"Lies still"},{"item":"assoc_sys","options":["fever"],"state":"present","text":"Fever"},{"item":"assoc_gi","options":["vomiting","anorexia"],"state":"present","text":"Vomiting, anorexia"}],"pe":[{"item":"guarding","options":["rigid","involuntary"],"text":"Rigidity / involuntary guarding"},{"item":"rebound","options":["present"],"text":"Rebound tenderness; pain with percussion or heel drop"},{"item":"tenderness","options":["diffuse"],"text":"Diffuse tenderness"},{"item":"bowel_sounds","options":["hypo","absent"],"text":"Reduced or absent bowel sounds"},{"item":"general","options":["lying_still","ill"],"text":"Ill-appearing, lying still"},{"item":"vitals","options":["fever","tachycardia","hypotension"],"state":"present","text":"Fever, tachycardia, hypotension (sepsis)"}],"labs":["Leukocytosis (or leukopenia), raised CRP and lactate","Electrolytes, creatinine, coagulation, blood cultures, type and screen"],"imaging":["Erect chest X-ray for free air","CT abdomen / pelvis — free air, fluid, source"],"pitfalls":["Steroids, immunosuppression, old age, and spinal cord injury blunt peritoneal signs.","Analgesia does not mask peritonitis enough to delay diagnosis — give it.","Spontaneous bacterial peritonitis in cirrhosis presents subtly (fever, encephalopathy) and is managed medically."]},"pid":{"id":"pid","name":"Pelvic inflammatory disease","must_not_miss":false,"timecourse":["acute","subacute"],"status":"draft","one_liner":"Bilateral lower abdominal / pelvic pain with abnormal vaginal discharge, dyspareunia, and fever in a sexually active woman, with cervical motion, uterine, or adnexal tenderness.","symptoms":[{"item":"sex","options":["female"],"text":"Sexually active woman"},{"item":"pain_location","options":["suprapubic","rlq","llq"],"text":"Bilateral lower abdominal or pelvic pain"},{"item":"onset","options":["gradual","hours"],"text":"Gradual onset, often during or after menses"},{"item":"assoc_gu","options":["vaginal_discharge"],"state":"present","text":"Abnormal vaginal discharge"},{"item":"assoc_gu","options":["dyspareunia"],"state":"present","text":"Dyspareunia"},{"item":"assoc_gu","options":["vaginal_bleeding"],"state":"present","text":"Intermenstrual or postcoital bleeding"},{"item":"assoc_sys","options":["fever"],"state":"present","text":"Fever (not always)"},{"item":"risk","options":["sti_risk"],"state":"present","text":"New or multiple sexual partners, prior STI"},{"item":"radiation","options":["r_shoulder"],"text":"RUQ / right shoulder pain (Fitz-Hugh–Curtis perihepatitis)"}],"pe":[{"item":"pelvic","options":["cmt"],"state":"present","text":"Cervical motion tenderness"},{"item":"pelvic","options":["adnexal_tender"],"state":"present","text":"Adnexal tenderness (usually bilateral)"},{"item":"pelvic","options":["cervical_discharge"],"state":"present","text":"Mucopurulent cervical discharge"},{"item":"pelvic","options":["adnexal_mass"],"state":"present","text":"Adnexal mass suggests tubo-ovarian abscess"},{"item":"tenderness","options":["suprapubic","rlq","llq"],"text":"Lower abdominal tenderness"},{"item":"vitals","options":["fever"],"state":"present","text":"Fever"}],"labs":["hCG (exclude ectopic pregnancy)","NAAT for gonorrhea and chlamydia; CBC, CRP; HIV and syphilis screening"],"imaging":["Transvaginal ultrasound if severe, or to exclude tubo-ovarian abscess"],"pitfalls":["Clinical diagnosis has a low threshold — treat empirically when minimum criteria are met.","Always exclude ectopic pregnancy and appendicitis.","Treat partners; follow up within 72 h."]},"renal_colic":{"id":"renal_colic","name":"Renal colic (urolithiasis)","must_not_miss":false,"timecourse":["acute"],"status":"draft","one_liner":"Sudden severe colicky flank pain radiating to the groin in a restless patient who cannot find a comfortable position, with hematuria, nausea and vomiting.","symptoms":[{"item":"pain_location","options":["flank_r","flank_l","rlq","llq"],"text":"Flank pain (lower quadrant as the stone descends)"},{"item":"onset","options":["sudden"],"text":"Sudden onset"},{"item":"pain_quality","options":["colicky","sharp"],"text":"Colicky, sharp"},{"item":"pain_pattern","options":["waves"],"text":"Comes in waves"},{"item":"severity","options":["s7","s8","s9","s10"],"text":"Severe"},{"item":"radiation","options":["groin"],"text":"Radiates to the groin, testis, or labia"},{"item":"relieving","options":["no_position"],"text":"No position of comfort"},{"item":"assoc_gu","options":["hematuria"],"state":"present","text":"Hematuria"},{"item":"assoc_gu","options":["frequency","dysuria"],"state":"present","text":"Urgency or frequency (distal ureteric stone)"},{"item":"assoc_gi","options":["nausea","vomiting"],"state":"present","text":"Nausea and vomiting"},{"item":"risk","options":["kidney_stones"],"state":"present","text":"Previous stones"}],"pe":[{"item":"general","options":["restless"],"text":"Restless, writhing"},{"item":"cva_tenderness","options":["right","left"],"text":"CVA tenderness"},{"item":"guarding","options":["soft"],"text":"Soft abdomen, no peritonism"},{"item":"vitals","options":["fever"],"state":"absent","text":"Afebrile (fever + obstruction = emergency)"}],"labs":["Urinalysis (hematuria in most, but not all)","Creatinine; CBC and urine culture if fever"],"imaging":["Non-contrast CT KUB (low-dose) or ultrasound for hydronephrosis","Ultrasound first in pregnancy and young patients with prior stones"],"pitfalls":["Fever with an obstructed kidney is a urologic emergency — needs decompression.","First \"renal colic\" over 60 — exclude ruptured AAA.","Absence of hematuria does not exclude a stone; hematuria also occurs with AAA and appendicitis.","In women, consider ovarian torsion and ectopic pregnancy."]},"rll_pneumonia":{"id":"rll_pneumonia","name":"Right lower lobe pneumonia","must_not_miss":false,"timecourse":["acute"],"status":"draft","one_liner":"Fever, cough and pleuritic RUQ or upper abdominal pain from diaphragmatic pleural irritation, with crackles at the right base and a benign abdominal exam.","symptoms":[{"item":"pain_location","options":["ruq","epigastric"],"text":"RUQ or upper abdominal pain"},{"item":"aggravating","options":["deep_breath"],"text":"Worse with deep breathing or coughing (pleuritic)"},{"item":"assoc_other","options":["cough"],"state":"present","text":"Cough, sometimes productive"},{"item":"assoc_other","options":["dyspnea"],"state":"present","text":"Shortness of breath"},{"item":"assoc_sys","options":["fever","chills"],"state":"present","text":"Fever and chills"},{"item":"duration","options":["h6_24","d1_3","d4_7"],"text":"Acute onset over days"}],"pe":[{"item":"chest","options":["crackles_r"],"state":"present","text":"Crackles or bronchial breath sounds at the right base"},{"item":"vitals","options":["fever"],"state":"present","text":"Fever"},{"item":"vitals","options":["tachypnea","hypoxemia"],"state":"present","text":"Tachypnea, low oxygen saturation"},{"item":"guarding","options":["soft"],"text":"Abdomen soft; tenderness, if any, is mild and not peritoneal"},{"item":"abd_signs","options":["murphy"],"state":"absent","text":"Murphy's sign negative"}],"labs":["Leukocytosis, raised CRP; procalcitonin if available","Liver tests and lipase are usually normal"],"imaging":["Chest X-ray (PA and lateral) — lower lobe consolidation can hide behind the diaphragm on a supine film","Lung bases are visible on abdominal CT — always review them"],"pitfalls":["Always auscultate the lung bases in RUQ or upper abdominal pain.","Children and the elderly often have fewer respiratory symptoms.","Pulmonary embolism with infarction and pleural effusion can produce the same picture."]},"ruptured_aaa":{"id":"ruptured_aaa","name":"Ruptured abdominal aortic aneurysm","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Sudden severe abdominal, back, or flank pain with syncope or hypotension in an older male smoker; a pulsatile mass may be felt. Classic triad is present in only about half.","symptoms":[{"item":"onset","options":["sudden"],"text":"Sudden onset"},{"item":"severity","options":["s8","s9","s10"],"text":"Severe pain"},{"item":"pain_location","options":["diffuse","periumbilical","flank_l","flank_r"],"text":"Abdominal, back, or flank pain"},{"item":"radiation","options":["back","groin"],"text":"Radiates to the back, flank, or groin"},{"item":"assoc_other","options":["syncope"],"state":"present","text":"Syncope or near-syncope"},{"item":"age_group","options":["age_60_plus"],"text":"Usually over 60"},{"item":"sex","options":["male"],"text":"Men more than women"},{"item":"risk","options":["aaa","smoking","atherosclerosis"],"state":"present","text":"Known AAA, smoking, atherosclerotic disease"}],"pe":[{"item":"vitals","options":["hypotension","tachycardia"],"state":"present","text":"Hypotension, tachycardia"},{"item":"palpable","options":["pulsatile"],"state":"present","text":"Pulsatile, tender epigastric / periumbilical mass (often not felt in obese patients)"},{"item":"general","options":["pale_diaphoretic"],"text":"Pale and diaphoretic"},{"item":"skin","options":["ecchymosis"],"state":"present","text":"Flank or periumbilical ecchymosis (retroperitoneal blood)"}],"labs":["Type and crossmatch, CBC, coagulation, creatinine — do not delay surgery for results"],"imaging":["Bedside ultrasound of the aorta if unstable","CT angiography if stable enough"],"pitfalls":["Commonly misdiagnosed as renal colic — first \"renal colic\" in a patient over 60 needs the aorta imaged.","Hypotension may be transient; a contained rupture can look stable.","A normal-sized aorta on ultrasound does not exclude aortic dissection."]},"sigmoid_volvulus":{"id":"sigmoid_volvulus","name":"Sigmoid volvulus","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Massive abdominal distension with colicky pain and obstipation in an elderly, often institutionalized or neurologically impaired patient with chronic constipation; risk of strangulation and perforation.","symptoms":[{"item":"assoc_gi","options":["obstipation"],"state":"present","text":"No stool or flatus"},{"item":"assoc_gi","options":["bloating"],"state":"present","text":"Marked distension"},{"item":"pain_quality","options":["colicky","cramping"],"text":"Colicky pain"},{"item":"pain_location","options":["llq","diffuse"],"text":"LLQ or diffuse pain"},{"item":"assoc_gi","options":["vomiting"],"state":"present","text":"Vomiting (late)"},{"item":"age_group","options":["age_60_plus"],"text":"Elderly"},{"item":"risk","options":["chronic_constipation","retention_drugs"],"state":"present","text":"Chronic constipation, psychotropic or anticholinergic drugs, neurologic disease"},{"item":"episodes","options":["recurrent"],"text":"Previous similar episodes are common"}],"pe":[{"item":"abd_contour","options":["marked"],"text":"Massive, tympanic distension"},{"item":"tenderness","options":["diffuse","llq","none"],"text":"Variable tenderness — peritonism suggests gangrene"},{"item":"rectal","options":["empty"],"text":"Empty rectum"},{"item":"vitals","options":["fever","tachycardia","hypotension"],"state":"present","text":"Fever, tachycardia, hypotension — strangulation"}],"labs":["Electrolytes, creatinine, CBC, lactate"],"imaging":["Plain X-ray — \"coffee bean\" dilated sigmoid loop","CT — whirl sign, transition point, ischemia","Endoscopic detorsion if no peritonitis; most recur without elective surgery"],"pitfalls":["Signs of ischemia or perforation mean emergency surgery, not endoscopy.","Cecal volvulus occurs in younger patients and is not amenable to endoscopic detorsion.","Distinguish from colonic pseudo-obstruction (Ogilvie) on CT."]},"small_bowel_obstruction":{"id":"small_bowel_obstruction","name":"Small bowel obstruction","must_not_miss":true,"timecourse":["acute"],"status":"draft","one_liner":"Colicky periumbilical pain coming in waves with vomiting, distension and inability to pass stool or flatus, usually from adhesions after surgery or a hernia; constant pain or fever suggests strangulation.","symptoms":[{"item":"pain_location","options":["periumbilical","diffuse"],"text":"Periumbilical or diffuse pain"},{"item":"pain_quality","options":["colicky","cramping"],"text":"Colicky, crampy pain"},{"item":"pain_pattern","options":["waves"],"text":"Comes in waves; becoming constant suggests ischemia"},{"item":"assoc_gi","options":["vomiting"],"state":"present","text":"Vomiting — early and bilious in proximal obstruction"},{"item":"assoc_gi","options":["obstipation"],"state":"present","text":"No stool or flatus (may still pass stool early)"},{"item":"assoc_gi","options":["bloating"],"stat ,"small_bowel_obstruction","acute_mesenteric_ischemia","acute_gastroenteritis","ibs","constipation","perforation_peritonitis","ruptured_aaa","dka"]},{"group":"RLQ","locations":["rlq"],"diseases":["acute_appendicitis","crohns_disease","infectious_ileocecitis","ectopic_pregnancy","ovarian_torsion","diverticulitis"]},{"group":"LLQ","locations":["llq"],"diseases":["diverticulitis","ischemic_colitis","ulcerative_colitis","colorectal_cancer","sigmoid_volvulus","ectopic_pregnancy","ovarian_torsion"]},{"group":"Suprapubic","locations":["suprapubic"],"diseases":["cystitis","acute_urinary_retention","pid"]},{"group":"Flank","locations":["flank_r","flank_l"],"diseases":["renal_colic","acute_pyelonephritis","ruptured_aaa"]}],"hpi":{"joiner":" ","sentences":[{"always":true,"parts":["{sex|the patient}[, aged {age_group},] presented with {pain_location|abdominal pain}[ {duration}]","{onset}","{pain_migration}","{pain_quality}","{pain_pattern}","{severity}","{nocturnal}","{precipitant}","{meal_relation}","{aggravating}","{relieving}","{radiation}"]},{"parts":["{episodes}"]},{"lead":"Associated with ","parts":["{assoc_gi+,assoc_sys+,assoc_gu+,assoc_other+}"]},{"lead":"Denied ","parts":["{assoc_gi-,assoc_sys-,assoc_gu-,assoc_other-}"]},{"parts":["{repro_status}"]},{"lead":"Relevant history includes ","parts":["{risk+}"]},{"lead":"No history of ","parts":["{risk-}"]}]},"pe_text":{"joiner":"\n","sentences":[{"lead":"General: ","parts":["{general}"]},{"lead":"Vital signs: ","parts":["{vitals*}"]},{"lead":"Skin & eyes: ","parts":["{skin*}"]},{"lead":"Chest: ","parts":["{chest*}"]},{"lead":"Abdomen: ","parts":["{abd_contour}","{bowel_sounds}","{guarding}","{tenderness}","{rebound}","{abd_signs*}","{palpable*}","{cva_tenderness}","{hernia}"]},{"lead":"Rectal exam: ","parts":["{rectal}"]},{"lead":"Pelvic exam: ","parts":["{pelvic*}"]}]},"quick":{"show":["sex","age_group","repro_status","pain_location","duration","pain_migration","pain_quality","pain_pattern","severity","nocturnal","onset"," <script>
/*
 * POMD core logic — pure functions, no DOM access.
 * Loaded by both browser pages (dist/POMD.html, dist/POMD-history.html) and by the Node tests.
 *
 * Selection state shape:
 *   { [itemId]: { [optionId]: true | 'present' | 'absent' } }
 *   - single / multi items store `true` for each selected option
 *   - presence items store 'present' or 'absent' per option
 */
(function (root) {
  'use strict';

  // ---------- data preparation ----------

  // Adds lookup maps to the data produced by build.py. Safe to call twice.
  function prepare(data) {
    Object.keys(data.items).forEach(function (id) {
      var item = data.items[id];
      if (item.optById) return;
      item.optById = {};
      item.options.forEach(function (o) { item.optById[o.id] = o; });
    });
    return data;
  }

  // ---------- selection ----------

  function toggle(state, item, optId) {
    var sel = state[item.id] || (state[item.id] = {});
    var k;
    if (item.type === 'presence') {
      var v = sel[optId];
      if (!v) sel[optId] = 'present';
      else if (v === 'present') sel[optId] = 'absent';
      else delete sel[optId];
    } else if (item.type === 'single') {
      var had = !!sel[optId];
      for (k in sel) delete sel[k];
      if (!had) sel[optId] = true;
    } else {
      if (sel[optId]) {
        delete sel[optId];
      } else {
        var exclusive = !!item.optById[optId].exclusive;
        for (k in sel) {
          if (exclusive || item.optById[k].exclusive) delete sel[k];
        }
        sel[optId] = true;
      }
    }
    if (Object.keys(sel).length === 0) delete state[item.id];
    return state;
  }

  function isEmpty(state) {
    return Object.keys(state).length === 0;
  }

  // Selected options of an item, in the item's option order.
  function selectedOptions(item, state) {
    var sel = state[item.id];
    if (!sel) return [];
    return item.options.filter(function (o) { return !!sel[o.id]; });
  }

  // ---------- disease feature comparison ----------

  // feature: { item, options: [...], state?: 'present' | 'absent' }
  // returns 'match' | 'different' | 'none'
  function featureStatus(feature, state, items) {
    var sel = state[feature.item];
    var item = items[feature.item];
    if (!sel || !item) return 'none';
    var i;
    if (item.type === 'presence') {
      // "item = a | b"    → any of a, b present = match
      // "item = no a | b" → none of a, b present (at least one marked absent) = match
      var present = false;
      var absent = false;
      for (i = 0; i < feature.options.length; i++) {
        var v = sel[feature.options[i]];
        if (v === 'present') present = true;
        else if (v === 'absent') absent = true;
      }
      if (feature.state === 'absent') return present ? 'different' : (absent ? 'match' : 'none');
      return present ? 'match' : (absent ? 'different' : 'none');
    }
    for (i = 0; i < feature.options.length; i++) {
      if (sel[feature.options[i]]) return 'match';
    }
    return 'different';
  }

  // Human-readable description of what is currently selected for a feature's item
  // (used to explain an orange "Different" status).
  function describeSelection(feature, state, items) {
    var item = items[feature.item];
    var sel = state[feature.item];
    if (!item || !sel) return '';
    if (item.type === 'presence') {
      return feature.options
        .filter(function (o) { return sel[o]; })
        .map(function (o) { return (sel[o] === 'present' ? '+ ' : '− ') + item.optById[o].label; })
        .join(', ');
    }
    return selectedOptions(item, state).map(function (o) { return o.label; }).join(', ');
  }

  function diseaseFeatures(disease) {
    return (disease.symptoms || []).concat(disease.pe || []);
  }

  function matchCount(disease, state, items) {
    return diseaseFeatures(disease).filter(function (f) {
      return featureStatus(f, state, items) === 'match';
    }).length;
  }

  // Time-course tags (acute / subacute / chronic) implied by the current selection.
  function selectedTimecourses(complaint, state, items) {
    var item = items[complaint.timecourse_item];
    var out = [];
    if (!item) return out;
    selectedOptions(item, state).forEach(function (o) {
      (o.tc || []).forEach(function (t) { if (out.indexOf(t) < 0) out.push(t); });
    });
    return out;
  }

  // 'match' | 'different' | 'none'
  function timecourseStatus(disease, selectedTc) {
    if (!selectedTc.length) return 'none';
    for (var i = 0; i < selectedTc.length; i++) {
      if ((disease.timecourse || []).indexOf(selectedTc[i]) >= 0) return 'match';
    }
    return 'different';
  }

  // Groups whose locations intersect the selected pain locations move to the top;
  // otherwise the order defined in the complaint is kept.
  function orderGroups(complaint, state) {
    var sel = state[complaint.location_item] || {};
    var promoted = [];
    var rest = [];
    complaint.ddx.forEach(function (g) {
      var hit = (g.locations || []).some(function (l) { return !!sel[l]; });
      (hit ? promoted : rest).push({ group: g, promoted: hit });
    });
    return promoted.concat(rest);
  }

  // Flat, de-duplicated disease list sorted by match count (high → low).
  // Ties keep the location order from orderGroups(), so promoted groups come first.
  // Returns [{ id, n, groups: [group label...] }].
  function rankByMatches(complaint, diseases, state, items) {
    var byId = {};
    var list = [];
    orderGroups(complaint, state).forEach(function (entry) {
      entry.group.diseases.forEach(function (id) {
        if (!byId[id]) {
          byId[id] = { id: id, n: matchCount(diseases[id], state, items), groups: [], order: list.length };
          list.push(byId[id]);
        }
        byId[id].groups.push(entry.group.group);
      });
    });
    list.sort(function (a, b) { return (b.n - a.n) || (a.order - b.order); });
    return list.map(function (x) { return { id: x.id, n: x.n, groups: x.groups }; });
  }

  // ---------- text generation ----------

  function joinList(arr, conj) {
    if (arr.length === 0) return '';
    if (arr.length === 1) return arr[0];
    if (conj === ',') return arr.join(', ');
    if (arr.length === 2) return arr[0] + ' ' + conj + ' ' + arr[1];
    return arr.slice(0, -1).join(', ') + ', ' + conj + ' ' + arr[arr.length - 1];
  }

  function applyTemplate(tpl, text) {
    return tpl ? tpl.replace('{}', text) : text;
  }

  // Renders one item reference into a list of text pieces.
  // mode: '' (default), '+' (present only), '-' (absent only), '*' (present and absent)
  function renderRef(item, mode, state) {
    var sel = state[item.id];
    if (!sel) return [];
    if (item.type === 'presence') {
      var pos = [];
      var neg = [];
      item.options.forEach(function (o) {
        if (sel[o.id] === 'present') pos.push(o.frag);
        else if (sel[o.id] === 'absent') neg.push(mode === '-' ? o.frag : (o.frag_neg || 'no ' + o.frag));
      });
      if (mode === '+') return pos;
      if (mode === '-') return neg;
      // '*' (and default): positive findings first, then negatives — avoids "no A, B" ambiguity
      var all = pos.concat(neg);
      return all.length ? [joinList(all, item.join || 'and')] : [];
    }
    var opts = selectedOptions(item, state);
    if (!opts.length) return [];
    var normal = opts.filter(function (o) { return !o.exclusive; }).map(function (o) { return o.frag; });
    var excl = opts.filter(function (o) { return o.exclusive; }).map(function (o) { return o.frag; });
    var pieces = [];
    if (normal.length) pieces.push(applyTemplate(item.template, joinList(normal, item.join || 'and')));
    return pieces.concat(excl);
  }

  // Parses a template string into tokens:
  //   { t: 'text', v } | { t: 'ph', refs: [{id, mode}], def } | { t: 'opt', tokens: [...] }
  function parseTemplate(tpl) {
    var tokens = [];
    var stack = [tokens];
    var cur = tokens;
    var buf = '';
    function flush() { if (buf) { cur.push({ t: 'text', v: buf }); buf = ''; } }
    for (var i = 0; i < tpl.length; i++) {
      var c = tpl[i];
      if (c === '[') {
        flush();
        var seg = { t: 'opt', tokens: [] };
        cur.push(seg);
        stack.push(seg.tokens);
        cur = seg.tokens;
      } else if (c === ']') {
        flush();
        stack.pop();
        cur = stack[stack.length - 1];
      } else if (c === '{') {
        flush();
        var end = tpl.indexOf('}', i);
        cur.push(parsePlaceholder(tpl.slice(i + 1, end)));
        i = end;
      } else {
        buf += c;
      }
    }
    flush();
    return tokens;
  }

  function parsePlaceholder(body) {
    var bar = body.indexOf('|');
    var def = bar >= 0 ? body.slice(bar + 1) : null;
    var refs = (bar >= 0 ? body.slice(0, bar) : body).split(',').map(function (r) {
      r = r.trim();
      var last = r.charAt(r.length - 1);
      if (last === '+' || last === '-' || last === '*') return { id: r.slice(0, -1), mode: last };
      return { id: r, mode: '' };
    });
    return { t: 'ph', refs: refs, def: def };
  }

  function renderPlaceholder(ph, state, items) {
    var pieces = [];
    var conj = null;
    ph.refs.forEach(function (r) {
      var item = items[r.id];
      if (!item) return;
      pieces = pieces.concat(renderRef(item, r.mode, state));
      if (conj === null) {
        conj = r.mode === '-' ? 'or' : (r.mode === '+' ? 'and' : (item.join || 'and'));
      }
    });
    return joinList(pieces, conj || 'and');
  }

  // Returns { text, ok, filled }:
  //   ok     — false when a required placeholder (outside [...] and without default) is empty
  //   filled — true when at least one placeholder produced real (non-default) content
  function renderTokens(tokens, state, items) {
    var text = '';
    var ok = true;
    var filled = false;
    tokens.forEach(function (tk) {
      if (tk.t === 'text') {
        text += tk.v;
      } else if (tk.t === 'ph') {
        var v = renderPlaceholder(tk, state, items);
        if (v) { text += v; filled = true; }
        else if (tk.def !== null) text += tk.def;
        else ok = false;
      } else {
        var sub = renderTokens(tk.tokens, state, items);
        if (sub.ok && sub.filled) { text += sub.text; filled = true; }
      }
    });
    return { text: text, ok: ok, filled: filled };
  }

  var templateCache = {};
  function renderTemplate(tpl, state, items) {
    var tokens = templateCache[tpl] || (templateCache[tpl] = parseTemplate(tpl));
    return renderTokens(tokens, state, items);
  }

  function capitalize(s) {
    return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  }

  // spec: { joiner, sentences: [{ lead?, parts: [tpl...], sep?, end?, always? }] }
  function composeText(spec, state, items) {
    var out = [];
    (spec.sentences || []).forEach(function (s) {
      var parts = [];
      var filled = false;
      s.parts.forEach(function (p) {
        var r = renderTemplate(p, state, items);
        if (!r.ok) return;
        if (r.filled) filled = true;
        if (r.text.trim()) parts.push(r.text.trim());
      });
      if (!parts.length || (!filled && !s.always)) return;
      var sep = s.sep === undefined ? ', ' : s.sep;
      var end = s.end === undefined ? '.' : s.end;
      out.push(capitalize((s.lead || '') + parts.join(sep) + end));
    });
    return out.join(spec.joiner === undefined ? ' ' : spec.joiner);
  }

  // ---------- shared state (localStorage, both pages) ----------

  // localStorage keys. The patient state is shared by dist/POMD.html and dist/POMD-history.html
  // (same file:// origin in Edge / Chrome) and kept until "New patient".
  var STATE_KEY = 'pomd.patient.v1';
  var LAYOUT_KEY = 'pomd.quickLayout.v1';

  // Keeps only known items / options with values valid for the item type.
  function sanitizeState(raw, items) {
    var out = {};
    if (!raw || typeof raw !== 'object') return out;
    Object.keys(raw).forEach(function (iid) {
      var item = items[iid];
      var sel = raw[iid];
      if (!item || !sel || typeof sel !== 'object') return;
      var clean = {};
      Object.keys(sel).forEach(function (oid) {
        if (!item.optById[oid]) return;
        var v = sel[oid];
        if (item.type === 'presence' ? (v === 'present' || v === 'absent') : v === true) clean[oid] = v;
      });
      if (item.type === 'single' && Object.keys(clean).length > 1) return;
      if (Object.keys(clean).length) out[iid] = clean;
    });
    return out;
  }

  // Parses the stored patient JSON -> { complaint, state } or null.
  function parseStoredState(json, items) {
    if (!json) return null;
    var raw;
    try { raw = JSON.parse(json); } catch (e) { return null; }
    if (!raw || typeof raw !== 'object' || typeof raw.complaint !== 'string') return null;
    return { complaint: raw.complaint, state: sanitizeState(raw.state, items) };
  }

  function serializeState(complaintId, state) {
    return JSON.stringify({ complaint: complaintId, state: state });
  }

  // Saved question order for one complaint, restricted to that complaint's history items.
  function sanitizeOrder(order, complaint) {
    if (!Array.isArray(order)) return null;
    var allowed = [];
    complaint.history.forEach(function (sec) { allowed = allowed.concat(sec.items); });
    var out = [];
    order.forEach(function (id) {
      if (allowed.indexOf(id) >= 0 && out.indexOf(id) < 0) out.push(id);
    });
    return out;
  }

  var api = {
    STATE_KEY: STATE_KEY,
    LAYOUT_KEY: LAYOUT_KEY,
    sanitizeState: sanitizeState,
    parseStoredState: parseStoredState,
    serializeState: serializeState,
    sanitizeOrder: sanitizeOrder,
    prepare: prepare,
    toggle: toggle,
    isEmpty: isEmpty,
    selectedOptions: selectedOptions,
    featureStatus: featureStatus,
    describeSelection: describeSelection,
    diseaseFeatures: diseaseFeatures,
    matchCount: matchCount,
    selectedTimecourses: selectedTimecourses,
    timecourseStatus: timecourseStatus,
    orderGroups: orderGroups,
    rankByMatches: rankByMatches,
    joinList: joinList,
    renderTemplate: renderTemplate,
    composeText: composeText
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.POMDCore = api;
})(this);

</script>
<script>
/*
 * POMD browser UI. All clinical content comes from window.POMD_DATA (built from data/);
 * all matching / text logic lives in core.js (window.POMDCore).
 * The current patient's selections are kept in localStorage (Core.STATE_KEY) and shared live with
 * the quick history page (dist/POMD-history.html); "New patient" clears them on both pages.
 */
(function () {
  'use strict';

  var Core = window.POMDCore;
  var DATA = Core.prepare(window.POMD_DATA);
  var items = DATA.items;
  var diseases = DATA.diseases;

  var complaint = DATA.complaints[0];
  var state = {};
  var openDiseaseId = null;
  var ddxSort = 'location'; // 'location' | 'matches' — a view preference, kept across New patient
  var clearArmTimer = null;

  var TC_SHORT = { acute: 'A', subacute: 'S', chronic: 'C' };
  var STATUS_ICON = { match: '✓', different: '≠', none: '○' };
  var STATUS_LABEL = { match: 'Match', different: 'Different', none: 'Not asked' };

  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ---------- shared patient state (localStorage) ----------

  // Storage may be unavailable (e.g. blocked, or Firefox isolating file:// pages); the page still works alone.
  function storageGet(key) {
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  }

  function storageSet(key, value) {
    try {
      if (value === null) window.localStorage.removeItem(key);
      else window.localStorage.setItem(key, value);
    } catch (e) { /* ignore */ }
  }

  function saveState() {
    storageSet(Core.STATE_KEY, Core.isEmpty(state) ? null : Core.serializeState(complaint.id, state));
  }

  // Loads the stored patient (switching complaint if needed); unknown complaint -> empty state.
  function loadState(json) {
    var s = Core.parseStoredState(json, items);
    var c = s && DATA.complaints.filter(function (x) { return x.id === s.complaint; })[0];
    if (c && c !== complaint) {
      complaint = c;
      $('complaint-select').value = c.id;
      buildLayout();
    }
    state = c ? s.state : {};
  }

  // ---------- static layout (rebuilt when the complaint changes) ----------

  function itemBlockHtml(itemId) {
    var item = items[itemId];
    var kind = item.type === 'multi' ? 'multi' : (item.type === 'presence' ? '+ / −' : '');
    var h = '<div class="item" data-item-block="' + esc(item.id) + '">';
    h += '<div class="item-head"><span class="item-label">' + esc(item.label) + '</span>';
    if (kind) h += '<span class="item-kind">' + kind + '</span>';
    h += '<button type="button" class="item-clear" data-clear="' + esc(item.id) + '" title="Clear this item">clear</button></div>';
    if (item.ask && item.ask.length) {
      h += '<ul class="ask">';
      item.ask.forEach(function (q) { h += '<li>' + esc(q) + '</li>'; });
      h += '</ul>';
    }
    h += '<div class="chips ' + item.type + '">';
    item.options.forEach(function (o) {
      h += '<button type="button" class="chip' + (o.red_flag ? ' rf' : '') + '" data-item="' + esc(item.id) +
        '" data-opt="' + esc(o.id) + '"' + (o.red_flag ? ' title="Red flag"' : '') + '>' + esc(o.label) + '</button>';
    });
    h += '</div></div>';
    return h;
  }

  function sectionsHtml(sections) {
    var h = '';
    sections.forEach(function (sec) {
      h += '<div class="section"><h3>' + esc(sec.section) + '</h3>';
      sec.items.forEach(function (id) { h += itemBlockHtml(id); });
      h += '</div>';
    });
    return h;
  }

  function suggestHtml(list) {
    return list.map(function (x) {
      return '<li><span class="s-name">' + esc(x.name) + '</span>' +
        (x.note ? '<span class="s-note">' + esc(x.note) + '</span>' : '') + '</li>';
    }).join('');
  }

  function buildLayout() {
    $('history').innerHTML = sectionsHtml(complaint.history);
    $('pe').innerHTML = sectionsHtml(complaint.pe);
    $('labs').innerHTML = suggestHtml(complaint.labs);
    $('imaging').innerHTML = suggestHtml(complaint.imaging);
  }

  function buildComplaintSelect() {
    var sel = $('complaint-select');
    sel.innerHTML = DATA.complaints.map(function (c) {
      return '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>';
    }).join('');
    sel.value = complaint.id;
  }

  // ---------- dynamic rendering ----------

  function updateChips() {
    var chips = document.querySelectorAll('.chip');
    for (var i = 0; i < chips.length; i++) {
      var c = chips[i];
      var v = (state[c.getAttribute('data-item')] || {})[c.getAttribute('data-opt')];
      c.classList.toggle('on', v === true);
      c.classList.toggle('present', v === 'present');
      c.classList.toggle('absent', v === 'absent');
      c.setAttribute('aria-pressed', v ? 'true' : 'false');
    }
    var blocks = document.querySelectorAll('[data-item-block]');
    for (var j = 0; j < blocks.length; j++) {
      blocks[j].classList.toggle('answered', !!state[blocks[j].getAttribute('data-item-block')]);
    }
  }

  function dxHtml(id, n, tcSel, groups) {
    var d = diseases[id];
    var cls = 'dx' + (n ? ' hit' : '') + (openDiseaseId === id ? ' open' : '');
    var h = '<li><button type="button" class="' + cls + '" data-disease="' + esc(id) + '"' +
      (d.must_not_miss ? ' title="Must-not-miss"' : '') + '>';
    h += '<span class="dx-name">' + esc(d.name);
    if (groups) h += '<span class="dx-groups">' + esc(groups.join(' \u00B7 ')) + '</span>';
    h += '</span><span class="dx-meta">';
    d.timecourse.forEach(function (t) {
      h += '<span class="tc' + (tcSel.indexOf(t) >= 0 ? ' on' : '') + '" title="' + t + '">' + TC_SHORT[t] + '</span>';
    });
    if (n) h += '<b class="count" title="typical features selected">' + n + '</b>';
    return h + '</span></button></li>';
  }

  function renderDdx() {
    var tcSel = Core.selectedTimecourses(complaint, state, items);
    var h = '';
    if (ddxSort === 'matches') {
      h += '<div class="group"><ul>';
      Core.rankByMatches(complaint, diseases, state, items).forEach(function (x) {
        h += dxHtml(x.id, x.n, tcSel, x.groups);
      });
      h += '</ul></div>';
    } else {
      Core.orderGroups(complaint, state).forEach(function (entry) {
        var g = entry.group;
        h += '<div class="group' + (entry.promoted ? ' promoted' : '') + '"><h3>' + esc(g.group) + '</h3><ul>';
        g.diseases.forEach(function (id) {
          h += dxHtml(id, Core.matchCount(diseases[id], state, items), tcSel, null);
        });
        h += '</ul></div>';
      });
    }
    $('ddx').innerHTML = h;
    var segs = document.querySelectorAll('[data-sort]');
    for (var i = 0; i < segs.length; i++) {
      var on = segs[i].getAttribute('data-sort') === ddxSort;
      segs[i].classList.toggle('on', on);
      segs[i].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  }

  function featureListHtml(features) {
    if (!features.length) return '<p class="muted">—</p>';
    var h = '<ul class="feats">';
    features.forEach(function (f) {
      var st = Core.featureStatus(f, state, items);
      h += '<li class="feat ' + st + '" title="' + STATUS_LABEL[st] + '"><span class="ic">' + STATUS_ICON[st] + '</span><span>' + esc(f.text);
      if (st === 'different') {
        h += '<span class="selected-now">selected: ' + esc(Core.describeSelection(f, state, items)) + '</span>';
      }
      h += '</span></li>';
    });
    return h + '</ul>';
  }

  function textListHtml(list) {
    if (!list.length) return '<p class="muted">—</p>';
    return '<ul class="plain">' + list.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>';
  }

  function renderCard() {
    var card = $('card');
    var d = openDiseaseId && diseases[openDiseaseId];
    if (!d) { card.hidden = true; card.innerHTML = ''; return; }
    var tcSel = Core.selectedTimecourses(complaint, state, items);
    var tcSt = Core.timecourseStatus(d, tcSel);
    var h = '<div class="card-head">';
    h += '<h2>' + esc(d.name) + '</h2>';
    h += '<button type="button" class="card-close" data-close-card title="Close (Esc)">×</button></div>';
    h += '<div class="card-badges">';
    if (d.must_not_miss) h += '<span class="badge mnm">Must-not-miss</span>';
    h += '<span class="badge status-' + esc(d.status) + '">' + esc(d.status) + '</span>';
    h += '<span class="badge tcb ' + tcSt + '" title="Typical time course vs. selected duration: ' + STATUS_LABEL[tcSt] + '">' +
      STATUS_ICON[tcSt] + ' ' + esc(d.timecourse.join(' / ')) + '</span></div>';
    h += '<p class="one-liner">' + esc(d.one_liner) + '</p>';
    h += '<p class="legend-feats"><span class="feat match"><span class="ic">' + STATUS_ICON.match + '</span>Match</span>' +
      '<span class="feat none"><span class="ic">' + STATUS_ICON.none + '</span>Not asked</span>' +
      '<span class="feat different"><span class="ic">' + STATUS_ICON.different + '</span>Different</span></p>';
    h += '<h3>Typical symptoms</h3>' + featureListHtml(d.symptoms);
    h += '<h3>Typical PE findings</h3>' + featureListHtml(d.pe);
    h += '<h3>Typical labs</h3>' + textListHtml(d.labs);
    h += '<h3>Recommended imaging / endoscopy</h3>' + textListHtml(d.imaging);
    h += '<h3>Pitfalls</h3>' + textListHtml(d.pitfalls);
    card.innerHTML = h;
    card.hidden = false;
  }

  function currentText() {
    return {
      hpi: Core.composeText(complaint.hpi, state, items),
      pe: Core.composeText(complaint.pe_text, state, items)
    };
  }

  function renderOutput() {
    var t = currentText();
    var empty = Core.isEmpty(state);
    $('out-hpi').textContent = empty ? '' : t.hpi;
    $('out-pe').textContent = t.pe;
    $('out-hpi').classList.toggle('placeholder', empty);
    $('out-pe').classList.toggle('placeholder', !t.pe);
  }

  function refresh() {
    updateChips();
    renderDdx();
    renderCard();
    renderOutput();
  }

  // ---------- actions ----------

  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      return Promise.resolve(ok);
    }
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, fallback);
    }
    return fallback();
  }

  function onCopy(which) {
    var t = currentText();
    var text = which === 'hpi' ? t.hpi : which === 'pe' ? t.pe : [t.hpi, t.pe].filter(Boolean).join('\n\n');
    var status = $('copy-status');
    if (Core.isEmpty(state) || !text) {
      status.textContent = 'Nothing to copy';
      return;
    }
    copyText(text).then(function (ok) {
      status.textContent = ok ? 'Copied ✓' : 'Copy failed — select the text and press Ctrl+C';
      status.className = ok ? 'ok' : 'fail';
      setTimeout(function () { status.textContent = ''; status.className = ''; }, 2500);
    });
  }

  function disarmClear() {
    var btn = $('btn-new');
    btn.classList.remove('armed');
    btn.textContent = 'New patient';
    clearTimeout(clearArmTimer);
    clearArmTimer = null;
  }

  // First click arms the button (only if something is selected); second click within 3 s clears.
  function onNewPatient() {
    var btn = $('btn-new');
    if (!Core.isEmpty(state) && !clearArmTimer) {
      btn.classList.add('armed');
      btn.textContent = 'Click again to clear';
      clearArmTimer = setTimeout(disarmClear, 3000);
      return;
    }
    disarmClear();
    state = {};
    openDiseaseId = null;
    saveState();
    ['col-history', 'col-pe', 'col-ddx'].forEach(function (id) { $(id).scrollTop = 0; });
    refresh();
  }

  function setComplaint(id) {
    complaint = DATA.complaints.filter(function (c) { return c.id === id; })[0] || DATA.complaints[0];
    state = {};
    openDiseaseId = null;
    saveState();
    buildLayout();
    refresh();
  }

  function onClick(ev) {
    var t = ev.target.closest('button');
    if (!t) return;
    if (t.hasAttribute('data-opt')) {
      Core.toggle(state, items[t.getAttribute('data-item')], t.getAttribute('data-opt'));
      saveState();
      refresh();
    } else if (t.hasAttribute('data-clear')) {
      delete state[t.getAttribute('data-clear')];
      saveState();
      refresh();
    } else if (t.hasAttribute('data-disease')) {
      var id = t.getAttribute('data-disease');
      openDiseaseId = openDiseaseId === id ? null : id;
      renderDdx();
      renderCard();
      if (openDiseaseId) $('card').scrollTop = 0;
    } else if (t.hasAttribute('data-close-card')) {
      openDiseaseId = null;
      renderDdx();
      renderCard();
    } else if (t.hasAttribute('data-sort')) {
      ddxSort = t.getAttribute('data-sort');
      renderDdx();
    } else if (t.hasAttribute('data-copy')) {
      onCopy(t.getAttribute('data-copy'));
    } else if (t.id === 'btn-new') {
      onNewPatient();
    }
  }

  // The disease card is positioned below the (possibly wrapped) top bar.
  function syncTopHeight() {
    document.documentElement.style.setProperty('--top-h', $('topbar').offsetHeight + 'px');
  }

  function init() {
    syncTopHeight();
    window.addEventListener('resize', syncTopHeight);
    // The quick history page's Submit targets this window by name.
    window.name = 'pomd-main';
    buildComplaintSelect();
    buildLayout();
    loadState(storageGet(Core.STATE_KEY));
    window.addEventListener('storage', function (ev) {
      if (ev.key !== Core.STATE_KEY && ev.key !== null) return;
      loadState(ev.key === null ? null : ev.newValue);
      disarmClear();
      refresh();
    });
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && openDiseaseId) {
        openDiseaseId = null;
        renderDdx();
        renderCard();
      }
    });
    var ask = $('toggle-ask');
    ask.checked = false;
    ask.addEventListener('change', function () {
      document.body.classList.toggle('show-ask', this.checked);
    });
    $('complaint-select').addEventListener('change', function () { setComplaint(this.value); });
    refresh();
  }

  init();
})();

</script>
</body>
</html>
